<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root{
  /* ---------- type scale ----------
     Six steps for every piece of text in the app. It used to run on seventeen
     sizes between 9.5 and 22, most of them half a pixel apart, which reads as
     drift rather than hierarchy. Icons, emoji and the big display numerals sit
     outside this scale on purpose, and inputs stay at 16px because anything
     smaller makes iOS Safari zoom the page when a field is focused. */
  --t1:11px;    /* وسم صغير، عدّاد */
  --t2:12.5px;  /* ملاحظة ثانوية */
  --t3:14px;    /* صف في قائمة */
  --t4:15.5px;  /* نص أساسي */
  --t5:17px;    /* عنوان قسم */
  --t6:22px;    /* عنوان صفحة */
  /* form controls sit outside the reading scale: iOS Safari zooms the whole page
     whenever a focused field is under 16px, and she has to pinch it back every time. */
  --tf:16px;

  --ink:#1F3A3D;
  --petrol:#2E5C5A;
  --petrol-dark:#1D3E3C;
  --parchment:#F6F1E7;
  --paper:#FFFDF8;
  --rose:#B24C63;
  --rose-dark:#8F3A4E;
  --gold:#C79A3C;
  --sage:#8FA998;
  --line:#DDD2BA;
}
*{box-sizing:border-box;}
input,select,textarea,button{min-width:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--parchment);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic',sans-serif;
  min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 100px;min-height:100vh;position:relative;}
h1,h2,h3{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;font-weight:700;}
.hidden{display:none!important;}
button{font-family:'IBM Plex Sans Arabic',sans-serif;cursor:pointer;border:none;}
input,select,textarea{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand .seal{width:34px;height:34px;border-radius:50%;background:var(--petrol);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:20px;flex-shrink:0;}
.brand h1{font-size:var(--t6);color:var(--petrol-dark);}
.date-chip{font-size:var(--t2);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--petrol-dark);}
.size-ctrl{display:flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:3px;flex-shrink:0;}
.size-ctrl button{width:28px;height:28px;border-radius:50%;background:none;color:var(--petrol-dark);font-weight:700;font-size:var(--t3);display:flex;align-items:center;justify-content:center;}
.size-ctrl button:active{background:var(--parchment);}
.size-ctrl button:disabled{opacity:.3;}

/* ---------- date navigator ---------- */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;}
.date-nav .arrow{width:34px;height:34px;border-radius:9px;background:var(--parchment);border:1px solid var(--line);color:var(--petrol-dark);font-size:16px;flex-shrink:0;}
.date-nav .arrow:hover{background:var(--sage);color:#fff;}
.date-nav .mid{flex:1;text-align:center;}
.date-nav .mid .dname{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:var(--t5);color:var(--petrol-dark);}
.date-nav .mid .ddate{font-size:var(--t1);color:#6b7a78;}
.date-nav input[type=date]{border:none;background:none;color:#6b7a78;font-size:var(--tf);width:26px;padding:0;opacity:0;position:absolute;}
.date-nav .picker{position:relative;}
.today-btn{font-size:var(--t1);background:var(--sage);color:#fff;padding:6px 10px;border-radius:8px;font-weight:700;flex-shrink:0;}
.browsing-badge{display:inline-block;font-size:var(--t1);background:rgba(178,76,99,.12);color:var(--rose-dark);padding:3px 10px;border-radius:20px;font-weight:700;margin-bottom:10px;}

/* ---------- cards ---------- */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 1px 0 rgba(31,58,61,0.03);
}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;justify-content:space-between;}

/* ---------- collapsible cards ---------- */
details.card{padding:0;}
details.card > summary{list-style:none;cursor:pointer;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
details.card > summary::-webkit-details-marker{display:none;}
details.card > summary h3{font-size:var(--t5);color:var(--petrol-dark);}
/* ---------- the one fold marker ----------
   Every foldable thing in the app says so the same way: a single chevron at the
   end of its summary line that rotates when it opens. It used to be said four
   ways — a rotating span here, a ▸/▾ glyph swapped inside the heading text
   there, a ::before arrow on two other kinds of panel — so the same gesture had
   to be relearned in each section. Works both inside a <details> and on the
   plain heading toggles, which carry .chev.open instead. */
.chev{font-size:var(--t2);color:var(--petrol);transition:transform .2s ease;flex-shrink:0;display:inline-block;}
details[open] > summary .chev, .chev.open{transform:rotate(180deg);}
@media (prefers-reduced-motion:reduce){ .chev{transition:none;} }
details.card > .details-body{padding:0 18px 18px;}
.card-title h3{font-size:var(--t5);color:var(--petrol-dark);}
.eyebrow{font-size:var(--t1);letter-spacing:.4px;color:var(--rose-dark);font-weight:700;margin-bottom:4px;display:block;}
.muted{color:#6b7a78;font-size:var(--t3);}
.quote-box{background:var(--parchment);border-right:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:10px;}
.quote-box p{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:var(--t5);color:var(--petrol-dark);margin:0;line-height:1.6;}

/* ---------- buttons ---------- */
.btn{
  background:var(--petrol);color:#fff;border-radius:10px;padding:12px 18px;
  font-size:var(--t4);font-weight:700;transition:transform .12s ease, background .15s ease;
}
.btn:hover{background:var(--petrol-dark);}
.btn:active{transform:scale(.97);}
.btn.rose{background:var(--rose);}
.btn.rose:hover{background:var(--rose-dark);}
.btn.ghost{background:transparent;color:var(--petrol);border:1.5px solid var(--petrol);}
.btn.ghost:hover{background:rgba(46,92,90,.06);}
.btn.sm{padding:7px 12px;font-size:var(--t2);border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;display:block;text-align:center;}
/* ---------- money-making paths ----------
   one block per path, so several chosen paths read as a scannable list instead
   of a wall: identity and progress on top, the single next step in the middle,
   its two actions under it, and everything else folded away. */
.path-block{
  border:1px solid var(--line);border-radius:12px;background:var(--parchment);
  padding:12px 14px;margin-bottom:10px;
}
/* the whole path folds: its name and progress stay on the summary line so a list
   of several paths reads at a glance, and the step, actions and details live
   inside. A static block (her own paths) keeps the same frame without folding. */
details.path-block > summary{cursor:pointer;list-style:none;user-select:none;}
details.path-block > summary::-webkit-details-marker{display:none;}
.path-body{padding-top:2px;}
.path-head{display:flex;align-items:center;gap:8px;}
.path-icon{font-size:var(--t5);flex-shrink:0;}
.path-name{flex:1;min-width:0;font-size:var(--t3);font-weight:700;color:var(--petrol-dark);}
.path-count{
  font-size:var(--t1);color:#6b7a78;font-variant-numeric:tabular-nums;
  white-space:nowrap;flex-shrink:0;
}
.path-bar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 10px;}
.path-bar span{display:block;height:100%;background:var(--sage);}
/* the next step is the thing to look at, so it carries the visual weight */
.path-tip{
  font-size:var(--t4);line-height:1.75;color:var(--ink);
  background:var(--paper);border-radius:8px;padding:10px 12px;margin:0 0 10px;
}
.path-actions{display:flex;gap:8px;flex-wrap:wrap;}
/* Everything a path knows, in the open path itself. It used to sit behind a third
   fold labelled "تفاصيل هالطريقة" — a heading that repeated where she already was,
   and buried the money target whose number was showing in the summary line above. */
/* project ledger, grouped by category so each line reads as a total */
.pl-group{border-bottom:1px dashed var(--line);}
.pl-group:last-of-type{border-bottom:none;}
.pl-group-head{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;padding:10px 2px;
  font-family:inherit;font-size:var(--t3);color:var(--ink);text-align:right;
}
.pl-group-head .grow{flex:1;min-width:0;font-weight:700;}
.pl-group-head b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.pl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pl-item{margin-inline-start:16px;}
.pl-item-head{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;padding:7px 2px;
  font-family:inherit;font-size:var(--t3);color:var(--ink);text-align:right;
}
.pl-item-head .grow{flex:1;min-width:0;}
.pl-item-head b{font-variant-numeric:tabular-nums;white-space:nowrap;}
.pl-single .inbox-row{padding-top:0;border-bottom:none;}
.pl-group .inbox-row, .pl-group .item-card{margin-inline-start:14px;}
.path-facts{
  margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--line);
}
.path-extra, .path-add{margin-top:10px;}
.path-extra > summary, .path-add > summary{
  cursor:pointer;list-style:none;font-size:var(--t2);color:var(--petrol);
  padding:5px 0;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.path-extra > summary .grow, .path-add > summary .grow, .q-note > summary .grow{flex:1;min-width:0;}
.path-extra > summary::-webkit-details-marker, .path-add > summary::-webkit-details-marker{display:none;}
.path-add{border-top:1px dashed var(--line);padding-top:6px;}
.path-add > summary{font-weight:700;}

/* the optional comment under a daily question — folded away so it costs nothing
   when unused, and the dot in the summary says when something is written inside */
.q-note{margin-top:6px;}
.q-note > summary{
  cursor:pointer;list-style:none;font-size:var(--t2);color:var(--petrol);
  padding:3px 0;user-select:none;
  display:flex;align-items:center;gap:6px;
}
.q-note > summary::-webkit-details-marker{display:none;}
.q-note textarea{margin-top:4px;min-height:52px;font-size:var(--tf);}

.linkish{background:none;border:none;padding:0;color:var(--petrol);font-size:inherit;text-decoration:underline;cursor:pointer;}
.icon-btn{background:none;color:var(--petrol);font-size:16px;padding:4px 8px;border-radius:6px;}
.icon-btn:hover{background:rgba(46,92,90,.08);}

/* ---------- inputs ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:var(--t3);font-weight:700;color:var(--petrol-dark);margin-bottom:6px;}
.field input[type=text], .field input[type=email], .field select, .field textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--parchment);font-size:16px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}

/* ---------- chips ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--parchment);
  font-size:var(--t3);font-weight:500;color:var(--ink);transition:all .15s ease;
}
.chip.selected{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:700;}
.chip.cat{font-size:var(--t3);}

/* ---------- task/habit rows ---------- */
.task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);}
.task-row:last-child{border-bottom:none;}
.check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--petrol);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--paper);position:relative;
}
.check.done{background:var(--gold);border-color:var(--gold);}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;}
.tag svg{vertical-align:-2px;margin-left:2px;}
.chip svg{vertical-align:-3px;margin-left:4px;}

/* ---------- simple rich-text editor (bold/italic/lists via execCommand) ---------- */
.rte-toolbar{display:flex;gap:6px;margin-bottom:6px;}
.rte-toolbar button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--parchment);color:var(--ink);font-size:14px;}
.rte-toolbar button:active{background:var(--sage);color:#fff;}
.rte-toolbar button.rte-italic{font-style:italic;}
.rte-editable{min-height:120px;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--parchment);font-size:16px;color:var(--ink);line-height:1.7;}
.rte-editable:focus{outline:2px solid var(--sage);outline-offset:1px;}
.rte-editable ul, .rte-editable ol{margin:0;padding-inline-start:22px;}
.task-title{flex:1;font-size:var(--t4);font-weight:700;}
.task-title.done{text-decoration:line-through;color:#9aa6a4;}
.tag{font-size:var(--t1);background:rgba(46,92,90,.09);color:var(--petrol-dark);padding:2px 8px;border-radius:10px;font-weight:700;}
.tag.p-عالية{background:rgba(178,76,99,.13);color:var(--rose-dark);}
.tag.p-متوسطة{background:rgba(199,154,60,.15);color:#8a6a1f;}

/* ---------- stamp ---------- */
.stamp-pop{
  position:fixed;top:50%;right:50%;transform:translate(50%,-50%) scale(.4) rotate(-18deg);
  opacity:0;pointer-events:none;z-index:50;transition:all .45s cubic-bezier(.2,1.4,.4,1);
}
.stamp-pop.show{opacity:1;transform:translate(50%,-50%) scale(1) rotate(-10deg);}
.stamp-pop svg{width:150px;height:150px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;right:0;left:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:40;
}
.nav-inner{max-width:640px;width:100%;display:flex;justify-content:space-around;}
.nav-btn{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b9694;font-size:var(--t1);font-weight:700;padding:4px 10px;border-radius:10px;}
.nav-btn.active{color:var(--petrol);}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

/* ---------- goal pill ---------- */
.goal-card{border-right:4px solid var(--sage);}

/* ---------- financial safety calculator ---------- */
.safety-calc .item-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);}
.safety-calc .item-row:last-of-type{border-bottom:none;}
.safety-calc .item-row select, .safety-calc .item-row input{background:var(--parchment);border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;font-size:var(--tf);font-family:inherit;color:var(--ink);}
.safety-calc .item-row .sel-item{flex:2;min-width:130px;}
.safety-calc .item-row .sel-custom{flex:2;min-width:110px;}
.safety-calc .item-row .sel-tag{flex:1.3;min-width:110px;}
.safety-calc .item-row .inp-amt{flex:1;min-width:75px;}
.safety-calc .item-row .del-row{background:none;border:none;color:#b9ad96;cursor:pointer;font-size:var(--t4);padding:6px;}
.safety-calc .item-row .del-row:hover{color:var(--rose);}
.item-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.item-card .card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.item-card .card-top select, .item-card .card-top input{flex:1;min-width:0;}
.item-card select, .item-card input{background:var(--parchment);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:var(--tf);font-family:inherit;color:var(--ink);width:100%;box-sizing:border-box;}
.item-card .del-row{background:none;border:none;color:#b9ad96;cursor:pointer;font-size:var(--t4);padding:6px;flex-shrink:0;}
.item-card .del-row:hover{color:var(--rose);}
.item-card .card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;}
.item-card .card-grid select, .item-card .card-grid input{min-width:0;text-overflow:ellipsis;}
.item-card .card-grid select{padding-left:6px;}
.item-card label{font-size:var(--t1);color:#6b7a78;display:block;margin-bottom:3px;}
.expense-diag .inbox-row{padding:8px 4px;}
.safety-calc .total-line{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.safety-calc .total-line .lbl{font-size:var(--t2);color:#6b7a78;}
.safety-calc .total-line .val{font-size:var(--t5);font-weight:800;color:var(--petrol-dark);}
.safety-calc .result-hero{border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;background:var(--petrol-dark);}
.safety-calc .result-hero .lbl{font-size:var(--t2);color:#c9c3af;margin-bottom:6px;}
.safety-calc .result-hero .val{font-size:28px;font-weight:900;color:#fff;font-family:'IBM Plex Sans Arabic',sans-serif;}
.safety-calc .result-hero .sub{font-size:var(--t1);color:#a9c9bb;margin-top:8px;line-height:1.6;}
.safety-calc .stats-grid, .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.safety-calc .stat-box, .stat-box{border-radius:12px;padding:10px 12px;}
.safety-calc .stat-box .p, .stat-box .p{font-size:15px;font-weight:900;}
.safety-calc .stat-box .l, .stat-box .l{font-size:var(--t1);margin-top:3px;}
.safety-calc .status-banner{border-radius:12px;padding:12px 14px;font-size:var(--t3);font-weight:700;text-align:center;margin-bottom:12px;line-height:1.6;}
.safety-calc .status-green{background:#e7f7ef;color:#1e6b4a;}
.safety-calc .status-yellow{background:#fdf6e3;color:#8a6d00;}
.safety-calc .status-red{background:rgba(178,76,99,.13);color:var(--rose-dark);}
/* the method behind the numbers — worth keeping, not worth reading every visit */
.assumption-note > summary{
  cursor:pointer;list-style:none;user-select:none;
  display:flex;align-items:center;gap:7px;
  font-size:var(--t2);color:var(--petrol);padding:2px 0;
}
.assumption-note > summary::-webkit-details-marker{display:none;}
.assumption-note > summary .grow{flex:1;min-width:0;}
.assumption-note > .details-body{padding:8px 0 0;}
.safety-calc .assumption-note{font-size:var(--t1);color:#6b7a78;background:var(--parchment);border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.7;}
.safety-calc .goals-total{border-radius:14px;padding:14px;background:#e8effb;text-align:center;margin-top:4px;}
.safety-calc .goals-total .v{font-size:20px;font-weight:900;color:#3f6fd1;}
.safety-calc .goals-total .l{font-size:var(--t1);color:#3f6fd1;margin-top:4px;}

/* ---------- monthly expense diagnosis ---------- */
.expense-diag .month-badge{display:inline-block;margin-top:4px;background:#e8effb;color:#274a8f;font-size:var(--t1);font-weight:700;padding:4px 12px;border-radius:99px;}
.expense-diag .alert{border-radius:12px;padding:10px 12px;font-size:var(--t2);margin-bottom:12px;font-weight:600;}
.expense-diag .alert.bad{background:rgba(178,76,99,.13);color:var(--rose-dark);}
.expense-diag .alert.ok{background:#e7f7ef;color:#1e6b4a;}
.expense-diag .bar{width:100%;height:16px;border-radius:99px;overflow:hidden;display:flex;background:var(--line);border:1px solid var(--line);margin-bottom:10px;}
.expense-diag .bar span{height:100%;}
.expense-diag .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:var(--t1);margin-bottom:14px;}
.expense-diag .legend .li{display:flex;align-items:center;gap:6px;}
.expense-diag .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.expense-diag .breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.expense-diag .bd-item{border-radius:12px;padding:9px 10px;}
.expense-diag .bd-item .p{font-size:16px;font-weight:900;}
.expense-diag .bd-item .l{font-size:var(--t1);margin-top:2px;}
.expense-diag .score-wrap{display:flex;align-items:center;gap:16px;}
.expense-diag .score-num{font-size:36px;font-weight:900;color:var(--petrol-dark);min-width:74px;text-align:center;font-family:'IBM Plex Sans Arabic',sans-serif;}
.expense-diag .score-bar-outer{flex:1;}
.expense-diag .score-bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px;}
.expense-diag .score-bar>div{height:100%;background:linear-gradient(90deg,#d9564a,#d99a1f,#2f9e6e);transition:width .5s;}
.expense-diag .score-label{font-size:var(--t2);font-weight:800;}
.expense-diag .top-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:var(--t2);}
.expense-diag .top-item:last-child{border-bottom:none;}
.expense-diag .top-item .rank{color:#6b7a78;margin-left:6px;}
.expense-diag .top-item .amt{font-weight:800;}
.expense-diag .tip{background:#e8effb;border-radius:12px;padding:10px 12px;font-size:var(--t2);margin-bottom:8px;color:#274a8f;line-height:1.7;}

/* mood */
.mood-scale{display:flex;justify-content:space-between;gap:6px;}
.mood-dot{flex:1;text-align:center;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);font-size:22px;background:var(--parchment);}
.mood-dot.selected{background:var(--petrol);border-color:var(--petrol);}
.mood-dot.selected .ml{color:#fff;}
.ml{display:block;font-size:10px;margin-top:3px;color:#6b7a78;font-weight:700;}

/* period tabs */
.period-tabs{display:flex;gap:6px;margin-bottom:8px;}
.period-tab{flex:1;text-align:center;padding:7px;border-radius:8px;background:var(--parchment);border:1px solid var(--line);font-size:var(--t2);font-weight:700;color:#6b7a78;}
.period-tab.active{background:var(--petrol);color:#fff;border-color:var(--petrol);}
/* how many tasks sit in each box, so a day's workload reads without tabbing through */
/* the three that matter most, sitting above the day's periods in the same card
   so a task is never listed twice on one screen */
.focus-strip{
  border:1.5px solid var(--sage);border-radius:12px;
  background:rgba(143,169,152,.09);
  padding:10px 12px;margin-bottom:12px;
}
.focus-head{
  display:flex;align-items:center;gap:6px;
  font-size:var(--t2);font-weight:700;color:var(--petrol-dark);margin-bottom:4px;
}
.focus-strip .task-row:last-of-type{border-bottom:none;}
/* the rest of the day folds away on its own, so the three that matter stay put */
.day-rest{margin-top:4px;}
.day-rest > summary{
  cursor:pointer;list-style:none;user-select:none;
  display:flex;align-items:center;gap:7px;
  font-size:var(--t2);font-weight:700;color:var(--petrol);
  padding:7px 0;border-top:1px dashed var(--line);
}
.day-rest > summary::-webkit-details-marker{display:none;}
.day-rest > summary .grow{flex:1;min-width:0;}
.day-rest > .details-body{padding:0;}
.ptab-count{display:inline-block;min-width:16px;padding:0 4px;margin-inline-start:3px;border-radius:9px;background:rgba(46,92,90,.14);color:var(--petrol-dark);font-size:var(--t1);line-height:16px;font-weight:700;}
.period-tab.active .ptab-count{background:rgba(255,255,255,.28);color:#fff;}

/* time-box color picker + management rows */
.color-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex-shrink:0;}
.color-dot.selected{border-color:var(--petrol-dark);box-shadow:0 0 0 2px var(--paper) inset;}
.tbox-row{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line);}
.tbox-row:last-of-type{border-bottom:none;}
.tbox-times{display:flex;align-items:center;gap:8px;}
.tbox-times input[type="time"]{flex:1;}
.tcat-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);}
.tcat-row:last-of-type{border-bottom:none;}
.tbox-row input[type="text"], .tbox-row input[type="time"], .tcat-row input[type="text"]{
  padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--parchment);font-size:var(--tf);color:var(--ink);
}
.tbox-row input:focus, .tcat-row input:focus{outline:2px solid var(--sage);outline-offset:1px;}
.habit-collapsed-row{display:block;width:100%;text-align:right;padding:8px 4px;font-size:var(--t2);color:#a3aeac;background:none;border:none;border-bottom:1px dashed var(--line);}
/* a dormant habit is still hers and still listed — just visibly asleep */
.habit-collapsed-row.dormant{opacity:.6;font-style:italic;}
.habit-collapsed-row:hover{color:var(--petrol-dark);}
.habit-progress-track{width:100%;height:8px;border-radius:99px;background:var(--line);overflow:hidden;}
.habit-progress-fill{height:100%;background:var(--sage);border-radius:99px;}

.empty{text-align:center;padding:26px 10px;color:#8b9694;font-size:var(--t3);}
/* second line of an empty state: what to do about it */
.empty .hint{display:block;margin-top:4px;font-size:var(--t2);opacity:.85;}
.empty.tight{padding:14px 10px;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-box{background:linear-gradient(135deg, rgba(46,92,90,.06), rgba(178,76,99,.06));border:1.5px dashed var(--petrol);}

/* habit rows in day view */
.habit-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap;}
.stagetask-edit{min-width:0;}
.habit-item:last-child{border-bottom:none;}
.hbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--sage);background:var(--paper);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.hbox.done{background:var(--sage);}
.hbox svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;}
.habit-label{flex:1;font-size:var(--t4);}
.habit-label.done{color:#9aa6a4;text-decoration:line-through;}

/* weekly habit table */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
.week-nav .lbl{font-size:var(--t2);color:var(--petrol-dark);font-weight:700;text-align:center;flex:1;}
.htable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.htable{border-collapse:collapse;width:100%;min-width:560px;font-size:var(--t2);}
table.htable th, table.htable td{padding:6px;text-align:center;border-bottom:1px solid var(--line);}
table.htable th{font-size:var(--t1);color:var(--petrol-dark);font-weight:700;}
table.htable th .d{display:block;font-size:9.5px;color:#8b9694;font-weight:400;}
table.htable td.habit-label-cell{text-align:right;font-size:var(--t2);padding-right:4px;white-space:nowrap;}
.gcheck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--sage);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;}
.gcheck.done{background:var(--sage);}
.gcheck svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;}
.gcheck.na{border-color:var(--line);background:var(--parchment);cursor:default;}
.pct-row td{font-weight:700;color:var(--petrol-dark);background:rgba(46,92,90,.04);}

/* inbox / brain-dump page */
.inbox-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);}
.inbox-row:last-child{border-bottom:none;}
.inbox-row .dot{width:7px;height:7px;border-radius:50%;background:var(--rose);flex-shrink:0;}
.inbox-row .txt{flex:1;font-size:var(--t4);}
.plan-item{background:var(--parchment);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
.plan-item .ptxt{font-size:var(--t4);font-weight:700;color:var(--petrol-dark);margin-bottom:6px;}
.plan-item .pnote{font-size:var(--t2);color:#6b7a78;margin-top:6px;line-height:1.6;}
.plan-item.excluded{opacity:.45;}
.plan-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--sage);background:var(--paper);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px;}
.plan-check.on{background:var(--sage);}
.plan-check svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;}
.plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

@media(max-width:400px){
  .brand h1{font-size:19px;}
  .mood-dot{font-size:18px;padding:8px 2px;}
}
</style>

<body>
<div id="app"></div>

<script>
/* ============ constants ============ */
const CATS = [
  {id:'health', label:'الصحة والجسم', icon:'🏃‍♀️'},
  {id:'hair', label:'الشعر والجمال', icon:'💇‍♀️'},
  {id:'finance', label:'الأمور المالية', icon:'💰'},
  {id:'selfdev', label:'تطوير الذات', icon:'📚'},
  {id:'career', label:'العمل والمهنة', icon:'💼'},
  {id:'business', label:'البزنس وزيادة الدخل', icon:'📈'},
  {id:'relationships', label:'العلاقات', icon:'❤️'},
  {id:'spiritual', label:'الروحانيات', icon:'🕊️'},
  {id:'other', label:'أخرى', icon:'✨'},
];
const CAT_MAP = Object.fromEntries(CATS.map(c=>[c.id,c]));
/* the CATS ids that count as "money work" — used by the finance overview counter
   so it never again hardcodes an id that a later rename could delete */
const MONEY_CAT_IDS = new Set(['finance','business']);

/* ============ the one expense vocabulary ============
   Both money tools read this: the safety calculator (what a month is *planned*
   to cost) and the expense diagnosis (what a month *actually* cost). They used
   to own separate lists — 20 items with a two-way tag vs 50 items with a
   five-way tag, only 11 names in common — so the same real expense was written
   two different ways and the plan could never be compared to the actual.
   One list, one tag system; anything coarser is derived, never re-entered. */
const EXPENSE_TAGS = {
  necessary: {label:"ضروري", emoji:"🟢", color:"#2f9e6e", bg:"#e7f7ef"},
  reducible: {label:"قابل للتقليل", emoji:"🟡", color:"#d99a1f", bg:"#fdf2dc"},

/* turns the old per-weekday embedded habit lists into unified habit entities
   ({id, label, link, days:[dow,...]}), preserving each day's relative order */
function extractHabitsFromTemplates(templates){
  const byLabel = {};
  const order = [];
  for(let dow=0; dow<7; dow++){
    const tpl = templates[dow];
    if(!tpl || !Array.isArray(tpl.habits)) continue;
    tpl.habits.forEach(raw=>{
      const h = (typeof raw==='string')? {label:raw, enabled:true} : raw;
      if(h.enabled===false) return;
      if(!byLabel[h.label]){ byLabel[h.label] = {id:uid(), label:h.label, link:h.link||null, days:[]}; order.push(h.label); }
      if(h.link && !byLabel[h.label].link) byLabel[h.label].link = h.link;
      if(!byLabel[h.label].days.includes(dow)) byLabel[h.label].days.push(dow);
    });
  }
  return order.map(l=>byLabel[l]);
}

/* stamped on every release so she can read, on the device itself, which version
   she is actually running — several rounds today were spent on "is this the new
   code or a cached copy?" with no way to tell from the screen */
const APP_BUILD = '2026-08-17 · 33';
const CLOUD_FILENAME = 'daftari-data.json';
let cloud = {token:'', gistId:'', linked:false};
let cloudStatus = 'idle'; /* idle | syncing | synced | error */
let cloudStatusMsg = '';
let cloudLastSync = null;

function hydrateState(parsed){
  state = Object.assign({name:'', onboarded:false, goals:[], tasks:[], dayTemplates: defaultTemplates(), dailyLogs:{}, tipIndex:{}, tipGoalIndex:0, tipLastDate:null, inbox:[], collapsed:{habits:false, questions:true, reflection:true, mood:true, schedule:true, suggestion:true, fgDetails:true}}, parsed);
  if(!state.dayTemplates) state.dayTemplates = defaultTemplates();
  if(!state.timeBoxes || !state.timeBoxes.length) state.timeBoxes = defaultTimeBoxes();
  state.timeBoxes.forEach(b=>{ if(!Array.isArray(b.categoryIds)) b.categoryIds = []; });
  if(!state.taskCategories || !state.taskCategories.length) state.taskCategories = defaultTaskCategories();
  /* Make the goal domains available as task categories too, so both pages can
     share one vocabulary — but only ever by ADDING what's missing.

     An earlier version of this replaced her category list with the CATS defaults
     and kept only ids it didn't recognise. Any category she had renamed or
     re-iconed while it kept its original id (work/business/project/family/
     personal/other) was therefore thrown away, and the tasks tagged with it were
     re-pointed elsewhere. That destroyed her own naming. Never again: her list is
     hers, nothing here removes or rewrites an entry, and merging duplicates is
     her call from the category editor. */
  {
    const have = new Set(state.taskCategories.map(c=>c.id));
    /* seeding used to re-add every built-in domain that was missing, which quietly
       undid her deletions — a category she removed was back the next time the app
       opened. Ones she deleted on purpose are remembered and stay gone. */
    if(!Array.isArray(state.removedCats)) state.removedCats = [];
    const removed = new Set(state.removedCats);
    CATS.forEach(c=>{ if(!have.has(c.id) && !removed.has(c.id)) state.taskCategories.push({...c}); });
    /* a time box remembers which categories belong to it. Deleting a category
       left its id sitting in that list for good — invisible in the editor, so
       there was no way to see it or clear it. */
    const live = new Set(state.taskCategories.map(c=>c.id));
    state.timeBoxes.forEach(b=>{
      if(Array.isArray(b.categoryIds)) b.categoryIds = b.categoryIds.filter(id=>live.has(id));
    });
  }
  if(!state.goalPillars || !state.goalPillars.length) state.goalPillars = defaultGoalPillars();
  (state.goals||[]).forEach(g=>{
    if(g.pillarId && !g.pillarIds){ g.pillarIds = [g.pillarId]; delete g.pillarId; }
    if(!g.pillarIds) g.pillarIds = [];
    if(!g.customPillars) g.customPillars = [];
    /* pillars she typed were held as loose text that displayed but grouped
       nothing. Each distinct wording becomes a real pillar, shared by every goal
       that used it, so goals she meant to file together finally sit together. */
    if(g.customPillars.length){
      g.customPillars.forEach(text=>{
        const val = String(text||'').trim();
        if(!val) return;
        let p = state.goalPillars.find(x=> x.label.trim() === val);
        if(!p){ p = {id:uid(), label:val, icon:'✨'}; state.goalPillars.push(p); }
        if(!g.pillarIds.includes(p.id)) g.pillarIds.push(p.id);
      });
      g.customPillars = [];
    }
    if(g.notes===undefined) g.notes = '';
    if(!g.attachments) g.attachments = [];
  });
  if(!state.lifeVision) state.lifeVision = {text:''};
  if(!state.projectLedger) state.projectLedger = [];
  if(state.projectLedgerClaimed==null) state.projectLedgerClaimed = 0;
  /* one-time rename so already-saved rows follow EXPENSE_GROUPS's item names
     instead of showing as an unmatched blank selection in their dropdown */
  const SC_ITEM_RENAMES = {
    "فواتير كهرباء":"كهرباء", "فواتير الماء":"ماء", "فواتير اتصالات":"إنترنت والجوال",
    "إيجارات سكن":"إيجار", "المدارس للأطفال":"مدارس", "مصروفات الأطفال":"مصروف الأبناء",
    "أقساط / ديون":"قروض / ديون / أقساط", "الاشتراكات الشهرية":"اشتراكات ترفيه",
    "طعام المطاعم":"مطاعم", "الرحلات":"سفر", "الهدايا":"هدايا",
  };
  if(state.safety && state.safety.expenses){
    state.safety.expenses.forEach(r=>{
      if(SC_ITEM_RENAMES[r.item]) r.item = SC_ITEM_RENAMES[r.item];
      if(!r.freq) r.freq = 'monthly';
    });
  }
  if(!state._expenseVocabV1){
    /* the safety calculator used to keep its own 20-item expense list with a
       two-way أساسي/غير أساسي tag, separate from the 50-item list on the
       expenses page. Both now read one shared vocabulary, so saved rows get
       remapped onto it. Nine of the old names were coarser roll-ups of several
       shared items; each lands on the most representative one and keeps its
       amount, so nothing is lost — just re-point any that read wrong. */
    const SC_TO_SHARED_EXPENSE = {
      "إنترنت والجوال":"إنترنت",
      "سيارة ومواصلات / تأمين":"بنزين",
      "قروض / ديون / أقساط":"قروض",
      "إصلاح أعطال":"صيانة المنزل",
      "الصحة والرياضة":"نادي رياضي",
      "الترفيه و الرغبات":"فعاليات",
      /* هوايات · حيوانات أليفة · تطوير ذات / دورات / كتب were added to the shared
         list under their existing names, so they need no remap */
    };
    /* custom rows carried the old two-way tag; map it onto the shared five-way one */
    const OLD_TAG_TO_SHARED = {essential:'necessary', nonessential:'reducible'};
    if(state.safety && state.safety.expenses){
      state.safety.expenses.forEach(r=>{
        if(SC_TO_SHARED_EXPENSE[r.item]) r.item = SC_TO_SHARED_EXPENSE[r.item];
        if(r.item && r.item !== SC_CUSTOM_VALUE && EXPENSE_TAG_OF[r.item]) r.tag = EXPENSE_TAG_OF[r.item];
        else if(OLD_TAG_TO_SHARED[r.tag]) r.tag = OLD_TAG_TO_SHARED[r.tag];
      });
    }
    state._expenseVocabV1 = true;
  }
  if(state.safety && state.safety.income){
    state.safety.income.forEach(r=>{ if(!r.freq) r.freq = SC_INCOME_ANNUAL_ITEMS.has(r.item) ? 'yearly' : 'monthly'; });
  }
  const ED_ITEM_RENAMES = { "سوبرماركت":"بقالة / لحوم" };
  if(state.expenseDiag){
    Object.values(state.expenseDiag).forEach(m=>{
      (m.rows||[]).forEach(r=>{ if(ED_ITEM_RENAMES[r.item]) r.item = ED_ITEM_RENAMES[r.item]; });
    });
  }
  if(!state.dailyLogs) state.dailyLogs = {};
  if(!state.inbox) state.inbox = [];
  if(!state.journal) state.journal = [];
  if(!state.collapsed) state.collapsed = {habits:false, questions:true, reflection:true, mood:true, schedule:true, suggestion:true, fgDetails:true};
  else state.collapsed = Object.assign({habits:false, questions:false, reflection:false, mood:false, suggestion:true, fgDetails:true}, state.collapsed);
  if(!state._collapseDefaultsV2){
    state.collapsed.questions = true;
    state.collapsed.mood = true;
    state.collapsed.reflection = true;
    state.collapsed.schedule = true;
    state._collapseDefaultsV2 = true;
  }
  Object.keys(state.dayTemplates).forEach(k=>{
    const tpl = state.dayTemplates[k];
    if(tpl && Array.isArray(tpl.habits)){
      tpl.habits = tpl.habits.map(h => (typeof h === 'string') ? {label:h, enabled:true} : h);
    }
    if(tpl && tpl.learningDomain===undefined) tpl.learningDomain = '';
    if(tpl && tpl.learningMode===undefined) tpl.learningMode = '';
  });
  if(!state.habits){
    /* one-time migration: habits used to live duplicated inside each weekday template;
       unify them into standalone entities with their own day list, and carry old
       per-day checkmarks (keyed by label) over to the new id-keyed scheme */
    state.habits = extractHabitsFromTemplates(state.dayTemplates);
    const labelToId = Object.fromEntries(state.habits.map(h=>[h.label,h.id]));
    Object.values(state.dailyLogs).forEach(log=>{
      if(!log.habits) return;
      const rekeyed = {};
      Object.keys(log.habits).forEach(label=>{
        const id = labelToId[label];
        if(id) rekeyed[id] = log.habits[label];
      });
      log.habits = rekeyed;
    });
  }
  state.habits.forEach(h=>{
    if(!Array.isArray(h.days)) h.days = [];
    if(h.link===undefined) h.link = null;
    /* dormant habits are kept with their history, just left out of the day and
       week views until she wakes them again — everything existing stays active */
    if(h.active===undefined) h.active = true;
  });
  (state.tasks||[]).forEach(t=>{
    if(t.recur && t.recur.length && !t.recurType) t.recurType = 'weekly';
    /* repair daily/monthly recurring tasks that the completion button used to
       flag as permanently done instead of done-for-today. Their completion date
       is kept (as lastDoneDate) so a task ticked today still reads as done
       today; the stale done flag, which a recurring task never consults, goes. */
    if(t.recurType && t.done){
      if(!t.lastDoneDate && t.doneAt) t.lastDoneDate = t.doneAt;
      t.done = false;
      t.doneAt = null;
    }
    if(t.longNote===undefined) t.longNote = '';
    if(!t.attachments) t.attachments = [];
  });
  /* after recurType has been filled in above, so a legacy weekly task isn't
     mistaken for a one-off and stripped of its date */
  releaseLapsedTasks();

  if(!state.dailyQuestions || !state.dailyQuestions.length) state.dailyQuestions = DEFAULT_QUESTIONS.map(q=>({...q}));
  state.dailyQuestions.forEach(q=>{
    if(!q.id) q.id = uid();
    /* an inactive question keeps its past answers, it just stops being asked */
    if(q.active===undefined) q.active = true;
  });
  if(state.questionsTitle===undefined) state.questionsTitle = DEFAULT_QUESTIONS_TITLE;
  if(!state.moods || !state.moods.length) state.moods = MOODS.map(m=>({...m, active:true}));
  state.moods.forEach(m=>{
    if(!m.id) m.id = uid();
    if(m.label===undefined) m.label = m.id;
    if(m.icon===undefined) m.icon = m.e || '🌿'; /* 'e' was the original field name */
    if(m.active===undefined) m.active = true;
  });
  if(state.moodTitle===undefined) state.moodTitle = DEFAULT_MOOD_TITLE;
  if(!state.homeCards) state.homeCards = {};
  /* the feelings card had its own on/off switch before the day page as a whole
     became configurable; fold that choice into the one map so there is a single
     answer to "is this card showing" */
  if(state.moodSectionOn===false && state.homeCards.mood===undefined) state.homeCards.mood = false;
  delete state.moodSectionOn;

  /* fold state survives a reload now, so it also has to be swept: a key is
     "<kind>:<id>" and the id can be deleted long after the key was written. */
  openSections = Object.assign({}, state.openSections || {});
  const liveIds = new Set([
    ...(state.goals||[]).map(g=>g.id),
    ...(state.habits||[]).map(h=>h.id),
    ...(state.dailyQuestions||[]).map(q=>q.id),
    ...(state.taskCategories||[]).map(c=>c.id),
    ...(state.goalPillars||[]).map(p=>p.id),
    ...(((state.financialGoal||{}).customPaths)||[]).map(c=>c.id),
    ...(state.tasks||[]).map(t=>t.id),
  ]);
  /* these group by a category *name*, not by an item id, so there is no id to
     outlive — sweeping them would wipe her fold choices on every load */
  const NAME_KEYED = /^(plGroup|plPath|plItem|edGroup):/;
  const sweep = obj=>{
    Object.keys(obj||{}).forEach(k=>{
      const i = k.indexOf(':');
      if(i<0) return;                       /* a fixed section, not a per-item key */
      if(NAME_KEYED.test(k)) return;
      const id = k.slice(i+1);
      if(id==='__none__' || id==='') return; /* the catch-all buckets are permanent */
      if(/^\d{4}-\d{2}-\d{2}$/.test(id)) return; /* date-keyed groups age out on their own */
      if(!liveIds.has(id) && !FINANCE_PATHS.some(p=>p.id===id)) delete obj[k];
    });
  };
  sweep(openSections);
  sweep(state.collapsed);
  state.openSections = openSections;
  if(!state.actionTypes || !state.actionTypes.length) state.actionTypes = ACTION_TYPES.slice();
  /* answers used to be a positional array, so editing or reordering the question
     list would have re-pointed every past answer at the wrong question. They are
     keyed by question id now; the old array is left untouched as a raw copy since
     it is three short strings a day and costs nothing to keep. */
  Object.values(state.dailyLogs||{}).forEach(log=>{
    if(!log.answersById){
      log.answersById = {};
      (log.answers||[]).forEach((a,i)=>{
        const q = DEFAULT_QUESTIONS[i];
        if(a && q) log.answersById[q.id] = a;
      });
    }
    if(!log.commentsById) log.commentsById = {};
  });
  /* the separate answer box is gone — the comment is the only writing space now.
     Anything already written as an answer moves into the comment so it stays
     reachable; where both held text the answer is appended rather than dropped. */
  if(!state._qAnswersMergedV1){
    Object.values(state.dailyLogs||{}).forEach(log=>{
      Object.keys(log.answersById||{}).forEach(qid=>{
        const ans = (log.answersById[qid]||'').trim();
        if(!ans) return;
        const note = (log.commentsById[qid]||'').trim();
        log.commentsById[qid] = note? (note + '\n' + ans) : ans;
      });
    });
    state._qAnswersMergedV1 = true;
  }
  if((parsed.todayMood && parsed.todayMood.length) || parsed.reflection){
    const d = parsed.lastActiveDate || todayStr();
    const log = getLog(d);
    if(parsed.todayMood) log.mood = parsed.todayMood;
    if(parsed.reflection) log.reflection = parsed.reflection;
  }
}

function ghHeaders(extra){
  return Object.assign({ 'Authorization':'token '+cloud.token, 'Accept':'application/vnd.github+json' }, extra||{});
}
async function cloudPull(){
  if(!cloud.linked) return false;
  cloudStatus='syncing'; cloudStatusMsg='';
  try{
    const res = await fetch('https://api.github.com/gists/'+cloud.gistId, { headers: ghHeaders() });
    if(!res.ok) throw new Error('فشل الاتصال بالسحاب (كود '+res.status+')');
    const data = await res.json();
    const file = data.files && data.files[CLOUD_FILENAME];
    if(!file) throw new Error('ما لقيت ملف البيانات داخل الـ Gist، تأكدي من اسم الملف.');
    const parsed = JSON.parse(file.content || '{}');
    if(parsed && typeof parsed==='object' && Array.isArray(parsed.tasks)){
      hydrateState(parsed);
      try{ await persistState(); }catch(e){ noteStorageFailure(e); }
    }
    /* remember which revision this device is now based on, so a later push can
       tell whether anything else wrote in the meantime */
    cloudBaseVersion = (data.history && data.history[0] && data.history[0].version) || null;
    cloudConflict = null;
    cloudStatus='synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud pull error', e);
    cloudStatus='error'; cloudStatusMsg = friendlyErr(e);
    return false;
  }
}
/* ---- revision history ----
   Every cloudPush writes a new Gist revision, so the Gist is a full backup
   timeline. These let her look inside an older revision and put it back — the
   safety net for a bad sync, an accidental delete, or a migration that ate
   something it shouldn't have. */
async function fetchGistRevisions(){
  const res = await fetch('https://api.github.com/gists/'+cloud.gistId, { headers: ghHeaders() });
  if(!res.ok) throw new Error('ما قدرت أجيب النسخ السابقة (كود '+res.status+')');
  const data = await res.json();
  return (data.history || []).slice(0, 30);
}
async function fetchRevisionState(version){
  const res = await fetch('https://api.github.com/gists/'+cloud.gistId+'/'+version, { headers: ghHeaders() });
  if(!res.ok) throw new Error('ما قدرت أفتح هذي النسخة (كود '+res.status+')');
  const data = await res.json();
  const file = data.files && data.files[CLOUD_FILENAME];
  if(!file) throw new Error('ما فيه ملف بيانات داخل هذي النسخة.');
  let content = file.content;
  /* GitHub truncates large file bodies in the API response and gives a raw_url instead */
  if(file.truncated && file.raw_url) content = await (await fetch(file.raw_url)).text();
  const parsed = JSON.parse(content || '{}');
  if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.tasks)) throw new Error('محتوى هذي النسخة غير صالح.');
  return parsed;
}
function summariseRevision(version, s){
  const names = (arr, key)=> (arr||[]).map(x=>x[key]).filter(Boolean).join('، ');
  return {
    version,
    tasks:(s.tasks||[]).length, goals:(s.goals||[]).length,
    cats:(s.taskCategories||[]).length, pillars:(s.goalPillars||[]).length,
    journal:(s.journal||[]).length,
    catLabels: names(s.taskCategories,'label'),
    pillarLabels: names(s.goalPillars,'label'),
  };
}
let cloudPushInFlight = 0;
let lastLocalSaveAt = 0;
let cloudBaseVersion = null; /* the gist revision this device's state is based on */
let pushedThisSession = false;
let cloudConflict = null; /* {remoteVersion, when, theirTasks, myTasks} — another device wrote; wait for her call */
async function cloudPush(){
  if(!cloud.linked) return false;
  if(cloudConflict) return false; /* stay put until she says which side wins */
  cloudStatus='syncing'; cloudStatusMsg='';
  cloudPushInFlight++;
  try{
    /* Before the first upload of a session, check the cloud is still where this
       device left it. Two devices used offline would otherwise both push and the
       later one would erase the earlier one's work with no trace. Only the first
       push needs the check — after that this device owns the newest revision. */
    if(!pushedThisSession && cloudBaseVersion){
      const head = await fetch('https://api.github.com/gists/'+cloud.gistId, { headers: ghHeaders() });
      if(head.ok){
        const info = await head.json();
        const remote = (info.history && info.history[0] && info.history[0].version) || null;
        if(remote && remote !== cloudBaseVersion){
          const f = info.files && info.files[CLOUD_FILENAME];
          let theirs = null;
          try{ theirs = JSON.parse((f && f.content) || '{}'); }catch(e){}
          cloudConflict = {
            remoteVersion: remote,
            when: info.updated_at,
            theirTasks: (theirs && theirs.tasks || []).length,
            myTasks: (state.tasks||[]).length,
          };
          cloudStatus='error';
          cloudStatusMsg='جهاز ثاني عدّل بياناتك بعد آخر مزامنة لهذا الجهاز.';
          return false;
        }
      }
    }
    const res = await fetch('https://api.github.com/gists/'+cloud.gistId, {
      method:'PATCH',
      headers: ghHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ files:{ [CLOUD_FILENAME]:{ content: JSON.stringify(state) } } })
    });
    if(!res.ok) throw new Error('فشل الرفع للسحاب (كود '+res.status+')');
    try{
      const saved = await res.json();
      cloudBaseVersion = (saved.history && saved.history[0] && saved.history[0].version) || cloudBaseVersion;
    }catch(e){}
    pushedThisSession = true;
    cloudStatus='synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud push error', e);
    cloudStatus='error'; cloudStatusMsg = friendlyErr(e);
    return false;
  }finally{
    cloudPushInFlight--;
  }
}

/* cloudPull only ever ran on initial app load or a manual tap — a second device's
   edits never showed up on this one until it was closed and reopened. This polls
   in the background (and on resume-from-background) so linked devices stay in
   sync while both are actually open, without yanking focus away from a field
   the user is mid-typing in.
   Guarded against a real bug this caused: a pull landing while a push from a
   very recent local edit (a row just added, an amount just typed) was still
   in flight — or before GitHub's read had caught up with that write — could
   fetch a slightly stale snapshot and hydrateState() would silently wipe the
   unsynced edit or revert an amount. Skip the pull while a push is in flight
   or shortly after any local save, so her own edit always wins the race. */
function startAutoCloudSync(){
  if(window.__autoCloudSyncBound) return;
  window.__autoCloudSyncBound = true;
  const tick = ()=>{
    if(!cloud.linked || document.visibilityState!=='visible') return;
    if(cloudPushInFlight>0 || (Date.now()-lastLocalSaveAt) < 5000) return;
    const active = document.activeElement;
    const typing = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    cloudPull().then(()=>{ if(!typing) render(); });
  };
  setInterval(tick, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') tick(); });
}
async function loadState(){
  loadCloudCfg();
  let usedCloud = false;
  if(cloud.linked){ usedCloud = await cloudPull(); }
  if(!usedCloud){
    /* IndexedDB is the real store; localStorage is the older location and the
       fallback copy. Read the richer one — an existing install has its data only
       in localStorage on this first run, and gets written across below. */
    let fromIdb = null, fromLocal = null;
    try{ const raw = await idbGet(); if(raw) fromIdb = JSON.parse(raw); }
    catch(e){ console.error('تعذر القراءة من IndexedDB', e); }
    try{ const raw = localStorage.getItem('plannerState'); if(raw) fromLocal = JSON.parse(raw); }
    catch(e){ console.error('تعذر القراءة من التخزين المحلي', e); }

    /* prefer IndexedDB, except where it holds nothing and localStorage does. Never
       let an attachment-stripped fallback copy overwrite a full one. */
    let chosen = fromIdb || fromLocal;
    if(fromIdb && fromLocal && !fromLocal._slim && !(fromIdb.tasks||[]).length && (fromLocal.tasks||[]).length) chosen = fromLocal;
    hydrateState(chosen || {});
    if(chosen && chosen !== fromIdb){
      try{ await idbPut(JSON.stringify(state)); }catch(e){ console.error('تعذر الترحيل لـ IndexedDB', e); }
    }
  }
  storageReady = true;
  selectedDate = todayStr();
  weekRef = todayStr();
  render();
  startAutoCloudSync();
}
/* ---- local store ----
   The state lives in IndexedDB, not localStorage. Attachments are held inside the
   state as base64, which inflates them by a third, so roughly four files were
   enough to exhaust localStorage's ~5MB and every save after that failed.
   IndexedDB's quota is orders of magnitude larger, and keeping attachments in the
   state means they still travel through the gist to her other devices.

   localStorage is still written as a fallback copy, minus attachments so it always
   fits. It is only read if IndexedDB is unavailable or empty, which also carries
   existing installs across on first load. */
const IDB_NAME = 'daftari', IDB_STORE = 'state', IDB_KEY = 'plannerState';
let idbHandle = null;
function idbOpen(){
  if(idbHandle) return idbHandle;
  idbHandle = new Promise((resolve, reject)=>{
    if(!window.indexedDB) return reject(new Error('IndexedDB غير متاح'));
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error || new Error('تعذر فتح قاعدة البيانات'));
  }).catch(e=>{ idbHandle = null; throw e; });
  return idbHandle;
}
function idbPut(value){
  return idbOpen().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, IDB_KEY);
    tx.oncomplete = ()=> resolve();
    tx.onabort = tx.onerror = ()=> reject(tx.error || new Error('فشل الحفظ'));
  }));
}
function idbGet(){
  return idbOpen().then(db => new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error || new Error('فشل القراءة'));
  }));
}
/* the fallback copy leaves attachments out — they are the only thing big enough to
   overflow, and a backup missing them still beats no backup at all */
function stateWithoutAttachments(){
  const slim = JSON.parse(JSON.stringify(state));
  (slim.tasks||[]).forEach(t=>{ if(t.attachments && t.attachments.length) t.attachments = []; });
  (slim.goals||[]).forEach(g=>{ if(g.attachments && g.attachments.length) g.attachments = []; });
  slim._slim = true;
  return slim;
}
/* the single place the state is written to this device */
async function persistState(){
  const json = JSON.stringify(state);
  await idbPut(json);
  /* best effort only — a full localStorage must not fail a save that IndexedDB accepted */
  try{ localStorage.setItem('plannerState', JSON.stringify(stateWithoutAttachments())); }
  catch(e){ try{ localStorage.removeItem('plannerState'); }catch(e2){} }
}
function noteStorageFailure(e){
  const quota = e && (e.name==='QuotaExceededError' || e.name==='NS_ERROR_DOM_QUOTA_REACHED' || e.code===22 || e.code===1014);
  storageError = {
    quota,
    msg: quota ? 'امتلأت مساحة التخزين على هذا الجهاز.' : 'ما قدرت أحفظ على هذا الجهاز: ' + friendlyErr(e),
  };
  console.error('تعذر الحفظ', e);
}
async function saveState(){
  lastLocalSaveAt = Date.now();
  try{
    await persistState();
    if(storageError){ storageError = null; paintStorageWarning(); }
  }catch(e){
    /* never swallow this. A failed write used to be logged to the console and
       nothing else, so the screen kept showing edits that were never stored and
       the whole session was lost on reload with no warning at any point. */
    noteStorageFailure(e);

     status is shown) is actually open — otherwise this silently steals focus from
     whatever input the user is still typing in, elsewhere in the app */
  if(cloud.linked){ cloudPush().then(()=>{ if(settingsOpen) render(); }); }
}
/* a second device wrote since this one last synced. Both versions exist, so the

/* ============ scoring: top tasks ============ */
function scoreTask(t){
  /* priority is the primary ranking factor (wide 10-point tiers) — an "عالية" task
     always outranks "متوسطة"/"منخفضة" ones; due-date urgency only breaks ties
     within the same priority tier, it can no longer bump a low-priority-but-overdue
     task above a high-priority one */
  let s = 0;
  s += t.priority==='عالية'?30:t.priority==='متوسطة'?20:10;
  if(t.goalId) s += 1;
  if(t.due === todayStr()) s += 2;
  if(t.due && t.due < todayStr()) s += 3;
  return s;
}
/* ============ time boxes ============ */
function timeBoxOf(id){ return state.timeBoxes.find(b=>b.id===id) || null; }
/* the time box a task's category should default into, if that category is linked to one */
function timeBoxForCategory(catId){
  if(!catId) return null;
  return state.timeBoxes.find(b=> (b.categoryIds||[]).includes(catId)) || null;
}
function timeToMins(hhmm){ const [h,m] = (hhmm||'0:0').split(':').map(Number); return h*60+(m||0); }
/* returns the id of the time box whose [start,end) range contains the current clock time,
   used to pre-select the right box when a task is added without an explicit period */
function currentTimeBoxId(){
  const now = new Date().getHours()*60 + new Date().getMinutes();
  const box = state.timeBoxes.find(b=>{
    const s = timeToMins(b.start), e = timeToMins(b.end);
    return e>s ? (now>=s && now<e) : (now>=s || now<e); /* handles a box that wraps past midnight */
  });
  return box ? box.id : (state.timeBoxes[0]? state.timeBoxes[0].id : null);
}
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function timeBoxTagStyle(box){
  return box ? `style="background:${hexToRgba(box.color,.15)};color:${box.color};"` : '';
}

/* recurring tasks (daily / weekly on chosen weekdays / monthly on a chosen day-of-month)
   track completion via lastDoneDate instead of the plain done flag, so they automatically
   reappear on their next scheduled occurrence */
/* "is this task done for the given day?" — only recurring tasks have a per-day
   answer; a one-off task is finished once and stays finished on every view. */
function taskDoneOnDate(t, dateStr){
  if(t.recurType) return t.lastDoneDate === dateStr;
  return !!t.done;
}
/* "the 31st of every month" has to mean something in a 30-day month, or the task
   silently skips five months a year (Feb/Apr/Jun/Sep/Nov). A day past the end of
   the month lands on that month's last day, which is what a monthly bill or
   review actually means. */
function monthlyRecurHitsDate(t, dateStr){
  const d = parseISO(dateStr);
  const wanted = t.recurMonthDay;
  if(!wanted) return false;
  const lastDayOfMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return d.getDate() === Math.min(wanted, lastDayOfMonth);
}
function taskDoneToday(t){ return taskDoneOnDate(t, todayStr()); }
function taskActiveToday(t){
  if(!t.recurType){
    /* parked after missing its day — it waits in its goal's list, not in today's */
    if(taskAwaitingDate(t)) return false;
    /* a task explicitly scheduled for a future date isn't today's business yet —
       only surface it once its due date arrives (or if it's overdue, or dateless) */
    if(t.due && t.due > todayStr()) return false;
    return true;
  }
  if(t.recurStart && todayStr() < t.recurStart) return false;
  if(t.recurEnd && todayStr() > t.recurEnd) return false;
  if(t.recurType==='daily') return true;
  if(t.recurType==='weekly') return !!(t.recur && t.recur.includes(new Date().getDay()));
  if(t.recurType==='monthly') return monthlyRecurHitsDate(t, todayStr());
  return true;
}
/* tasks explicitly scheduled for a given date (due that day, or recurring on it) — narrower
   than taskActiveToday's open-ended backlog, used for the "done out of planned" progress stat */
function tasksPlannedForDate(dateStr){
  const dow = parseISO(dateStr).getDay();
  return state.tasks.filter(t=>{
    if(t.recurType){
      if(t.recurStart && dateStr < t.recurStart) return false;
      if(t.recurEnd && dateStr > t.recurEnd) return false;
      if(t.recurType==='daily') return true;
      if(t.recurType==='weekly') return !!(t.recur && t.recur.includes(dow));
      if(t.recurType==='monthly') return monthlyRecurHitsDate(t, dateStr);
      return false;
    }
    if(t.due) return t.due === dateStr;
    if(taskAwaitingDate(t)) return false; /* parked until she re-dates it */
    /* no explicit due date: a task just tagged to a time-of-day slot (صباح/ظهر/مساء) is
       still meant for today, same as how "جدول يومك" surfaces it by period */
    if(!t.period || dateStr!==todayStr()) return false;
    return t.done? t.doneAt===dateStr : true;
  });
}
function tasksDoneCountForDate(dateStr, planned){
  return planned.filter(t=> t.recurType? t.lastDoneDate===dateStr : (t.done && t.doneAt===dateStr)).length;
}
/* what a browsed day actually lists. A recurring task is a standing commitment
   going forward, not a record of the past — offering one on a day that has
   already gone by invites ticking a box for a day she can no longer act on. So
   past days show only dated tasks. The progress stats keep reading
   tasksPlannedForDate, where a missed recurrence still counts as planned. */
function tasksShownForDate(dateStr){
  const isPast = dateStr < todayStr();
  return tasksPlannedForDate(dateStr).filter(t=> !(isPast && t.recurType));
}
/* a non-urgent task that slipped past its day is parked without a date until she
   gives it a new one, so it stops appearing in any day view meanwhile */
function taskAwaitingDate(t){ return !!t.lapsedFrom && !t.due; }
/* Urgent tasks are meant to nag, so they keep their overdue behaviour. Everything
   else that missed its day loses the date rather than piling into today and
   tomorrow; the day it slipped from is kept so the row can say so. */
function releaseLapsedTasks(){
  const today = todayStr();
  let changed = false;
  (state.tasks||[]).forEach(t=>{
    if(t.recurType || t.done || t.priority==='عالية') return;
    if(t.due && t.due < today){
      t.lapsedFrom = t.due;
      t.due = null;
      changed = true;
    }
  });
  return changed;
}
/* "أهم 3 مهام لليوم" only ever shows real عالية-priority tasks — no padding
   with متوسطة/منخفضة ones just to fill 3 slots */
function urgentOpenToday(){
  return state.tasks.filter(t=> !taskDoneToday(t) && taskActiveToday(t) && t.priority==='عالية');
}
/* ordered by where they fall in the day (صباح ← ظهر ← مساء) so the three read as
   a route through the day rather than a ranking; anything with no time box sits
   last, and score only separates tasks sharing a box */
function periodRank(t){
  const i = state.timeBoxes.findIndex(b=>b.id===t.period);
  return i<0? 99 : i;
}
function byDayOrder(a,b){ return (periodRank(a)-periodRank(b)) || (scoreTask(b)-scoreTask(a)); }
function topTasks(){
  const log = getLog(todayStr());
  if(log.pinnedTop3 && log.pinnedTop3.length){
    const pinned = log.pinnedTop3.map(id=> state.tasks.find(t=>t.id===id && !taskDoneToday(t))).filter(Boolean);
    if(pinned.length) return pinned.slice().sort(byDayOrder);
  }
  return urgentOpenToday().sort(byDayOrder).slice(0,3);
}
function topTasksHasTie(){
  const undone = urgentOpenToday().sort(byDayOrder);
  if(undone.length<4) return false;
  /* only a real toss-up if the fourth sits in the same box with the same score */
  return periodRank(undone[2])===periodRank(undone[3]) && scoreTask(undone[2])===scoreTask(undone[3]);
}
/* only worth surfacing "أهم 3 مهام" when something's actually urgent — a real
   high-priority task, or a top-3 she pinned herself (her own judgment stands
   regardless of priority) */
function hasUrgentToday(){
  const log = getLog(todayStr());
  if(log.pinnedTop3 && log.pinnedTop3.length) return true;
  return state.tasks.some(t=>!taskDoneToday(t) && taskActiveToday(t) && t.priority==='عالية');
}
/* same check for a specific (usually future) date being browsed, so its section
   title can call out an urgent task the same way today's card does */
function hasUrgentOnDate(dateStr){
  return state.tasks.some(t=> t.due===dateStr && t.priority==='عالية' && !(t.recurType? t.lastDoneDate===dateStr : t.done));
}
/* swaps a habit with its neighbor among habits active on the same day, keeping their
   relative order in other days intact since it swaps the two absolute positions
   in the single shared state.habits array */
/* one place decides whether a habit counts as live, so the day card, the weekly
   grid and every completion tally can never disagree about it */
function habitIsActive(h){ return h.active !== false; }
function habitsForDow(dow){ return state.habits.filter(h=> habitIsActive(h) && h.days.includes(dow)); }
function moveHabitInDow(dow, habitId, dir){
  const dayHabits = habitsForDow(dow);
  const pos = dayHabits.findIndex(h=>h.id===habitId);
  const swapTarget = dayHabits[pos+dir];
  if(pos===-1 || !swapTarget) return;
  const i1 = state.habits.findIndex(h=>h.id===habitId);
  const i2 = state.habits.findIndex(h=>h.id===swapTarget.id);
  const tmp = state.habits[i1]; state.habits[i1]=state.habits[i2]; state.habits[i2]=tmp;
  saveState(); render();
}

        </div>
      </div>
      <div class="field">
        <label>مجال الهدف — أي نوع شغل هو؟</label><p class="muted" style="margin:-2px 0 8px;font-size:var(--t2);">يجمع مهام هذا الهدف بصفحة المهام، وهو نفس تصنيف المهام.</p>
        <div class="chip-row" id="gwCats">
          ${state.taskCategories.map(c=>`<button type="button" class="chip cat ${goalWizard.cat===c.id?'selected':''}" data-cat="${c.id}">${c.icon} ${c.label}</button>`).join('')}
        </div>
      </div>
      <hr style="border:none;border-top:1px dashed var(--line);margin:16px 0;">
      <span class="eyebrow">عشان أساعدك أبني مهامك اليومية</span>
      ${qs.map((q,i)=>`
        <div class="field">
          <label>${q}</label>
          <textarea id="gwAns${i}" placeholder="اكتبي إجابتك هنا…">${escapeHtml(goalWizard.answers[i]||'')}</textarea>

      <hr style="border:none;border-top:1px dashed var(--line);margin:16px 0;">
      <div class="field">

      </div>

          ${goalWizard.attachments.map((a,i)=>`

function attachGoalWizardEvents(){
  document.querySelectorAll('#gwCats .chip').forEach(b=>{
    b.onclick = ()=>{
      goalWizard.title = document.getElementById('gwTitle').value;
      goalWizard.cat = b.dataset.cat;
      goalWizard.answers = ['',''];
      render();
    };
  });
  document.querySelectorAll('#gwPillars .chip').forEach(b=>{
    b.onclick = ()=>{
      goalWizard.title = document.getElementById('gwTitle').value;
      goalWizard.pillarIds = goalWizard.pillarIds || [];
      const id = b.dataset.pillar;
      const idx = goalWizard.pillarIds.indexOf(id);
      if(idx>-1) goalWizard.pillarIds.splice(idx,1); else goalWizard.pillarIds.push(id);
      render();
    };
  });
  const gwCustomPillarAdd = document.getElementById('gwCustomPillarAdd');
  if(gwCustomPillarAdd) gwCustomPillarAdd.onclick = ()=>{
    goalWizard.title = document.getElementById('gwTitle').value;
    const inp = document.getElementById('gwCustomPillarInput');
    const val = inp.value.trim();
    if(!val) return;
    /* a pillar she types becomes a real pillar. It used to be kept as loose text
       on the goal, which displayed but grouped nothing — two goals carrying the
       identical wording both landed under "بدون بند" instead of together. */
    const existing = state.goalPillars.find(p=> p.label.trim() === val);
    const pillar = existing || {id:uid(), label:val, icon:'✨'};
    if(!existing) state.goalPillars.push(pillar);
    goalWizard.pillarIds = goalWizard.pillarIds || [];
    if(!goalWizard.pillarIds.includes(pillar.id)) goalWizard.pillarIds.push(pillar.id);
    inp.value = '';
    saveState(); render();
  };
  document.querySelectorAll('[data-custompillar-del]').forEach(b=>{
    b.onclick = ()=>{
      goalWizard.title = document.getElementById('gwTitle').value;
      goalWizard.customPillars.splice(parseInt(b.dataset.custompillarDel,10),1);
      render();
    };
  });
  const gwAttachInput = document.getElementById('gwAttachInput');
  if(gwAttachInput) gwAttachInput.onchange = ()=>{
    goalWizard.title = document.getElementById('gwTitle').value;
    goalWizard.notes = document.getElementById('gwNotes').value;
    const file = gwAttachInput.files && gwAttachInput.files[0];
    if(!file) return;
    if(file.size > 800*1024){
      attachError = `الملف "${file.name}" حجمه أكبر من ٨٠٠ كيلوبايت — اختاري ملف أصغر.`;
      render();
      return;
    }
    attachError = null;
    const reader = new FileReader();
    reader.onload = ()=>{
      goalWizard.attachments = goalWizard.attachments || [];
      goalWizard.attachments.push({id:uid(), name:file.name, size:file.size, dataUrl:reader.result});
      render();
    };
    reader.onerror = ()=>{
      attachError = 'ما قدرت أقرأ الملف، جربي ملف ثاني.';
      render();
    };
    reader.readAsDataURL(file);
  };
  document.querySelectorAll('[data-attach-del]').forEach(b=>{
    b.onclick = ()=>{
      goalWizard.title = document.getElementById('gwTitle').value;
      goalWizard.notes = document.getElementById('gwNotes').value;
      goalWizard.attachments.splice(parseInt(b.dataset.attachDel,10),1);
      render();
    };
  });
  document.getElementById('gwSave').onclick = ()=>{
    const title = document.getElementById('gwTitle').value.trim();
    if(!title){ document.getElementById('gwTitle').focus(); return; }
    const qs = QUESTIONS[goalWizard.cat]||[];
    const answers = qs.map((_,i)=> (document.getElementById('gwAns'+i)?.value||'').trim());
    const pillarIds = (goalWizard.pillarIds||[]).slice();
    const customPillars = (goalWizard.customPillars||[]).slice();
    const notes = document.getElementById('gwNotes').value.trim();
    const attachments = (goalWizard.attachments||[]).slice();
    if(goalWizard.id){
      const g = state.goals.find(x=>x.id===goalWizard.id);
      if(g){ g.title = title; g.cat = goalWizard.cat; g.answers = answers; g.pillarIds = pillarIds; g.customPillars = customPillars; g.notes = notes; g.attachments = attachments; }
    }else{
      state.goals.push({id:uid(), title, cat:goalWizard.cat, pillarIds, customPillars, notes, attachments, answers, createdAt:todayStr()});
    }
    attachError = null;
    saveState();
    goalWizard = null;
    view = 'goals';
    render();
  };
  document.getElementById('gwCancel').onclick = ()=>{
    attachError = null;
    goalWizard = null;
    view = state.goals.length?'goals':'home';
    render();
  };
}
