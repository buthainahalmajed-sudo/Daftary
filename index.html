/* Wiring for the list managers (time boxes, categories, action types, daily
   questions, feelings, identity pillars). They live in Settings now, which
   replaces the whole view and so never runs attachGlobalEvents — both entry
   points call this instead of one of them silently losing its handlers. */
function attachManagerEvents(){
  document.querySelectorAll('[data-tbox-label]').forEach(inp=>{
    inp.onchange = ()=>{
      const b = timeBoxOf(inp.dataset.tboxLabel);
      if(b){ b.label = inp.value.trim() || b.label; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-tbox-start]').forEach(inp=>{
    inp.onchange = ()=>{
      const b = timeBoxOf(inp.dataset.tboxStart);
      if(b && inp.value){ b.start = inp.value; saveState(); }
    };
  });
  document.querySelectorAll('[data-tbox-end]').forEach(inp=>{
    inp.onchange = ()=>{
      const b = timeBoxOf(inp.dataset.tboxEnd);
      if(b && inp.value){ b.end = inp.value; saveState(); }
    };
  });
  document.querySelectorAll('[data-tbox-cat]').forEach(btn=> btn.onclick=()=>{
    const b = timeBoxOf(btn.dataset.tboxCat);
    if(!b) return;
    if(!Array.isArray(b.categoryIds)) b.categoryIds = [];
    const idx = b.categoryIds.indexOf(btn.dataset.cat);
    if(idx>-1) b.categoryIds.splice(idx,1); else b.categoryIds.push(btn.dataset.cat);
    saveState(); render();
  });
  document.querySelectorAll('[data-tbox-color]').forEach(btn=> btn.onclick=()=>{
    const b = timeBoxOf(btn.dataset.tboxColor);
    if(b){ b.color = btn.dataset.color; saveState(); render(); }
  });
  document.querySelectorAll('[data-tbox-del]').forEach(btn=> btn.onclick=()=>{
    if(state.timeBoxes.length<=1) return;
    const box = timeBoxOf(btn.dataset.tboxDel);
    if(!confirm(`تحذفين صندوق "${box? box.label : ''}"؟`)) return;
    state.timeBoxes = state.timeBoxes.filter(b=>b.id!==btn.dataset.tboxDel);
    saveState(); render();
  });
  const tboxAddNew = document.getElementById('tboxAddNew');
  if(tboxAddNew) tboxAddNew.onclick = ()=>{
    const last = state.timeBoxes[state.timeBoxes.length-1];
    const usedColors = state.timeBoxes.map(b=>b.color);
    const nextColor = TIME_BOX_COLORS.find(c=>!usedColors.includes(c)) || TIME_BOX_COLORS[state.timeBoxes.length % TIME_BOX_COLORS.length];
    const start = last? last.end : '08:00';
    const end = pad(Math.floor((timeToMins(start)+120)/60)%24)+':'+pad((timeToMins(start)+120)%60);
    state.timeBoxes.push({ id:uid(), label:'صندوق جديد', start, end, color: nextColor, categoryIds:[] });
    saveState(); render();
  };

  document.querySelectorAll('[data-tcat-label]').forEach(inp=>{
    inp.onchange = ()=>{
      const c = tcatOf(inp.dataset.tcatLabel);
      if(c){ c.label = inp.value.trim() || c.label; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-tcat-icon]').forEach(inp=>{
    inp.onchange = ()=>{
      const c = tcatOf(inp.dataset.tcatIcon);
      if(c){ c.icon = inp.value.trim() || c.icon; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-tcat-del]').forEach(btn=> btn.onclick=()=>{
    if(state.taskCategories.length<=1) return;
    const cat = tcatOf(btn.dataset.tcatDel);
    const id = btn.dataset.tcatDel;
    const usedBy = (state.tasks||[]).filter(t=>t.category===id).length;
    const boxes = state.timeBoxes.filter(b=>(b.categoryIds||[]).includes(id)).map(b=>b.label);
    if(!confirm(`تحذفين تصنيف "${cat? cat.label : ''}"؟`
      + (usedBy? `\n\n${usedBy} مهمة مصنّفة فيه — بتنتقل لمجموعة "تصنيف محذوف" بصفحة المهام.` : '')
      + (boxes.length? `\nوبينشال من صناديق: ${boxes.join('، ')}.` : ''))) return;
    state.taskCategories = state.taskCategories.filter(c=>c.id!==id);
    /* remember a built-in she removed, so seeding doesn't hand it back on reload */
    if(CATS.some(c=>c.id===id)){
      if(!Array.isArray(state.removedCats)) state.removedCats = [];
      if(!state.removedCats.includes(id)) state.removedCats.push(id);
    }
    /* drop it from the boxes that pointed at it, so no box keeps a dead id */
    state.timeBoxes.forEach(b=>{
      if(Array.isArray(b.categoryIds)) b.categoryIds = b.categoryIds.filter(x=>x!==id);
    });
    saveState(); render();
  });
  const tcatAddNew = document.getElementById('tcatAddNew');
  if(tcatAddNew) tcatAddNew.onclick = ()=>{
    state.taskCategories.push({ id:uid(), label:'تصنيف جديد', icon:'🏷️' });
    saveState(); render();
  };

  /* ---- daily questions ---- */
  const dqTitle = document.getElementById('dqTitle');
  if(dqTitle) dqTitle.onchange = ()=>{
    state.questionsTitle = dqTitle.value.trim() || DEFAULT_QUESTIONS_TITLE;
    saveState(); render();
  };
  document.querySelectorAll('[data-dq-text]').forEach(inp=>{
    inp.onchange = ()=>{
      const q = (state.dailyQuestions||[]).find(x=>x.id===inp.dataset.dqText);
      if(q){ q.text = inp.value.trim() || q.text; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-dq-del]').forEach(b=> b.onclick=()=>{
    const q = (state.dailyQuestions||[]).find(x=>x.id===b.dataset.dqDel);
    if(!confirm(`تحذفين سؤال "${q? q.text : ''}"؟ إجاباتك السابقة عليه تضل محفوظة، بس ما تظهر.`)) return;
    state.dailyQuestions = state.dailyQuestions.filter(x=>x.id!==b.dataset.dqDel);
    saveState(); render();
  });
  const moveQuestion = (id, dir)=>{
    const qs = state.dailyQuestions;
    const i = qs.findIndex(x=>x.id===id);
    const j = i + dir;
    if(i<0 || j<0 || j>=qs.length) return;
    [qs[i], qs[j]] = [qs[j], qs[i]];
    saveState(); render();
  };
  document.querySelectorAll('[data-dq-up]').forEach(b=> b.onclick=()=> moveQuestion(b.dataset.dqUp, -1));
  document.querySelectorAll('[data-dq-down]').forEach(b=> b.onclick=()=> moveQuestion(b.dataset.dqDown, 1));
  document.querySelectorAll('[data-homecard]').forEach(b=> b.onclick=()=>{
    const id = b.dataset.homecard;
    state.homeCards[id] = !homeCardOn(id);
    saveState(); render();
  });

  /* ---- feelings ---- */
  const moodSectionToggle = document.getElementById('moodSectionToggle');
  if(moodSectionToggle) moodSectionToggle.onclick = ()=>{
    state.homeCards.mood = !homeCardOn("mood") ? true : false;
    saveState(); render();
  };
  const moodTitleInp = document.getElementById('moodTitle');
  if(moodTitleInp) moodTitleInp.onchange = ()=>{
    state.moodTitle = moodTitleInp.value.trim() || DEFAULT_MOOD_TITLE;
    saveState(); render();
  };
  const moodField = (attr, prop)=>{
    document.querySelectorAll('['+attr+']').forEach(inp=>{
      inp.onchange = ()=>{
        const m = moodOf(inp.getAttribute(attr));
        if(!m) return;
        m[prop] = inp.value.trim() || m[prop]; /* an empty name would leave an unnamed dot */
        saveState(); render();
      };
    });
  };
  moodField('data-mood-icon','icon');
  moodField('data-mood-label','label');
  document.querySelectorAll('[data-mood-active]').forEach(b=> b.onclick=()=>{
    const m = moodOf(b.dataset.moodActive);
    if(!m) return;
    m.active = m.active===false;
    saveState(); render();
  });
  document.querySelectorAll('[data-mood-del]').forEach(b=> b.onclick=()=>{
    const m = moodOf(b.dataset.moodDel);
    if(!confirm(`تحذفين شعور "${m? m.label : ''}"؟ الأيام اللي اخترتيه فيها بتحتفظ فيه، بس ما يظهر بالاختيارات. لو تبين تخفينه بس، أوقفيه بدل الحذف.`)) return;
    state.moods = state.moods.filter(x=>x.id!==b.dataset.moodDel);
    saveState(); render();
  });
  const moveMood = (id, dir)=>{
    const ms = state.moods;
    const i = ms.findIndex(x=>x.id===id);
    const j = i + dir;
    if(i<0 || j<0 || j>=ms.length) return;
    [ms[i], ms[j]] = [ms[j], ms[i]];
    saveState(); render();
  };
  document.querySelectorAll('[data-mood-up]').forEach(b=> b.onclick=()=> moveMood(b.dataset.moodUp, -1));
  document.querySelectorAll('[data-mood-down]').forEach(b=> b.onclick=()=> moveMood(b.dataset.moodDown, 1));
  const moodAdd = document.getElementById('moodAdd');
  if(moodAdd) moodAdd.onclick = ()=>{
    const label = (document.getElementById('moodNewLabel').value||'').trim();
    const icon = (document.getElementById('moodNewIcon').value||'').trim() || '🌿';
    if(!label) return;
    state.moods.push({id:uid(), label, icon, active:true});
    saveState(); render();
  };

  document.querySelectorAll('[data-dq-active]').forEach(b=> b.onclick=()=>{
    const q = (state.dailyQuestions||[]).find(x=>x.id===b.dataset.dqActive);
    if(!q) return;
    q.active = q.active===false;
    saveState(); render();
  });
  const dqAddNew = document.getElementById('dqAddNew');
  if(dqAddNew) dqAddNew.onclick = ()=>{
    state.dailyQuestions.push({ id:uid(), text:'سؤال جديد', active:true });
    saveState(); render();
  };

  /* ---- action types ---- */
  document.querySelectorAll('[data-atype-text]').forEach(inp=>{
    inp.onchange = ()=>{
      const i = parseInt(inp.dataset.atypeText,10);
      const val = inp.value.trim();
      if(!val || !state.actionTypes[i]) return;
      const old = state.actionTypes[i];
      state.actionTypes[i] = val;
      /* carry the rename onto tasks already tagged with it, so renaming a type
         doesn't quietly orphan every task using it */
      (state.tasks||[]).forEach(t=>{ if(t.actionType===old) t.actionType = val; });
      saveState(); render();
    };
  });
  document.querySelectorAll('[data-atype-del]').forEach(b=> b.onclick=()=>{
    const i = parseInt(b.dataset.atypeDel,10);
    const name = state.actionTypes[i];
    const used = (state.tasks||[]).filter(t=>t.actionType===name).length;
    if(!confirm(`تحذفين نوع "${name}"؟${used? ` فيه ${used} مهمة مستخدمة له — بتضل محتفظة فيه لين تغيّرينه.`:''}`)) return;
    state.actionTypes.splice(i,1);
    saveState(); render();
  });
  const atypeAdd = document.getElementById('atypeAdd');
  if(atypeAdd) atypeAdd.onclick = ()=>{
    const inp = document.getElementById('atypeNew');
    const val = inp.value.trim();
    if(!val) return;
    if(state.actionTypes.includes(val)){ inp.value=''; return; }
    state.actionTypes.push(val);
    saveState(); render();
  };

  document.querySelectorAll('[data-pillar-label]').forEach(inp=>{
    inp.onchange = ()=>{
      const p = pillarOf(inp.dataset.pillarLabel);
      if(p){ p.label = inp.value.trim() || p.label; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-pillar-icon]').forEach(inp=>{
    inp.onchange = ()=>{
      const p = pillarOf(inp.dataset.pillarIcon);
      if(p){ p.icon = inp.value.trim() || p.icon; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-pillar-del]').forEach(btn=> btn.onclick=()=>{
    const p = pillarOf(btn.dataset.pillarDel);
    if(!confirm(`تحذفين بند "${p? p.label : ''}"؟ الأهداف تحته بترجع "بدون بند".`)) return;
    state.goalPillars = state.goalPillars.filter(x=>x.id!==btn.dataset.pillarDel);
    state.goals.forEach(g=>{ g.pillarIds = (g.pillarIds||[]).filter(id=>id!==btn.dataset.pillarDel); });
    saveState(); render();
  });
  const pillarAddNew = document.getElementById('pillarAddNew');
  if(pillarAddNew) pillarAddNew.onclick = ()=>{
    state.goalPillars.push({ id:uid(), label:'بند جديد', icon:'✨' });
    saveState(); render();
  };
}

function attachSettingsEvents(){
  document.getElementById('closeSettings').onclick = ()=>{ settingsOpen=false; syncExportCode=''; syncMsg=null; showLinkInfo=false; render(); };

  attachManagerEvents();

  /* read the published build straight off the server, bypassing every cache, and
     say plainly whether this device is behind — guessing was the problem */
  const cmp = document.getElementById('buildCompare');
  if(cmp){
    fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'})
      .then(r=> r.ok? r.text() : Promise.reject(new Error('كود '+r.status)))
      .then(html=>{
        const m = html.match(/APP_BUILD\s*=\s*'([^']+)'/);
        const live = m && m[1];
        if(!live){ cmp.textContent = 'ما قدرت أقرأ النسخة المنشورة.'; return; }
        if(live === APP_BUILD){
          cmp.style.color = 'var(--sage)';
          cmp.textContent = '✓ عندك آخر نسخة منشورة.';
        }else{
          cmp.style.color = 'var(--rose-dark)';
          cmp.textContent = '⚠️ فيه نسخة أحدث منشورة (' + live + ') — اضغطي تحديث.';
        }
      })
      .catch(e=>{ cmp.textContent = 'ما قدرت أتأكد من النسخة المنشورة (' + friendlyErr(e) + ').'; });
  }

  const checkAppUpdate = document.getElementById('checkAppUpdate');
  if(checkAppUpdate) checkAppUpdate.onclick = async ()=>{
    if(!('serviceWorker' in navigator)){
      appUpdateMsg = {ok:false, text:'المتصفح ما يدعم هذي الميزة، جربي ترفرشين الصفحة يدويًا.'};
      render();
      return;
    }
    appUpdateMsg = {ok:true, text:'جاري تحميل آخر نسخة…'};
    render();
    try{
      /* checking whether sw.js itself changed isn't enough — the currently
         loaded page can still be an older fetch even with the same worker
         active, so always force a real reload through the network-first
         (cache:'no-store') fetch handler rather than trusting reg.update()
         alone to reflect whether index.html itself is stale */
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg) await reg.update();
    }catch(e){ /* fall through to reload regardless */ }
    setTimeout(()=> location.reload(), 300);
  };

  const cfgGistId = document.getElementById('cfgGistId');
  const cfgToken = document.getElementById('cfgToken');
  const syncCfgFields = ()=>{
    if(cfgGistId) cloud.gistId = cfgGistId.value.trim();
    if(cfgToken) cloud.token = cfgToken.value.trim();
  };

  const linkPush = document.getElementById('linkPush');
  if(linkPush) linkPush.onclick = async ()=>{
    syncCfgFields();
    if(!cloud.gistId || !cloud.token){ cloudStatus='error'; cloudStatusMsg='عبي Gist ID وToken أول.'; render(); return; }
    if(!confirm('تنبيه: إذا فيه بيانات محفوظة بالسحاب من جهاز ثاني، بتنمسح وتنستبدل ببيانات هذا الجهاز. متأكدة إنك تبين ترفعين؟')) return;
    cloudStatus='syncing'; cloudStatusMsg=''; render();
    cloud.linked = true; saveCloudCfg();
    const ok = await cloudPush();
    if(!ok) cloud.linked = false;
    saveCloudCfg(); render();
  };
  const linkPull = document.getElementById('linkPull');
  if(linkPull) linkPull.onclick = async ()=>{
    syncCfgFields();
    if(!cloud.gistId || !cloud.token){ cloudStatus='error'; cloudStatusMsg='عبي Gist ID وToken أول.'; render(); return; }
    cloudStatus='syncing'; cloudStatusMsg=''; render();
    cloud.linked = true; saveCloudCfg();
    const ok = await cloudPull();
    if(!ok) cloud.linked = false;
    saveCloudCfg(); render();
  };
  const syncNow = document.getElementById('syncNow');
  if(syncNow) syncNow.onclick = async ()=>{ await cloudPull(); render(); };
  const unlinkCloud = document.getElementById('unlinkCloud');
  if(unlinkCloud) unlinkCloud.onclick = ()=>{
    cloud = {token:'', gistId:'', linked:false};
    saveCloudCfg();
    cloudStatus='idle'; cloudStatusMsg='';
    render();
  };
  const toggleLinkInfo = document.getElementById('toggleLinkInfo');
  if(toggleLinkInfo) toggleLinkInfo.onclick = ()=>{ showLinkInfo = !showLinkInfo; render(); };

  const loadRevisions = document.getElementById('loadRevisions');
  if(loadRevisions) loadRevisions.onclick = async ()=>{
    revLoading = true; revError = null; revPreview = null; render();
    try{ cloudRevisions = await fetchGistRevisions(); }
    catch(e){ revError = friendlyErr(e); cloudRevisions = null; }
    revLoading = false; render();
  };
  document.querySelectorAll('[data-rev-peek]').forEach(b=> b.onclick = async ()=>{
    const version = b.dataset.revPeek;
    if(revPreview && revPreview.version===version){ revPreview = null; render(); return; }
    revPreview = {version, error:'⏳ يفتح…'}; render();
    try{ revPreview = summariseRevision(version, await fetchRevisionState(version)); }
    catch(e){ revPreview = {version, error: friendlyErr(e)}; }
    render();
  });
  document.querySelectorAll('[data-rev-restore]').forEach(b=> b.onclick = async ()=>{
    const version = b.dataset.revRestore;
    try{
      const snapshot = await fetchRevisionState(version);
      const s = summariseRevision(version, snapshot);
      if(!confirm(`استعادة هذي النسخة؟\n\n${s.tasks} مهمة · ${s.goals} هدف · ${s.cats} تصنيف · ${s.pillars} بند هوية · ${s.journal} إنجاز\n\nبيحل محل اللي على هذا الجهاز الآن. وضعك الحالي بيظل محفوظًا كنسخة بالسحاب تقدرين ترجعين لها من نفس القائمة.`)) return;
      /* push the current state first so restoring is itself undoable */
      await cloudPush();
      hydrateState(snapshot);
      saveState();
      await cloudPush();
      cloudRevisions = null; revPreview = null;
      popStamp('رجعت بياناتك','الحمدلله');
      render();
    }catch(e){ revError = friendlyErr(e); render(); }
  });
  document.querySelectorAll('[data-copy-link]').forEach(b=> b.onclick = async ()=>{
    const val = b.dataset.copyLink==='gistId'? cloud.gistId : cloud.token;
    try{ if(navigator.clipboard) await navigator.clipboard.writeText(val); }catch(e){}
  });

  document.getElementById('genCode').onclick = async ()=>{
    syncExportCode = encodeState();
    try{ if(navigator.clipboard) await navigator.clipboard.writeText(syncExportCode); }catch(e){}
    render();
  };
  const importBox = document.getElementById('importBox');
  if(importBox) importBox.oninput = ()=>{ syncImportText = importBox.value; };
  document.getElementById('doImport').onclick = ()=>{
    const val = (importBox? importBox.value : syncImportText).trim();
    if(!val){ syncMsg = {ok:false, text:'الصقي الكود أول.'}; render(); return; }
    try{
      const parsed = decodeState(val);
      if(!parsed || typeof parsed !== 'object' || !('tasks' in parsed)){ throw new Error('bad'); }
      hydrateState(parsed);
      saveState();
      syncMsg = {ok:true, text:'تم الاستيراد بنجاح! بياناتك صارت نفس الجهاز الثاني.'};
      syncImportText = '';
      render();
    }catch(e){
      syncMsg = {ok:false, text:'الكود مو صحيح أو تالف، تأكدي إنك نسختيه كامل.'};
      render();
    }
  };
}

function renderProgressStatCard(){
  const today = todayStr();
  const plannedToday = tasksPlannedForDate(today);
  const doneTodayCount = tasksDoneCountForDate(today, plannedToday);

  const weekStart = startOfWeek(today);
  const weekDates = Array.from({length:7},(_,i)=>addDays(weekStart,i));
  let plannedWeek = 0, doneWeek = 0;
  weekDates.forEach(d=>{
    const planned = tasksPlannedForDate(d);
    plannedWeek += planned.length;
    doneWeek += tasksDoneCountForDate(d, planned);
  });

  let msg;
  if(plannedToday.length===0) msg = 'ما خططتي أي مهمة لليوم بعد — أضيفي وحدة وابدئي.';
  else if(doneTodayCount===plannedToday.length) msg = 'خلصتي كل مهام اليوم، ماشاءالله! 🌿';
  else msg = `باقي ${plannedToday.length-doneTodayCount} مهمة لتخلصين يومك.`;

  return `
  <div class="card">
    <div class="stats-grid">
      <div class="stat-box" style="background:#e7f7ef;">
        <div class="p" style="color:#2f9e6e;">${doneTodayCount} من ${plannedToday.length}</div>
        <div class="l" style="color:#2f9e6e;">مهام اليوم</div>
      </div>
      <div class="stat-box" style="background:#e8effb;">
        <div class="p" style="color:#3f6fd1;">${doneWeek} من ${plannedWeek}</div>
        <div class="l" style="color:#3f6fd1;">مهام هالأسبوع</div>
      </div>
    </div>
    <p class="muted" style="margin-top:10px;">${msg}</p>
  </div>`;
}

function renderHabitsCard(tpl, log, dow){
  const dayHabits = habitsForDow(dow);
  const collapsed = state.collapsed.habits;
  /* a finished habit leaves the list, so what's on screen is only what's still
     waiting. The done ones move behind a toggle rather than vanishing outright —
     a mis-tap has to stay undoable, and this is where she'd look to undo it.
     Truthy here means "open", the same inverted sense the taskNote keys use. */
  const doneOpen = !!state.collapsed.habitsDoneOpen;
  const isDone = h => !!log.habits[h.id];
  const pending = dayHabits.filter(h=>!isDone(h));
  const finished = dayHabits.filter(isDone);
  /* reorder arrows act on the full day list, so their bounds come from there and
     not from the shortened pending list */
  const habitRow = (h)=>{
    const i = dayHabits.indexOf(h);
    const done = isDone(h);
    return `<div class="habit-item">
      <div style="display:flex;flex-direction:column;gap:1px;">
        <button type="button" class="icon-btn" style="padding:1px 6px;font-size:12px;" data-homehabit-up="${h.id}" data-homehabit-dow="${dow}" ${i===0?'disabled':''}>▲</button>
        <button type="button" class="icon-btn" style="padding:1px 6px;font-size:12px;" data-homehabit-down="${h.id}" data-homehabit-dow="${dow}" ${i===dayHabits.length-1?'disabled':''}>▼</button>
      </div>
      <button type="button" class="hbox ${done?'done':''}" data-habit="${h.id}">${done?'<svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg>':''}</button>
      <span class="habit-label ${done?'done':''}" style="flex:1;">${escapeHtml(h.label)}</span>
      ${h.link? `<a href="${escapeHtml(h.link)}" target="_blank" rel="noopener" title="رابط مساعد" style="font-size:16px;text-decoration:none;">🔗</a>`:''}
    </div>`;
  };
  return `
  <div class="card">
    <div class="card-title">
      <h3 style="cursor:pointer;flex:1;display:flex;align-items:center;gap:7px;" data-toggle-collapse="habits"><span style="flex:1;">عادات ${tpl.name}${dayHabits.length? ` <span class="muted" style="font-size:var(--t2);font-weight:400;">(${finished.length}/${dayHabits.length})</span>`:''}</span><span class="chev ${collapsed?"":"open"}">▾</span></h3>
      <button class="icon-btn sm" data-goto-habits="1">إدارة العادات</button>
    </div>
    ${collapsed? '' : `
    ${dayHabits.length===0? `<div class="empty tight">ما فيه عادات لهذا اليوم<span class="hint">أضيفيها أو فعّليها من صفحة «العادات»</span></div>`:''}
    ${pending.map(habitRow).join('')}
    ${dayHabits.length && pending.length===0? `<p style="text-align:center;font-size:var(--t4);color:var(--petrol-dark);margin:6px 0;">🌿 خلّصتي عادات اليوم كلها، ماشاءالله</p>`:''}
    ${finished.length? `
      <button type="button" class="icon-btn sm" style="padding:3px 4px;margin-top:4px;" data-toggle-collapse="habitsDoneOpen">${doneOpen?'▾':'▸'} ✓ اللي خلّصتيها (${finished.length})</button>
      ${doneOpen? finished.map(habitRow).join('') : ''}
    `:''}
    `}
  </div>`;
}

const PRIORITY_WEIGHT = {'عالية':3, 'متوسطة':2, 'منخفضة':1};
function renderTasksForDate(isToday){
  /* other dates get everything actually scheduled for that day — which means
     recurring tasks landing on it, not just tasks with a matching due date.
     Reuses tasksPlannedForDate so the recurrence rule lives in one place. */
  const list = isToday? topTasks()
    : tasksShownForDate(selectedDate).sort((a,b)=>(PRIORITY_WEIGHT[b.priority]||0)-(PRIORITY_WEIGHT[a.priority]||0));
  if(list.length===0){
    return `<div class="empty">${isToday? 'ما فيه مهام بعد.':'ما فيه مهام مجدولة لهذا التاريخ.'}</div>`;
  }
  return list.map(t=>taskRowHtml(t, {date:selectedDate})).join('');
}

function recurLabel(t){
  let base = '';
  if(t.recurType==='daily') base = 'يوميًا';
  else if(t.recurType==='weekly') base = (t.recur||[]).slice().sort().map(d=>DOW_SHORT[d]).join('، ');
  else if(t.recurType==='monthly') base = 'شهريًا يوم '+t.recurMonthDay;
  const range = (t.recurStart||t.recurEnd)? ' ('+(t.recurStart?'من '+t.recurStart:'')+(t.recurStart&&t.recurEnd?' ':'')+(t.recurEnd?'إلى '+t.recurEnd:'')+')' : '';
  return base + range;
}

const DEVICE_LABELS = {work:'كمبيوتر العمل (أسود)', home:'كمبيوتر المنزل (أبيض)', laptop:'لابتوب (متنقل)'};
function deviceIconSvg(kind, size){
  size = size || 14;
  const s = `width="${size}" height="${size}"`;
  if(kind==='work') return `<svg ${s} viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="2" fill="#000"/><rect x="9" y="18" width="6" height="2" fill="#000"/><rect x="6" y="21" width="12" height="1.6" rx="0.8" fill="#000"/></svg>`;
  if(kind==='home') return `<svg ${s} viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="2" fill="#fff" stroke="#2c2c2a" stroke-width="1.6"/><rect x="9" y="18" width="6" height="2" fill="#2c2c2a"/><rect x="6" y="21" width="12" height="1.6" rx="0.8" fill="#2c2c2a"/></svg>`;
  if(kind==='laptop') return `<svg ${s} viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="10" rx="1.4" fill="#2E5C5A"/><path d="M2 18h20l-2.2 2.2H4.2z" fill="#2E5C5A"/></svg>`;
  return '';
}
function taskRowHtml(t, opts){
  opts = opts || {};
  const g = t.goalId? state.goals.find(x=>x.id===t.goalId): null;
  /* a recurring task is done *for a given day*, so when this row is shown under
     another date the tick has to reflect that date, not today */
  const done = taskDoneOnDate(t, opts.date || todayStr());
  const box = t.period? timeBoxOf(t.period) : null;
  const device = t.device || null;
  const hasExtra = t.longNote || (t.attachments && t.attachments.length);
  const noteKey = 'taskNote:'+t.id;
  const noteOpen = !!state.collapsed[noteKey]; /* truthy here means "expanded", opposite of every other data-toggle-collapse usage — this one defaults hidden */
  return `
  <div class="task-row" data-task="${t.id}">
    <button class="check ${done?'done':''}" data-toggle="${t.id}">${done?'<svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg>':''}</button>
    <div style="flex:1;">
      <div class="task-title ${done?'done':''}" style="display:flex;align-items:center;gap:6px;">
        ${device? `<span style="flex-shrink:0;" title="${DEVICE_LABELS[device]}">${deviceIconSvg(device,15)}</span>`:''}
        <span>${escapeHtml(t.title)}</span>
      </div>
      <div style="margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;">
        <span class="tag p-${t.priority}">${t.priority}</span>
        ${t.actionType? `<span class="tag">🔸 ${escapeHtml(t.actionType)}</span>`:''}
        ${t.category? `<span class="tag">${tcatOf(t.category)?.icon||''} ${tcatOf(t.category)?.label||''}</span>`:''}
        ${g? `<span class="tag">${catIcon(g.cat)} ${escapeHtml(g.title)}</span>`:''}
        ${t.period? `<span class="tag" ${timeBoxTagStyle(box)}>${box? escapeHtml(box.label) : escapeHtml(t.period)}</span>`:''}
        ${t.due? `<span class="tag">🗓️ ${t.due}</span>`:''}
        ${taskAwaitingDate(t)? `<span class="tag" style="background:rgba(178,76,99,.13);color:var(--rose-dark);" title="فاتت بلا إنجاز، فرفعت عنها التاريخ — حددي لها موعدًا جديدًا وترجع ليومك">⏳ بلا تاريخ · فاتت ${t.lapsedFrom}</span>`:''}
        ${t.recurType? `<span class="tag">🔁 ${recurLabel(t)}</span>`:''}
        ${t.link? `<a href="${escapeHtml(t.link)}" target="_blank" rel="noopener" class="tag" style="text-decoration:none;">🔗 رابط مساعد</a>`:''}
      </div>
      ${hasExtra? `
      <button type="button" class="icon-btn sm" style="padding:2px 4px;margin-top:2px;" data-toggle-collapse="${noteKey}">${noteOpen?'▾':'▸'} 📝 تفاصيل إضافية</button>

function renderScheduleCard(){
  const dateStr = arguments.length? arguments[0] : todayStr();
  const isToday = dateStr === todayStr();
  /* today follows the real current time live unless she explicitly picked a
     different tab this session; another day has no "now", so it opens on the
     first box and remembers whichever tab she taps while browsing */
  let period;
  if(isToday){
    period = window.__activePeriodManual ? window.__activePeriod : currentTimeBoxId();
    window.__activePeriod = period;
  }else{
    const remembered = window.__schedPeriodOther;
    period = state.timeBoxes.some(b=>b.id===remembered)? remembered : (state.timeBoxes[0]||{}).id;
  }
  /* today keeps its open-ended backlog (overdue and undated tasks belong to
     "now"); another day shows exactly what's scheduled for it, recurrences
     included — same split renderTasksForDate already uses */
  const pool = isToday
    ? state.tasks.filter(t=> !taskDoneToday(t) && taskActiveToday(t))
    : tasksShownForDate(dateStr).filter(t=> !taskDoneOnDate(t, dateStr));
  /* The three that matter most are lifted out of the period lists and shown once
     at the top. They used to sit in their own card as well as inside the schedule,
     so the same task appeared twice on one screen and could be ticked in either. */
  const focus = isToday? topTasks() : [];
  const focusIds = new Set(focus.map(t=>t.id));
  const rest = pool.filter(t=> !focusIds.has(t.id));
  const countIn = id => rest.filter(t=>t.period===id).length;
  /* the schedule is strictly the day laid out by time box. A task with no period
     (or one pointing at a box she deleted) has no place on that map, so it stays
     out of here entirely — it is still reachable on the tasks page, under its
     category or under "غير مصنّفة". */
  const items = rest.filter(t=>t.period===period);
  const collapsed = state.collapsed.schedule;
  const activeBox = timeBoxOf(period);
  const pinned = isToday && getLog(todayStr()).pinnedTop3;
  const restCount = rest.filter(t=> state.timeBoxes.some(b=>b.id===t.period)).length;
  return `
  <div class="card">
    <div class="card-title"><h3>${isToday? 'يومك' : 'جدول هذا اليوم'}</h3></div>
    ${`
    ${focus.length? `
    <div class="focus-strip">
      <div class="focus-head">
        <span style="flex:1;">⭐ أهم ${focus.length===1?'مهمة':focus.length===2?'مهمتين':focus.length+' مهام'} اليوم</span>
        <button class="icon-btn sm" id="refreshTop" title="إعادة الاختيار">↻</button>
      </div>
      ${focus.map(t=>taskRowHtml(t, {date:dateStr})).join('')}
      ${topTasksHasTie() && !pinned? `<p class="muted" style="margin-top:8px;color:var(--rose-dark);font-size:var(--t2);">🤔 فيه مهام متساوية بالأهمية — تبين تختارين الثلاث بنفسك؟</p>`:''}
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn ghost sm" id="openTop3Picker">🗣️ أحددها بنفسي</button>
        ${pinned? `<button class="btn ghost sm" id="resetTop3">↻ رجّعيها تلقائية</button>`:''}
      </div>
    </div>`:''}
    <details class="day-rest" data-sec="dayPeriods" ${collapsed?'':'open'}>
      <summary><span class="grow">بقية مهام اليوم${restCount? ` <span class="ptab-count">${restCount}</span>`:''}</span><span class="chev">▾</span></summary>
      <div class="details-body">
    <div class="period-tabs">
      ${state.timeBoxes.map(b=>{
        const n = countIn(b.id);
        return `<button type="button" class="period-tab ${period===b.id?'active':''}" data-period="${b.id}" ${period===b.id?`style="background:${b.color};border-color:${b.color};color:#fff;"`:''}>${escapeHtml(b.label)}${n? ` <span class="ptab-count">${n}</span>`:''}</button>`;
      }).join('')}
    </div>
    ${activeBox? `<p class="muted" style="margin-bottom:10px;">⏰ ${activeBox.start} – ${activeBox.end}${(activeBox.categoryIds&&activeBox.categoryIds.length)? ' · '+activeBox.categoryIds.map(id=>tcatOf(id)?.label).filter(Boolean).join('، ') : ''}</p>`:''}
    ${items.length===0? `<div class="empty tight">ما فيه مهام في هالصندوق${focus.length? '' : ''}<span class="hint">وزّعي مهامك من صفحة المهام</span></div>` : items.map(t=>taskRowHtml(t, {date:dateStr})).join('')}
    <button class="btn ghost btn-block" style="margin-top:8px;" id="goAddTaskPeriod" data-add-period="${period}">+ إضافة مهمة ${activeBox?'لـ'+escapeHtml(activeBox.label):''}</button>
      </div>
    </details>
    `}
  </div>`;
}

}
function ensureDailyTipRotation(){
  if(state.goals.length===0) return;

function renderSuggestionsCard(){

       be put away, so a prompt she had already decided about stayed on screen */

/* ============ TASKS page ============ */
let taskSearchQuery = '';
/* shared category -> goal grouping, reused by the tasks page and the manual top-3 picker
   so both present the exact same organized view */
function renderGroupedTaskBlocks(taskList, rowRenderer, emptyMsg){
  const grouped = {}; /* catId -> {goalId -> {goal, tasks, mixed}} */
  const tcatGroups = {}; /* catId -> tasks[], for tasks with no goal to nest under */
  const freeTasks = [];
  /* Goal-linked tasks are collected per goal first, because a goal has to land in
     exactly one category. Placing each task independently split a goal across
     every category its tasks happened to use — a task tagged "المشروع" went there
     while a sibling with no tag fell back to the goal's own domain, printing the
     same goal heading twice. */
  const byGoal = {};
  taskList.forEach(t=>{
    const g = t.goalId? state.goals.find(x=>x.id===t.goalId) : null;
    if(g){
      byGoal[g.id] = byGoal[g.id] || {goal:g, tasks:[]};
      byGoal[g.id].tasks.push(t);
      return;
    }
    if(t.category){
      tcatGroups[t.category] = tcatGroups[t.category] || [];
      tcatGroups[t.category].push(t);
      return;
    }
    freeTasks.push(t);
  });
  Object.values(byGoal).forEach(entry=>{
    const cats = {};
    entry.tasks.forEach(t=>{ if(t.category) cats[t.category] = (cats[t.category]||0)+1; });
    const ids = Object.keys(cats);
    entry.mixed = ids.length > 1;
    /* the category her tasks actually use decides where the goal sits, so tagging
       a goal's work with a category still moves the goal there. Ties fall to the
       goal's own domain, then to list order, so the answer never shifts on rerender. */
    let key = entry.goal.cat || 'other';
    if(ids.length){
      const rank = c=>{ const i = state.taskCategories.findIndex(x=>x.id===c); return i<0? 999 : i; };
      key = ids.reduce((best,id)=>{
        if(cats[id] !== cats[best]) return cats[id] > cats[best] ? id : best;
        if(id === entry.goal.cat) return id;
        if(best === entry.goal.cat) return best;
        return rank(id) < rank(best) ? id : best;
      }, ids[0]);
    }
    grouped[key] = grouped[key] || {};
    grouped[key][entry.goal.id] = entry;
  });

  const renderCatBlock = (catKey, icon, label, goalGroups)=>{
    const catCollapsed = state.collapsed[catKey];
    const taskCount = goalGroups.reduce((s,x)=>s+x.tasks.length,0);
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="card-title"><h3 style="cursor:pointer;flex:1;font-size:var(--t4);display:flex;align-items:center;gap:7px;" data-toggle-collapse="${catKey}"><span style="flex:1;">${icon} ${label} <span class="muted" style="font-size:var(--t2);font-weight:400;">(${taskCount})</span></span><span class="chev ${catCollapsed?"":"open"}">▾</span></h3></div>
      ${catCollapsed? '' : goalGroups.map(({goal, tasks, mixed})=>{
        if(!goal) return tasks.map(rowRenderer).join('');
        const goalKey = 'goal:'+goal.id;
        const goalCollapsed = state.collapsed[goalKey];
        return `
        <div style="margin-bottom:10px;border-top:1px dashed var(--line);padding-top:10px;">
          <h4 style="cursor:pointer;font-size:var(--t3);color:var(--petrol-dark);margin-bottom:6px;display:flex;align-items:center;gap:7px;" data-toggle-collapse="${goalKey}"><span style="flex:1;">${escapeHtml(goal.title)} <span class="muted" style="font-size:var(--t1);font-weight:400;">(${tasks.length})</span></span><span class="chev ${goalCollapsed?"":"open"}">▾</span></h4>
          ${mixed? `<p class="muted" style="font-size:var(--t1);margin:-2px 0 6px;color:var(--rose-dark);">⚠️ مهام هذا الهدف بتصنيفات مختلفة — وحّدي تصنيفها لو تبين ترتيبًا أوضح</p>`:''}
          ${goalCollapsed? '' : tasks.map(rowRenderer).join('')}
        </div>`;
      }).join('')}
    </div>`;
  };

  /* one card per category, holding both the tasks that carry that category
     directly and the tasks that inherit it from their goal — task categories and
     goal domains are the same taxonomy now, so splitting them into two cards
     would print the same heading twice */
  let body = '';
  const seen = {};
  const emitCat = (c)=>{
    if(seen[c.id]) return;
    seen[c.id] = true;
    const loose = tcatGroups[c.id] || [];
    const goalGroups = grouped[c.id]? Object.values(grouped[c.id]) : [];
    if(!loose.length && !goalGroups.length) return;
    const blocks = loose.length? [{goal:null, tasks:loose}, ...goalGroups] : goalGroups;
    body += renderCatBlock('cat:'+c.id, c.icon, c.label, blocks);
  };
  state.taskCategories.forEach(emitCat);
  CATS.forEach(emitCat); /* safety net for a goal whose domain she removed from her category list */
  /* anything still holding a category id that no longer exists — she deleted the
     category after tagging tasks with it. Emit it under its bare id rather than
     letting those tasks fall off the page entirely. */
  Object.keys(Object.assign({}, tcatGroups, grouped)).forEach(id=>{
    emitCat({id, icon:'🏷️', label:'تصنيف محذوف'});
  });
  if(freeTasks.length){
    body += renderCatBlock('cat:__none__', '🗂️', 'غير مصنّفة', [{goal:null, tasks:freeTasks}]);
  }
  if(!body) body = `<div class="empty">${emptyMsg}</div>`;
  return body;
}
/* the standing list holds only what's still open — anything finished moves down
   to the by-day section below, so a task is never in both places at once. A
   recurring task ticked today counts as finished for today and comes back
   tomorrow, same as it now behaves on the day views. */
function taskSearchPool(){
  const q = taskSearchQuery.trim().toLowerCase();
  return q? state.tasks.filter(t=> t.title.toLowerCase().includes(q)) : state.tasks;
}
function renderTasksByGoalSection(){
  const q = taskSearchQuery.trim();
  const pool = taskSearchPool().filter(t=> !taskDoneToday(t));
  return renderGroupedTaskBlocks(pool, taskRowHtml, q? 'ما فيه مهام مفتوحة مطابقة لبحثك.' : 'ما عندك مهام مفتوحة — كل شي منجز 🎉');
}
/* groups tasks by the day they were actually completed (doneAt for one-off
   tasks, lastDoneDate for recurring ones — recurring tasks only remember
   their most recent completion, not full history) */
function renderCompletedByDay(){
  const q = taskSearchQuery.trim();
  const byDay = {};
  const undated = []; /* finished, but from before completion dates were recorded */
  taskSearchPool().forEach(t=>{
    /* a recurring task only belongs here while it is actually done — once its
       next occurrence comes round it's open again and lives in the list above.
       Listing it under an older completion date would put the same task in both
       places at once, and it wouldn't even be real history: only the most recent
       completion is stored, so that row is a single value that moves forward. */
    if(t.recurType){ if(t.lastDoneDate === todayStr()) (byDay[t.lastDoneDate] = byDay[t.lastDoneDate] || []).push(t); return; }
    if(!t.done) return;
    if(t.doneAt) (byDay[t.doneAt] = byDay[t.doneAt] || []).push(t);
    else undated.push(t);
  });
  const days = Object.keys(byDay).sort((a,b)=> b.localeCompare(a));
  const total = days.reduce((s,d)=>s+byDay[d].length,0) + undated.length;
  const dayBlock = (key, heading, list)=>{
    const dayCollapsed = state.collapsed[key];
    return `
    <div style="margin-bottom:10px;">
      <h4 style="cursor:pointer;font-size:var(--t3);color:var(--petrol-dark);margin-bottom:4px;border-top:1px dashed var(--line);padding-top:10px;display:flex;align-items:center;gap:7px;" data-toggle-collapse="${key}"><span style="flex:1;">${heading} <span class="muted" style="font-size:var(--t1);font-weight:400;">(${list.length})</span></span><span class="chev ${dayCollapsed?"":"open"}">▾</span></h4>
      ${dayCollapsed? '' : list.map(t=>taskRowHtml(t, {restore:true, date:key.slice(8)})).join('')}
    </div>`;
  };
  return `
  <details class="card" data-sec="doneByDay" ${openSections.doneByDay?'open':''} style="margin-bottom:14px;">
    <summary><h3>✅ المهام المنجزة حسب اليوم <span class="muted" style="font-size:var(--t2);font-weight:400;">(${total})</span> <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      ${total===0? `<div class="empty">${q? 'ما فيه مهام منجزة مطابقة لبحثك.' : 'ما فيه مهام منجزة بعد.'}</div>` : `
        ${days.map(d=> dayBlock('doneDay:'+d, `${DOW_NAMES[dowOf(d)]}، ${formatDateAr(d)}`, byDay[d])).join('')}
        ${undated.length? dayBlock('doneDay:__none__', 'بدون تاريخ مسجّل', undated) : ''}
      `}
    </div>
  </details>`;
}

  return `
  <h2 style="font-size:var(--t6);color:var(--petrol-dark);margin-bottom:14px;">مهامي</h2>
  ${renderInboxBox()}

   answer is meant to be a short phrase that slots directly into a neutral

   freely compose prose from long-form answers */
const VISION_QUESTIONS = [
  {q:'بجملة قصيرة: أهم شي يميز حياتك بعد ٥ سنوات؟', ph:'مثال: الاستقرار والسلام الداخلي'},
  {q:'القيمة الوحيدة اللي ما تتنازلين عنها؟', ph:'مثال: الصدق'},
  {q:'صحيًا، وش تبين تكونين؟', ph:'مثال: نشيطة ومتوازنة'},
  {q:'ماليًا، وش تبين تكونين؟', ph:'مثال: مستقلة وموفرة'},
  {q:'عاطفيًا، وش تبين تكونين؟', ph:'مثال: مطمئنة ومحاطة بمن أحب'},
  {q:'وش الأثر اللي تبين تسوينه بحياة اللي حولك؟', ph:'مثال: أكون مصدر دعم وإلهام'},
  {q:'لو وصف حد حياتك بجملة وحدة بعد سنوات، وش يقول؟', ph:'مثال: عاشت حياة صادقة ومؤثرة'},
];
function composeVisionText(answers){
  const a = answers.map(x=>(x||'').trim());
  const sentences = [];
  if(a[0]) sentences.push(`أعيش حياة محورها ${a[0]}`);
  if(a[1]) sentences.push(`أتمسك بقيمة ${a[1]} فوق أي شي`);
  const wellbeing = [];
  if(a[2]) wellbeing.push(`صحيًا أنا ${a[2]}`);
  if(a[3]) wellbeing.push(`ماليًا أنا ${a[3]}`);
  if(a[4]) wellbeing.push(`عاطفيًا أنا ${a[4]}`);
  if(wellbeing.length) sentences.push(wellbeing.join('، '));
  if(a[5]) sentences.push(`أترك أثري بحياة من حولي من خلال أن ${a[5]}`);
  if(a[6]) sentences.push(`ولو وُصفت حياتي بجملة بعد سنوات، بيُقال: "${a[6]}"`);
  return sentences.length? sentences.join('. ')+'.' : '';
}

      <div style="display:flex;gap:2px;">
        <button class="icon-btn" data-goal-up="${i}" ${i===0?'disabled':''}>▲</button>
        <button class="icon-btn" data-goal-down="${i}" ${i===state.goals.length-1?'disabled':''}>▼</button>
        <button class="icon-btn" data-edit-goal="${g.id}">✎</button>
        <button class="icon-btn" data-delgoal="${g.id}">✕</button>
      </div>
    </div>
    ${axisRow}
    ${customTags? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;">${customTags}</div>`:''}
    ${g.answers && g.answers.some(a=>a) ? `
      <div style="margin-top:6px;">
        ${QUESTIONS[g.cat].map((q,i)=> g.answers[i]? `<p class="muted" style="margin-bottom:6px;"><b style="color:var(--petrol-dark);">${q}</b><br>${escapeHtml(g.answers[i])}</p>`:'').join('')}
      </div>`:''}
    ${g.notes? `<p style="margin-top:8px;white-space:pre-wrap;font-size:var(--t3);line-height:1.7;">${escapeHtml(g.notes)}</p>`:''}
    ${(g.attachments||[]).length? `
      <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
        ${g.attachments.map(a=>`<a href="${a.dataUrl}" download="${escapeHtml(a.name)}" style="font-size:var(--t3);color:var(--petrol-dark);text-decoration:none;">📄 ${escapeHtml(a.name)}</a>`).join('')}
      </div>`:''}
    <button class="btn ghost sm" data-addtaskfor="${g.id}" style="margin-top:8px;">+ إضافة مهمة لهالهدف</button>
    ${g.cat==='finance'? renderFinanceGoalLink() : ''}
  </div>`;
}
function renderGoals(){
  const byPillar = {};
  const noPillar = [];
  state.goals.forEach(g=>{
    const ids = (g.pillarIds||[]).filter(id=>pillarOf(id));
    if(ids.length){ ids.forEach(id=> (byPillar[id] = byPillar[id]||[]).push(g)); }
    else noPillar.push(g);
  });
  const goalGroupHtml = (key, icon, label, goals)=>{
    if(!goals || !goals.length) return '';
    const collapsed = state.collapsed[key];
    return `
    <div style="margin-bottom:14px;">
      <h4 style="cursor:pointer;font-size:var(--t4);color:var(--petrol-dark);margin-bottom:8px;display:flex;align-items:center;gap:7px;" data-toggle-collapse="${key}"><span style="flex:1;">${icon} ${escapeHtml(label)} <span class="muted" style="font-size:var(--t2);font-weight:400;">(${goals.length})</span></span><span class="chev ${collapsed?"":"open"}">▾</span></h4>
      ${collapsed? '' : goals.map(renderGoalCard).join('')}
    </div>`;
  };
  const groupedGoalsHtml = state.goalPillars.map(p=> goalGroupHtml('pillarGroup:'+p.id, p.icon, p.label, byPillar[p.id])).join('')
    + goalGroupHtml('pillarGroup:__none__', '🗂️', 'بدون بند', noPillar);
  return `
  <h2 style="font-size:var(--t6);color:var(--petrol-dark);margin-bottom:4px;">الأساس</h2>
  <p class="muted" style="margin-bottom:16px;">رؤيتك وأهدافك السنوية. كل هدف له <b>بند هوية</b> (مَن تكونين) و<b>مجال</b> (نوع الشغل) — البند يجمع أهدافك هنا، والمجال يجمع مهامها بصفحة المهام.</p>

  ${renderLifeVisionSection()}

  <details class="card" data-sec="goals" ${openSections.goals===false?'':'open'} style="margin-bottom:14px;">
    <summary><h3>🎯 الأهداف السنوية <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <button class="btn btn-block" id="goAddGoal2" style="margin-bottom:16px;">+ إضافة هدف جديد</button>
      ${state.goals.length===0? `<div class="empty">لسا ما أضفتي أهداف. ابدئي بأول هدف يمثلك هالسنة.</div>` : groupedGoalsHtml}
    </div>
  </details>

  <div class="card" style="text-align:center;">
    <p class="muted" style="margin-bottom:10px;">القوائم اللي تُبنى عليها صفحاتك — بنود الهوية، صناديق الزمن، التصنيفات، أنواع الفعل، التساؤلات، والمشاعر — انتقلت للإعدادات، عشان هالصفحة تضل لرؤيتك وأهدافك.</p>
    <button class="btn ghost sm" id="goToLists">⚙️ افتحي قوائمك</button>
  </div>`;
}
/* the six list managers. They were stacked under الأساس, where they accounted for
   125 of that page's 138 buttons and every one of its 71 fields — a page meant for
   her vision and her yearly goals had become a control panel. They are settings,
   and they live with the settings now. */
function renderHomeCardsManager(){
  const on = HOME_CARDS.filter(c=>homeCardOn(c.id)).length;
  return `
  <details class="card" data-sec="homeCards" ${openSections.homeCards?'open':''} style="margin-bottom:14px;">
    <summary><h3>🗓️ وش يظهر بصفحة اليوم <span class="muted" style="font-size:var(--t2);font-weight:400;">(${on} من ${HOME_CARDS.length})</span> <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <p class="muted" style="margin-bottom:10px;">أوقفي أي بطاقة ما تستخدمينها فتختفي من يومك. بياناتها تضل محفوظة، وترجع متى ما فعّلتيها.</p>
      ${HOME_CARDS.map(c=>{
        const off = !homeCardOn(c.id);
        return `
        <div class="tcat-row" style="${off?'opacity:.6;':''}">
          <button type="button" class="icon-btn" data-homecard="${c.id}" title="${off?'موقوفة — اضغطي للتفعيل':'نشطة — اضغطي للإيقاف'}" style="flex-shrink:0;">${off?'⭕':'✅'}</button>
          <div style="flex:1;min-width:0;">
            <div style="font-size:var(--t3);color:var(--ink);${off?'font-style:italic;':''}">${escapeHtml(c.label)}</div>
            <div class="muted" style="font-size:var(--t1);">${escapeHtml(c.hint)}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </details>`;
}
function renderListManagers(){
  return `
  ${renderHomeCardsManager()}
  ${renderGoalPillarManager()}
  ${renderTimeBoxManager()}
  ${renderTaskCategoryManager()}
  ${renderActionTypeManager()}
  ${renderDailyQuestionsManager()}
  ${renderMoodManager()}
  `;
}
function renderFinanceGoalLink(){
  const fg = state.financialGoal;
  if(fg && fg.configured){
    const pct = fg.targetAmount? Math.min(100, Math.round((fg.currentAmount/fg.targetAmount)*100)) : 0;
    return `<div class="quote-box" style="margin-top:10px;">
      <p class="muted" style="margin-bottom:8px;">🎯 هدفك المالي التفصيلي: <b style="color:var(--petrol-dark);">${escapeHtml(fg.title)}</b> — ${fg.currentAmount.toLocaleString('ar')} من ${fg.targetAmount.toLocaleString('ar')} ريال (${pct}%)</p>
      <button type="button" class="btn ghost sm" data-goto-money="1">افتحي التفاصيل بصفحة المالية</button>
    </div>`;
  }
  return `<div class="quote-box" style="margin-top:10px;">
    <p class="muted" style="margin-bottom:8px;">فيه أداة مخصصة لأهدافك المالية بتفاصيل أكثر (مراحل، طرق دخل، متابعة تلقائية) بتبويب "المالية".</p>
    <button type="button" class="btn ghost sm" data-goto-money="1">افتحي الهدف المالي التفصيلي</button>
  </div>`;
}

function generateFinanceStages(target, start){
  const span = Math.max(0, target-start);
  return FINANCE_STAGE_TEMPLATES.map(t=>({
    id:uid(), title:t.title, targetAmount:Math.round(start+span*t.fraction), done:false,
    tasks: t.tasks.map(txt=>({id:uid(), text:txt, done:false}))
  }));
}
function getEffectiveSequence(fg, methodId){
  const p = FINANCE_PATHS.find(x=>x.id===methodId);
  if(!p) return [];
  const setup = (fg.pathSetup && fg.pathSetup[methodId]) || {};
  const missingTools = (p.tools||[]).filter(t=> setup.tools && setup.tools[t]===false);
  const toolTasks = missingTools.map(t=>'جهّزي: '+t);
  const startIdx = setup.skillLevel==='متمرسة'? Math.min(2, p.tips.length-1) : setup.skillLevel==='أساسيات'? Math.min(1, p.tips.length-1) : 0;
  return [...toolTasks, ...p.tips.slice(startIdx)];
}
function defaultSpacingDays(timeline){
  if(timeline==='شهر') return 2;
  if(timeline==='3 أشهر') return 3;
  return 7;
}

function attachPathQualifyEvents(){
  document.querySelectorAll('[data-pq-skill]').forEach(b=> b.onclick=()=>{ pathQualifyDraft.skillLevel=b.dataset.pqSkill; render(); });
  document.querySelectorAll('[data-pq-timeline]').forEach(b=> b.onclick=()=>{ pathQualifyDraft.timeline=b.dataset.pqTimeline; render(); });
  document.querySelectorAll('[data-pq-tool]').forEach(b=> b.onclick=()=>{
    const t = b.dataset.pqTool;
    pathQualifyDraft.tools[t] = !pathQualifyDraft.tools[t];
    render();
  });
  document.getElementById('pqSave').onclick = ()=>{
    pathQualifyDraft.successCriteria = document.getElementById('pqSuccess').value.trim();
    const fg = state.financialGoal;
    if(!fg.paths) fg.paths = [];
    if(!fg.pathSetup) fg.pathSetup = {};
    if(!fg.pathProgress) fg.pathProgress = {};
    if(!fg.paths.includes(pathQualifyDraft.methodId)) fg.paths.push(pathQualifyDraft.methodId);
    fg.pathSetup[pathQualifyDraft.methodId] = {
      skillLevel: pathQualifyDraft.skillLevel, timeline: pathQualifyDraft.timeline,
      successCriteria: pathQualifyDraft.successCriteria, tools: pathQualifyDraft.tools
    };
    fg.pathProgress[pathQualifyDraft.methodId] = 0;
    pathQualifyDraft = null;
    saveState(); render();
  };
  document.getElementById('pqCancel').onclick = ()=>{ pathQualifyDraft = null; render(); };
}
function renderFinancePage(){
  const fg = state.financialGoal;
  if(financeSetupDraft || !fg || !fg.configured) return renderFinanceSetup();
  if(!fg.paths) fg.paths = [];
  if(!fg.customPaths) fg.customPaths = [];
  /* paths she added herself started as just a name; give the older ones the same
     fields the built-in paths have so they render and behave identically */
  fg.customPaths.forEach(cp=>{
    if(cp.icon===undefined) cp.icon = '✏️';
    if(cp.target===undefined) cp.target = '';
    if(cp.earned===undefined) cp.earned = '';
    if(cp.successCriteria===undefined) cp.successCriteria = '';
    if(cp.note===undefined) cp.note = '';
    if(!Array.isArray(cp.steps)) cp.steps = [];
  });
  if(!fg.pathSetup) fg.pathSetup = {};
  if(!fg.pathProgress) fg.pathProgress = {};
  return renderFinanceDashboard();
}

      ${selected.map(pid=>{

        const seq = getEffectiveSequence(fg, pid);
        const idx = fg.pathProgress[pid]||0;
        const override = fg.pathOverrides && fg.pathOverrides[pid] && fg.pathOverrides[pid][idx];
        const tip = override!=null ? override : seq[idx];

            : `<p class="muted" style="margin:6px 0 10px;">${steps.length? 'خلّصتي كل خطواتك هنا 🎉' : 'ما فيه خطوات بعد — أضيفيها من التفاصيل تحت.'}</p>`}

            <div class="path-facts">
                <div class="card-grid" style="margin-bottom:10px;">
                  <div><label>الهدف الرقمي (ريال)</label><input type="number" min="0" step="0.01" data-cp-target="${cp.id}" value="${cp.target||''}" placeholder="مثال: 20000"/></div>

                <div style="margin-bottom:10px;"><label>نجاحك يعني</label><input type="text" data-cp-success="${cp.id}" value="${escapeHtml(cp.successCriteria||'')}" placeholder="وش شكل النجاح بهالطريقة؟"/></div>

                    <button type="button" class="icon-btn" title="أضيفيها لمهامي" data-cp-step-task="${cp.id}|${s.id}">📌</button>
                    <button type="button" class="icon-btn" data-cp-step-del="${cp.id}|${s.id}">✕</button>

                <div style="display:flex;gap:8px;margin-top:8px;">
                  <input type="text" data-cp-step-new="${cp.id}" placeholder="خطوة جديدة…" style="flex:1;"/>
                  <button type="button" class="btn sm" data-cp-step-add="${cp.id}">إضافة</button>
                </div>

                <div class="card-grid" style="margin-bottom:10px;">
                  <div><label>اسم الطريقة</label><input type="text" data-cp-label="${cp.id}" value="${escapeHtml(cp.label)}" placeholder="اسم الطريقة"/></div>
                  <div><label>رمز</label><input type="text" data-cp-icon="${cp.id}" value="${escapeHtml(cp.icon||'✏️')}" placeholder="✏️" style="text-align:center;"/></div>
                </div>
                <button class="btn ghost sm" style="margin-top:12px;" data-custompath-del="${cp.id}">✕ احذفي هالطريقة</button>
            </div>
          </div>
        </details>`;
      }).join('')}

      <details class="path-add" data-sec="finAddPath" ${(openSections.finAddPath || selected.length===0)?'open':''}>
        <summary><span class="grow">+ إضافة طريقة</span><span class="chev">▾</span></summary>
        <div class="details-body">
          <p class="muted" style="margin-bottom:8px;font-size:var(--t2);">اختاري طريقة وأعطيك خطوة عملية كل مرة — توافقين عليها أو تطلبين غيرها.</p>
          <div class="field" style="margin-bottom:8px;">
            <select id="methodSelect">
              ${available.length? available.map(p=>`<option value="${p.id}">${p.icon} ${p.label}</option>`).join('') : '<option value="">-- كل الطرق مختارة --</option>'}
            </select>
          </div>
          <button class="btn btn-block" id="methodAdd" style="margin-bottom:12px;" ${available.length===0?'disabled':''}>+ إضافة هالطريقة</button>
          <div style="display:flex;gap:8px;">
            <input type="text" id="customPathInput" placeholder="طريقة ثانية من عندك…" style="flex:1;"/>
            <button class="btn sm" id="customPathAdd">إضافة</button>
          </div>
          <p class="muted" style="margin-top:10px;font-size:var(--t2);">💡 اطلبي مني بالمحادثة رابط تعلم يناسب أي طريقة، وأضيفيه بنفسك لمهامك.</p>
        </div>
      </details>
    </div>
  </details>`;
}

/* ============ project financial ledger (على صفحة الهدف المالي) ============ */
const PL_INCOME_CATS = ['مبيعات','استشارات','منتج','مشروع','أخرى'];
const PL_EXPENSE_CATS = ['تسويق','أدوات وبرمجيات','شحن وتغليف','عمولات منصة','مواد خام','أخرى'];
function plFmt(n){ return Number(n||0).toLocaleString('ar-SA', {maximumFractionDigits:2}); }
function plRowHasData(r){ return !!(r.desc||'').trim() && (parseFloat(r.amount)||0) > 0; }
/* same pattern as everywhere else on the money pages: a filled-in entry
   (description + a real amount) collapses to a clean summary line once
   she's not actively editing it, instead of staying an open form forever. */
function plRowHtml(r, opts){
  opts = opts || {};
  const editing = plEditingId===r.id || !plRowHasData(r);
  const isIncome = r.type!=='expense';
  if(!editing){
    return `
    <div class="inbox-row" data-id="${r.id}">
      <span class="dot" style="background:${isIncome?'#2f9e6e':'var(--rose)'};"></span>
      <div style="flex:1;">
        <div style="font-size:var(--t3);font-weight:700;color:var(--ink);">${escapeHtml(r.desc)}</div>
        <div class="muted" style="font-size:var(--t2);">${opts.inGroup? "" : (isIncome?"🟢 ":"🔴 ") + escapeHtml(r.category||"") + " · "}${r.date||""} · ${plFmt(parseFloat(r.amount)||0)} ريال</div>
      </div>
      <button type="button" class="icon-btn" data-pl-edit="${r.id}">✎</button>
      <button type="button" class="icon-btn del-row" aria-label="حذف">✕</button>
    </div>`;
  }
  const cats = isIncome? PL_INCOME_CATS : PL_EXPENSE_CATS;
  return `
  <div class="item-card fin-ledger-card" data-id="${r.id}">
    <div class="card-top">
      <div class="chip-row" style="flex:1;">
        <button type="button" class="chip ${isIncome?'selected':''}" data-pl-type="income">🟢 دخل</button>
        <button type="button" class="chip ${!isIncome?'selected':''}" data-pl-type="expense">🔴 مصروف</button>
      </div>
      <button type="button" class="del-row" aria-label="حذف">✕</button>
    </div>
    <div style="margin-bottom:8px;"><label>الوصف</label><input class="inp-desc" type="text" placeholder="مثال: تصميم لوقو لعميل" value="${escapeHtml(r.desc||'')}"/></div>
    <div class="card-grid">
      <div><label>المبلغ</label><input class="inp-amt" type="number" min="0" step="0.01" value="${r.amount||''}"/></div>
      <div><label>التاريخ</label><input class="inp-date" type="date" value="${r.date||todayStr()}"/></div>
    </div>
    <div style="margin-top:8px;"><label>التصنيف</label><select class="sel-cat">${cats.map(c=>`<option value="${escapeHtml(c)}" ${r.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>
    <div style="margin-top:8px;"><label>من أي طريقة؟</label><select class="sel-path">
      <option value="">— بدون طريقة —</option>
      ${plPathOptions().map(o=>`<option value="${escapeHtml(o.id)}" ${r.pathId===o.id?'selected':''}>${o.icon} ${escapeHtml(o.label)}</option>`).join('')}
    </select></div>
    ${plRowHasData(r)? `<button type="button" class="btn ghost sm" style="margin-top:10px;" data-pl-done="${r.id}">✓ تم</button>`:''}
  </div>`;
}
function plRenderRows(){
  const container = document.getElementById('plRows');
  if(!container) return;
  /* Filed under the income path each entry came from, then by product. A path
     shows its total, a product shows its own, and the individual transactions
     stay folded — she reads the ledger to see what a product brought in, not to
     scan every line. A product with a single entry needs no fold of its own. */
  const rows = state.projectLedger;
  const draft = rows.filter(r=> plEditingId===r.id || !plRowHasData(r));
  const filed = rows.filter(r=> !draft.includes(r));
  const paths = [];
  filed.forEach(r=>{
    const pid = r.pathId || '';
    let g = paths.find(x=>x.id===pid);
    if(!g){
      const p = pid? plPathOf(pid) : null;
      g = {id:pid, label:p? p.label : 'بدون طريقة', icon:p? p.icon : '🗂️', items:[], income:0, expense:0};
      paths.push(g);
    }
    const amt = parseFloat(r.amount)||0;
    if(r.type==='expense') g.expense += amt; else g.income += amt;
    const name = (r.desc||'').trim() || 'بدون اسم';
    let it = g.items.find(x=>x.name===name && x.isIncome===(r.type!=='expense'));
    if(!it){ it = {name, isIncome:r.type!=='expense', rows:[], total:0}; g.items.push(it); }
    it.rows.push(r);
    it.total += amt;
  });
  paths.forEach(g=> g.items.sort((a,b)=> (a.isIncome===b.isIncome? b.total-a.total : (a.isIncome? -1 : 1))));
  paths.sort((a,b)=> (b.income-b.expense) - (a.income-a.expense));

  container.innerHTML = rows.length? (
    paths.map(g=>{
      const pKey = 'plPath:'+(g.id||'none');
      const pClosed = state.collapsed[pKey] !== false;
      const net = g.income - g.expense;
      return `
      <div class="pl-group">
        <button type="button" class="pl-group-head" data-toggle-collapse="${pKey}">
          <span class="chev ${pClosed?'':'open'}">▾</span>
          <span style="flex-shrink:0;">${g.icon}</span>
          <span class="grow">${escapeHtml(g.label)} <span class="muted" style="font-weight:400;">(${g.items.length})</span></span>
          <b style="color:${net<0?'var(--rose-dark)':'#2f9e6e'};">${plFmt(Math.abs(net))} ريال${net<0?' −':''}</b>
        </button>
        ${pClosed? '' : g.items.map(it=>{
          const iKey = 'plItem:'+(g.id||'none')+'|'+it.name;
          const single = it.rows.length===1;
          const iClosed = state.collapsed[iKey] !== false;
          /* one entry needs no header of its own — the row already carries the
             name, the date and the amount, and repeating the name reads as noise */
          if(single) return `<div class="pl-item">${plRowHtml(it.rows[0],{inGroup:true})}</div>`;
          return `
          <div class="pl-item">
            <button type="button" class="pl-item-head" data-toggle-collapse="${iKey}">
              <span class="chev ${iClosed?'':'open'}">▾</span>
              <span class="grow">${escapeHtml(it.name)} <span class="muted" style="font-weight:400;">(${it.rows.length})</span></span>
              <b style="color:${it.isIncome?'#2f9e6e':'var(--rose-dark)'};">${plFmt(it.total)} ريال</b>
            </button>
            ${iClosed? '' : it.rows.map(x=>plRowHtml(x,{inGroup:true})).join('')}
          </div>`;
        }).join('')}
      </div>`;
    }).join('') + draft.map(plRowHtml).join('')
  ) : `<div class="empty tight">ما فيه عمليات مسجلة بعد<span class="hint">اضغطي "إضافة عملية جديدة"</span></div>`;

  container.querySelectorAll('[data-toggle-collapse]').forEach(el=> el.onclick=()=>{
    const key = el.dataset.toggleCollapse;
    state.collapsed[key] = state.collapsed[key]===false;
    saveState(); plRenderRows();
  });
  container.querySelectorAll('[data-pl-edit]').forEach(b=> b.onclick=()=>{ plEditingId = b.dataset.plEdit; plRenderRows(); });
  container.querySelectorAll('[data-pl-done]').forEach(b=> b.onclick=()=>{ plEditingId = null; saveState(); plRenderRows(); plUpdateStats(); });
  container.querySelectorAll('[data-pl-type]').forEach(b=> b.onclick=()=>{
    const rowEl = b.closest('[data-id]');
    const row = state.projectLedger.find(r=>r.id===rowEl.dataset.id);
    if(!row) return;
    row.type = b.dataset.plType;
    const cats = row.type==='expense'? PL_EXPENSE_CATS : PL_INCOME_CATS;
    if(!cats.includes(row.category)) row.category = cats[0];
    saveState(); plRenderRows(); plUpdateStats();
  });
  container.querySelectorAll('[data-id]').forEach(rowEl=>{
    const id = rowEl.getAttribute('data-id');
    const row = state.projectLedger.find(r=>r.id===id);
    if(!row) return;
    const descInp = rowEl.querySelector('.inp-desc');
    if(descInp){
      descInp.oninput = (e)=>{ row.desc = e.target.value; saveState(); };
      descInp.onchange = ()=> plRenderRows();
    }
    const amtInp = rowEl.querySelector('.inp-amt');
    if(amtInp){
      amtInp.oninput = (e)=>{ row.amount = e.target.value; saveState(); plUpdateStats(); };
      amtInp.onchange = ()=> plRenderRows();
    }
    const dateInp = rowEl.querySelector('.inp-date');
    if(dateInp) dateInp.onchange = (e)=>{ row.date = e.target.value; saveState(); };
    const catSel = rowEl.querySelector('.sel-cat');
    if(catSel) catSel.onchange = (e)=>{ row.category = e.target.value; saveState(); };
    const pathSel = rowEl.querySelector('.sel-path');
    if(pathSel) pathSel.onchange = (e)=>{ row.pathId = e.target.value || null; saveState(); plRenderRows(); };
    rowEl.querySelector('.del-row').onclick = ()=>{
      if(!confirm('تحذفين هذي العملية؟')) return;
      state.projectLedger = state.projectLedger.filter(x=>x!==row);
      saveState(); plRenderRows(); plUpdateStats();
    };
  });
}
/* the income paths she actually chose — built-in and her own — so a ledger entry
   can say which one it came from */
function plPathOptions(){
  const fg = state.financialGoal || {};
  const built = (fg.paths||[]).map(id=>{
    const p = FINANCE_PATHS.find(x=>x.id===id);
    return p? {id:p.id, label:p.label, icon:p.icon} : null;
  }).filter(Boolean);
  const own = (fg.customPaths||[]).map(c=>({id:c.id, label:c.label, icon:c.icon||'✏️'}));
  return built.concat(own);
}
function plPathOf(id){ return plPathOptions().find(o=>o.id===id) || null; }
function plNet(){
  const income = state.projectLedger.filter(r=>r.type!=='expense').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  const expense = state.projectLedger.filter(r=>r.type==='expense').reduce((s,r)=>s+(parseFloat(r.amount)||0),0);
  return {income, expense, net: income-expense};
}
/* how much of the project's net profit has already been moved into the financial
   goal, so the "add to goal" button only ever offers what's new since last time */
function plUnclaimed(){
  return Math.max(0, plNet().net - (state.projectLedgerClaimed||0));
}
function plUpdateStats(){
  const el = id=>document.getElementById(id);
  if(!el('plIncomeVal')) return;
  const {income, expense, net} = plNet();
  el('plIncomeVal').textContent = plFmt(income)+' ريال';
  el('plExpenseVal').textContent = plFmt(expense)+' ريال';
  const netEl = el('plNetVal');
  netEl.textContent = plFmt(Math.abs(net))+' ريال'+(net<0?' (خسارة)':'');
  netEl.style.color = net<0? 'var(--rose-dark)' : '#2f9e6e';
  const box = el('plToGoalBox');
  if(box){
    const fg = state.financialGoal;
    const unclaimed = plUnclaimed();
    const canPush = fg && fg.configured && unclaimed > 0;
    box.innerHTML = canPush
      ? `<button type="button" class="btn ghost sm btn-block" id="plToGoalBtn">💰 أضيفي ${plFmt(unclaimed)} ريال من ربح مشروعك لهدفك المالي</button>`
      : (state.projectLedgerClaimed>0
          ? `<p class="muted" style="font-size:var(--t2);text-align:center;margin:0;">✓ أضفتِ ${plFmt(state.projectLedgerClaimed)} ريال من ربح مشروعك لهدفك المالي</p>`
          : '');
    const btn = el('plToGoalBtn');
    if(btn) btn.onclick = ()=>{
      const amt = plUnclaimed();
      const g = state.financialGoal;
      if(amt<=0 || !g || !g.configured) return;
      g.currentAmount = (g.currentAmount||0) + amt;
      g.stages.forEach(s=>{ if(!s.done && g.currentAmount >= s.targetAmount) s.done = true; });
      state.projectLedgerClaimed = plNet().net;
      saveState(); popStamp('ربح مشروعك وصل هدفك!','ماشاءالله عليك'); render();
    };
  }
}
