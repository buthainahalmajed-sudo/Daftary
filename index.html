<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');

:root{
  --ink:#1F3A3D;
  --petrol:#2E5C5A;
  --petrol-dark:#1D3E3C;
  --parchment:#F6F1E7;
  --paper:#FFFDF8;
  --rose:#B24C63;
  --rose-dark:#8F3A4E;
  --gold:#C79A3C;
  --sage:#8FA998;
  --line:#DDD2BA;
}
*{box-sizing:border-box;}
input,select,textarea,button{min-width:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--parchment);
  background-image:radial-gradient(var(--line) 1px, transparent 1px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic',sans-serif;
  min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 100px;min-height:100vh;position:relative;}
h1,h2,h3{font-family:'IBM Plex Sans Arabic',sans-serif;margin:0;font-weight:700;}
.hidden{display:none!important;}
button{font-family:'IBM Plex Sans Arabic',sans-serif;cursor:pointer;border:none;}
input,select,textarea{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:16px;}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand .seal{width:34px;height:34px;border-radius:50%;background:var(--petrol);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:20px;flex-shrink:0;}
.brand h1{font-size:22px;color:var(--petrol-dark);}
.date-chip{font-size:12px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--petrol-dark);}
.size-ctrl{display:flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:3px;flex-shrink:0;}
.size-ctrl button{width:28px;height:28px;border-radius:50%;background:none;color:var(--petrol-dark);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
.size-ctrl button:active{background:var(--parchment);}
.size-ctrl button:disabled{opacity:.3;}

/* ---------- date navigator ---------- */
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px 10px;}
.date-nav .arrow{width:34px;height:34px;border-radius:9px;background:var(--parchment);border:1px solid var(--line);color:var(--petrol-dark);font-size:16px;flex-shrink:0;}
.date-nav .arrow:hover{background:var(--sage);color:#fff;}
.date-nav .mid{flex:1;text-align:center;}
.date-nav .mid .dname{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:18px;color:var(--petrol-dark);}
.date-nav .mid .ddate{font-size:11.5px;color:#6b7a78;}
.date-nav input[type=date]{border:none;background:none;color:#6b7a78;font-size:11px;width:26px;padding:0;opacity:0;position:absolute;}
.date-nav .picker{position:relative;}
.today-btn{font-size:11px;background:var(--sage);color:#fff;padding:6px 10px;border-radius:8px;font-weight:700;flex-shrink:0;}
.browsing-badge{display:inline-block;font-size:11px;background:rgba(178,76,99,.12);color:var(--rose-dark);padding:3px 10px;border-radius:20px;font-weight:700;margin-bottom:10px;}

/* ---------- cards ---------- */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 1px 0 rgba(31,58,61,0.03);
}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:10px;justify-content:space-between;}

/* ---------- collapsible cards ---------- */
details.card{padding:0;}
details.card > summary{list-style:none;cursor:pointer;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
details.card > summary::-webkit-details-marker{display:none;}
details.card > summary h3{font-size:19px;color:var(--petrol-dark);}
details.card > summary .chev{font-size:13px;color:var(--petrol);transition:transform .2s ease;flex-shrink:0;}
details.card[open] > summary .chev{transform:rotate(180deg);}
details.card > .details-body{padding:0 18px 18px;}
.card-title h3{font-size:20px;color:var(--petrol-dark);}
.eyebrow{font-size:11px;letter-spacing:.4px;color:var(--rose-dark);font-weight:700;margin-bottom:4px;display:block;}
.muted{color:#6b7a78;font-size:14px;}
.quote-box{background:var(--parchment);border-right:3px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:10px;}
.quote-box p{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:17px;color:var(--petrol-dark);margin:0;line-height:1.6;}

/* ---------- buttons ---------- */
.btn{
  background:var(--petrol);color:#fff;border-radius:10px;padding:12px 18px;
  font-size:15px;font-weight:700;transition:transform .12s ease, background .15s ease;
}
.btn:hover{background:var(--petrol-dark);}
.btn:active{transform:scale(.97);}
.btn.rose{background:var(--rose);}
.btn.rose:hover{background:var(--rose-dark);}
.btn.ghost{background:transparent;color:var(--petrol);border:1.5px solid var(--petrol);}
.btn.ghost:hover{background:rgba(46,92,90,.06);}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-block{width:100%;}
.icon-btn{background:none;color:var(--petrol);font-size:16px;padding:4px 8px;border-radius:6px;}
.icon-btn:hover{background:rgba(46,92,90,.08);}

/* ---------- inputs ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:14px;font-weight:700;color:var(--petrol-dark);margin-bottom:6px;}
.field input[type=text], .field input[type=email], .field select, .field textarea{
  width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--parchment);font-size:16px;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}

/* ---------- chips ---------- */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--parchment);
  font-size:14.5px;font-weight:500;color:var(--ink);transition:all .15s ease;
}
.chip.selected{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:700;}
.chip.cat{font-size:14px;}

/* ---------- task/habit rows ---------- */
.task-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);}
.task-row:last-child{border-bottom:none;}
.check{
  width:26px;height:26px;border-radius:50%;border:2px solid var(--petrol);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:var(--paper);position:relative;
}
.check.done{background:var(--gold);border-color:var(--gold);}
.check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;}
.task-title{flex:1;font-size:15.5px;}
.task-title.done{text-decoration:line-through;color:#9aa6a4;}
.tag{font-size:10.5px;background:rgba(46,92,90,.09);color:var(--petrol-dark);padding:2px 8px;border-radius:10px;font-weight:700;}
.tag.p-عالية{background:rgba(178,76,99,.13);color:var(--rose-dark);}
.tag.p-متوسطة{background:rgba(199,154,60,.15);color:#8a6a1f;}

/* ---------- stamp ---------- */
.stamp-pop{
  position:fixed;top:50%;right:50%;transform:translate(50%,-50%) scale(.4) rotate(-18deg);
  opacity:0;pointer-events:none;z-index:50;transition:all .45s cubic-bezier(.2,1.4,.4,1);
}
.stamp-pop.show{opacity:1;transform:translate(50%,-50%) scale(1) rotate(-10deg);}
.stamp-pop svg{width:150px;height:150px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));}

/* ---------- nav ---------- */
.nav{
  position:fixed;bottom:0;right:0;left:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:40;
}
.nav-inner{max-width:640px;width:100%;display:flex;justify-content:space-around;}
.nav-btn{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8b9694;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:10px;}
.nav-btn.active{color:var(--petrol);}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;}

/* ---------- goal pill ---------- */
.goal-card{border-right:4px solid var(--sage);}

/* ---------- financial safety calculator ---------- */
.safety-calc .item-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);}
.safety-calc .item-row:last-of-type{border-bottom:none;}
.safety-calc .item-row select, .safety-calc .item-row input{background:var(--parchment);border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12.5px;font-family:inherit;color:var(--ink);}
.safety-calc .item-row .sel-item{flex:2;min-width:130px;}
.safety-calc .item-row .sel-custom{flex:2;min-width:110px;}
.safety-calc .item-row .sel-tag{flex:1.3;min-width:110px;}
.safety-calc .item-row .inp-amt{flex:1;min-width:75px;}
.safety-calc .item-row .del-row{background:none;border:none;color:#b9ad96;cursor:pointer;font-size:15px;padding:6px;}
.safety-calc .item-row .del-row:hover{color:var(--rose);}
.safety-calc .total-line{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.safety-calc .total-line .lbl{font-size:12.5px;color:#6b7a78;}
.safety-calc .total-line .val{font-size:17px;font-weight:800;color:var(--petrol-dark);}
.safety-calc .result-hero{border-radius:16px;padding:20px;text-align:center;margin-bottom:14px;background:var(--petrol-dark);}

function toISO(dt){ return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

function addDays(dateStr, n){ const dt=parseISO(dateStr); dt.setDate(dt.getDate()+n); return toISO(dt); }

const CLOUD_FILENAME = 'daftari-data.json';
let cloud = {token:'', gistId:'', linked:false};
let cloudStatus = 'idle'; /* idle | syncing | synced | error */
let cloudStatusMsg = '';
let cloudLastSync = null;

function hydrateState(parsed){
  state = Object.assign({name:'', onboarded:false, goals:[], tasks:[], dayTemplates: defaultTemplates(), dailyLogs:{}, tipIndex:{}, tipGoalIndex:0, tipLastDate:null, inbox:[], collapsed:{habits:false, questions:true, reflection:true, mood:true, schedule:true}}, parsed);
  if(!state.dayTemplates) state.dayTemplates = defaultTemplates();
  if(!state.dailyLogs) state.dailyLogs = {};
  if(!state.inbox) state.inbox = [];
  if(!state.collapsed) state.collapsed = {habits:false, questions:true, reflection:true, mood:true, schedule:true};
  else state.collapsed = Object.assign({habits:false, questions:false, reflection:false, mood:false}, state.collapsed);
  if(!state._collapseDefaultsV2){
    state.collapsed.questions = true;
    state.collapsed.mood = true;
    state.collapsed.reflection = true;
    state.collapsed.schedule = true;
    state._collapseDefaultsV2 = true;
  }
  Object.keys(state.dayTemplates).forEach(k=>{
    const tpl = state.dayTemplates[k];
    if(tpl && Array.isArray(tpl.habits)){
      tpl.habits = tpl.habits.map(h => (typeof h === 'string') ? {label:h, enabled:true} : h);
    }
  });
  if((parsed.todayMood && parsed.todayMood.length) || parsed.reflection){
    const d = parsed.lastActiveDate || todayStr();
    const log = getLog(d);
    if(parsed.todayMood) log.mood = parsed.todayMood;
    if(parsed.reflection) log.reflection = parsed.reflection;
  }
}

function loadCloudCfg(){
  try{
    const raw = localStorage.getItem('plannerCloudCfg');
    if(raw) cloud = Object.assign(cloud, JSON.parse(raw));
  }catch(e){}
}
function saveCloudCfg(){
  try{ localStorage.setItem('plannerCloudCfg', JSON.stringify(cloud)); }catch(e){}
}
function ghHeaders(extra){
  return Object.assign({ 'Authorization':'token '+cloud.token, 'Accept':'application/vnd.github+json' }, extra||{});
}
async function cloudPull(){
  if(!cloud.linked) return false;
  cloudStatus='syncing'; cloudStatusMsg='';
  try{
    const res = await fetch('https://api.github.com/gists/'+cloud.gistId, { headers: ghHeaders() });
    if(!res.ok) throw new Error('فشل الاتصال بالسحاب (كود '+res.status+')');
    const data = await res.json();
    const file = data.files && data.files[CLOUD_FILENAME];
    if(!file) throw new Error('ما لقيت ملف البيانات داخل الـ Gist، تأكدي من اسم الملف.');
    const parsed = JSON.parse(file.content || '{}');
    if(parsed && typeof parsed==='object' && Array.isArray(parsed.tasks)){
      hydrateState(parsed);
      try{ localStorage.setItem('plannerState', JSON.stringify(state)); }catch(e){}
    }
    cloudStatus='synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud pull error', e);
    cloudStatus='error'; cloudStatusMsg = friendlyErr(e);
    return false;
  }
}
async function cloudPush(){
  if(!cloud.linked) return false;
  cloudStatus='syncing'; cloudStatusMsg='';
  try{
    const res = await fetch('https://api.github.com/gists/'+cloud.gistId, {
      method:'PATCH',
      headers: ghHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify({ files:{ [CLOUD_FILENAME]:{ content: JSON.stringify(state) } } })
    });
    if(!res.ok) throw new Error('فشل الرفع للسحاب (كود '+res.status+')');
    cloudStatus='synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud push error', e);
    cloudStatus='error'; cloudStatusMsg = friendlyErr(e);
    return false;
  }
}

async function loadState(){
  loadCloudCfg();
  let usedCloud = false;
  if(cloud.linked){ usedCloud = await cloudPull(); }
  if(!usedCloud){
    try{
      const raw = localStorage.getItem('plannerState');
      if(raw) hydrateState(JSON.parse(raw));
    }catch(e){ console.error('تعذر القراءة', e); }
  }
  storageReady = true;
  selectedDate = todayStr();
  weekRef = todayStr();
  render();
}
async function saveState(){
  try{
    localStorage.setItem('plannerState', JSON.stringify(state));
  }catch(e){
    console.error('تعذر الحفظ', e);
  }
  if(cloud.linked){ cloudPush().then(render); }
}


/* ============ scoring: top tasks ============ */
function scoreTask(t){
  let s = 0;
  s += t.priority==='عالية'?3:t.priority==='متوسطة'?2:1;
  if(t.goalId) s += 1;
  if(t.due === todayStr()) s += 2;
  if(t.due && t.due < todayStr()) s += 3;
  return s;
}
function topTasks(){
  const log = getLog(todayStr());
  if(log.pinnedTop3 && log.pinnedTop3.length){
    const pinned = log.pinnedTop3.map(id=> state.tasks.find(t=>t.id===id && !t.done)).filter(Boolean);
    if(pinned.length) return pinned;
  }
  return state.tasks.filter(t=>!t.done).sort((a,b)=>scoreTask(b)-scoreTask(a)).slice(0,3);
}
function topTasksHasTie(){
  const undone = state.tasks.filter(t=>!t.done).sort((a,b)=>scoreTask(b)-scoreTask(a));
  if(undone.length<4) return false;
  return scoreTask(undone[2]) === scoreTask(undone[3]);
}
function moveTaskAmongUndone(taskId, dir){
  const arr = state.tasks;
  const i = arr.findIndex(t=>t.id===taskId);
  if(i<0) return;
  let j = i+dir;
  while(j>=0 && j<arr.length && arr[j].done) j += dir;
  if(j>=0 && j<arr.length){
    const tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
    saveState(); render();
  }
}
function swapAmongActive(arr, idx, dir){
  let j = idx+dir;
  while(j>=0 && j<arr.length && arr[j].enabled===false) j += dir;
  if(j>=0 && j<arr.length){
    const tmp = arr[idx]; arr[idx]=arr[j]; arr[j]=tmp;
    return true;
  }
  return false;
}
function moveHabitAmongActive(dow, idx, dir){
  const arr = state.dayTemplates[dow].habits;
  if(swapAmongActive(arr, idx, dir)){ saveState(); render(); }
}
function moveHabitAcrossWeek(label, dir){
  const start = startOfWeek(weekRef);
  const dates = Array.from({length:7},(_,i)=>addDays(start,i));
  const dowsSeen = new Set();
  dates.forEach(d=>{
    const dow = dowOf(d);
    if(dowsSeen.has(dow)) return;
    dowsSeen.add(dow);
    const arr = state.dayTemplates[dow].habits;
    const idx = arr.findIndex(h=>h.label===label && h.enabled!==false);
    if(idx>-1) swapAmongActive(arr, idx, dir);
  });
  saveState(); render();
}

function attachSettingsEvents(){
  document.getElementById('closeSettings').onclick = ()=>{ settingsOpen=false; syncExportCode=''; syncMsg=null; render(); };

  const cfgGistId = document.getElementById('cfgGistId');
  const cfgToken = document.getElementById('cfgToken');
  const syncCfgFields = ()=>{
    if(cfgGistId) cloud.gistId = cfgGistId.value.trim();
    if(cfgToken) cloud.token = cfgToken.value.trim();
  };

  const linkPush = document.getElementById('linkPush');
  if(linkPush) linkPush.onclick = async ()=>{
    syncCfgFields();
    if(!cloud.gistId || !cloud.token){ cloudStatus='error'; cloudStatusMsg='عبي Gist ID وToken أول.'; render(); return; }
    cloud.linked = true; saveCloudCfg();
    const ok = await cloudPush();
    if(!ok) cloud.linked = false;
    saveCloudCfg(); render();
  };
  const linkPull = document.getElementById('linkPull');
  if(linkPull) linkPull.onclick = async ()=>{
    syncCfgFields();
    if(!cloud.gistId || !cloud.token){ cloudStatus='error'; cloudStatusMsg='عبي Gist ID وToken أول.'; render(); return; }
    cloud.linked = true; saveCloudCfg();
    const ok = await cloudPull();
    if(!ok) cloud.linked = false;
    saveCloudCfg(); render();
  };
  const syncNow = document.getElementById('syncNow');
  if(syncNow) syncNow.onclick = async ()=>{ await cloudPull(); render(); };
  const unlinkCloud = document.getElementById('unlinkCloud');
  if(unlinkCloud) unlinkCloud.onclick = ()=>{
    cloud = {token:'', gistId:'', linked:false};
    saveCloudCfg();
    cloudStatus='idle'; cloudStatusMsg='';
    render();
  };

  document.getElementById('genCode').onclick = async ()=>{
    syncExportCode = encodeState();
    try{ if(navigator.clipboard) await navigator.clipboard.writeText(syncExportCode); }catch(e){}
    render();
  };
  const importBox = document.getElementById('importBox');
  if(importBox) importBox.oninput = ()=>{ syncImportText = importBox.value; };
  document.getElementById('doImport').onclick = ()=>{
    const val = (importBox? importBox.value : syncImportText).trim();
    if(!val){ syncMsg = {ok:false, text:'الصقي الكود أول.'}; render(); return; }
    try{
      const parsed = decodeState(val);
      if(!parsed || typeof parsed !== 'object' || !('tasks' in parsed)){ throw new Error('bad'); }
      hydrateState(parsed);
      saveState();
      syncMsg = {ok:true, text:'تم الاستيراد بنجاح! بياناتك صارت نفس الجهاز الثاني.'};
      syncImportText = '';
      render();
    }catch(e){
      syncMsg = {ok:false, text:'الكود مو صحيح أو تالف، تأكدي إنك نسختيه كامل.'};
      render();
    }
  };
}

        <div style="display:flex;gap:2px;">
          <button class="icon-btn" data-goal-up="${i}" ${i===0?'disabled':''}>▲</button>
          <button class="icon-btn" data-goal-down="${i}" ${i===state.goals.length-1?'disabled':''}>▼</button>
          <button class="icon-btn" data-delgoal="${g.id}">✕</button>
        </div>
      </div>
      ${g.answers && g.answers.some(a=>a) ? `
        <div style="margin-top:6px;">
          ${QUESTIONS[g.cat].map((q,i)=> g.answers[i]? `<p class="muted" style="margin-bottom:6px;"><b style="color:var(--petrol-dark);">${q}</b><br>${escapeHtml(g.answers[i])}</p>`:'').join('')}
        </div>`:''}
      <button class="btn ghost sm" data-addtaskfor="${g.id}" style="margin-top:8px;">+ إضافة مهمة لهالهدف</button>
      ${g.cat==='finance'? renderFinanceGoalLink() : ''}
    </div>
  `).join('')}`;
}
function renderFinanceGoalLink(){
  const fg = state.financialGoal;
  if(fg && fg.configured){
    const pct = fg.targetAmount? Math.min(100, Math.round((fg.currentAmount/fg.targetAmount)*100)) : 0;
    return `<div class="quote-box" style="margin-top:10px;">
      <p class="muted" style="margin-bottom:8px;">🎯 هدفك المالي التفصيلي: <b style="color:var(--petrol-dark);">${escapeHtml(fg.title)}</b> — ${fg.currentAmount.toLocaleString('ar')} من ${fg.targetAmount.toLocaleString('ar')} ريال (${pct}%)</p>
      <button type="button" class="btn ghost sm" data-goto-money="1">افتحي التفاصيل بصفحة المالية</button>
    </div>`;
  }
  return `<div class="quote-box" style="margin-top:10px;">
    <p class="muted" style="margin-bottom:8px;">فيه أداة مخصصة لأهدافك المالية بتفاصيل أكثر (مراحل، طرق دخل، متابعة تلقائية) بتبويب "المالية".</p>
    <button type="button" class="btn ghost sm" data-goto-money="1">افتحي الهدف المالي التفصيلي</button>
  </div>`;
}

function generateFinanceStages(target, start){
  const span = Math.max(0, target-start);
  return FINANCE_STAGE_TEMPLATES.map(t=>({
    id:uid(), title:t.title, targetAmount:Math.round(start+span*t.fraction), done:false,
    tasks: t.tasks.map(txt=>({id:uid(), text:txt, done:false}))
  }));
}
function getEffectiveSequence(fg, methodId){
  const p = FINANCE_PATHS.find(x=>x.id===methodId);
  if(!p) return [];
  const setup = (fg.pathSetup && fg.pathSetup[methodId]) || {};
  const missingTools = (p.tools||[]).filter(t=> setup.tools && setup.tools[t]===false);
  const toolTasks = missingTools.map(t=>'جهّزي: '+t);
  const startIdx = setup.skillLevel==='متمرسة'? Math.min(2, p.tips.length-1) : setup.skillLevel==='أساسيات'? Math.min(1, p.tips.length-1) : 0;
  return [...toolTasks, ...p.tips.slice(startIdx)];
}
function defaultSpacingDays(timeline){
  if(timeline==='شهر') return 2;
  if(timeline==='3 أشهر') return 3;
  return 7;
}

function attachPathQualifyEvents(){
  document.querySelectorAll('[data-pq-skill]').forEach(b=> b.onclick=()=>{ pathQualifyDraft.skillLevel=b.dataset.pqSkill; render(); });
  document.querySelectorAll('[data-pq-timeline]').forEach(b=> b.onclick=()=>{ pathQualifyDraft.timeline=b.dataset.pqTimeline; render(); });
  document.querySelectorAll('[data-pq-tool]').forEach(b=> b.onclick=()=>{
    const t = b.dataset.pqTool;
    pathQualifyDraft.tools[t] = !pathQualifyDraft.tools[t];
    render();
  });
  document.getElementById('pqSave').onclick = ()=>{
    pathQualifyDraft.successCriteria = document.getElementById('pqSuccess').value.trim();
    const fg = state.financialGoal;
    if(!fg.paths) fg.paths = [];
    if(!fg.pathSetup) fg.pathSetup = {};
    if(!fg.pathProgress) fg.pathProgress = {};
    if(!fg.paths.includes(pathQualifyDraft.methodId)) fg.paths.push(pathQualifyDraft.methodId);
    fg.pathSetup[pathQualifyDraft.methodId] = {
      skillLevel: pathQualifyDraft.skillLevel, timeline: pathQualifyDraft.timeline,
      successCriteria: pathQualifyDraft.successCriteria, tools: pathQualifyDraft.tools
    };
    fg.pathProgress[pathQualifyDraft.methodId] = 0;
    pathQualifyDraft = null;
    saveState(); render();
  };
  document.getElementById('pqCancel').onclick = ()=>{ pathQualifyDraft = null; render(); };
}

  ${done.length? `

      ${done.map(s=>`<div class="habit-item"><span class="habit-label done" style="flex:1;">${escapeHtml(s.title)}</span><span class="muted" style="font-size:12px;">${s.targetAmount.toLocaleString('ar')} ريال</span></div>`).join('')}

function attachFinanceEvents(){
  const fsSave = document.getElementById('fsSave');
  if(fsSave) fsSave.onclick = ()=>{
    const title = document.getElementById('fsTitle').value.trim() || `الهدف المالي ${new Date().getFullYear()}`;
    const target = parseFloat(document.getElementById('fsTarget').value);
    const current = parseFloat(document.getElementById('fsCurrent').value)||0;
    const deadline = document.getElementById('fsDeadline').value || null;
    if(!target || target<=0){ document.getElementById('fsTarget').focus(); return; }
    const existing = state.financialGoal;
    const keepStages = existing && existing.configured && existing.targetAmount===target;
    state.financialGoal = {
      title, targetAmount: target, currentAmount: current, deadline, configured:true,
      stages: keepStages? existing.stages : generateFinanceStages(target, current),
      paths: existing? (existing.paths||[]) : [],
      customPaths: existing? (existing.customPaths||[]) : [],
      pathProgress: existing? (existing.pathProgress||{}) : {},
      pathSetup: existing? (existing.pathSetup||{}) : {},
    };
    financeSetupDraft = null;
    saveState(); render();
  };
  const fsCancel = document.getElementById('fsCancel');
  if(fsCancel) fsCancel.onclick = ()=>{ financeSetupDraft = null; render(); };

  const methodAdd = document.getElementById('methodAdd');
  if(methodAdd) methodAdd.onclick = ()=>{
    const sel = document.getElementById('methodSelect');
    const val = sel.value;
    if(!val) return;
    const p = FINANCE_PATHS.find(x=>x.id===val);
    pathQualifyDraft = { methodId:val, skillLevel:'', timeline:'', successCriteria:'', tools: Object.fromEntries((p.tools||[]).map(t=>[t,false])) };
    render();
  };
  document.querySelectorAll('[data-path-remove]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    fg.paths = fg.paths.filter(id=>id!==b.dataset.pathRemove);
    if(fg.pathProgress) delete fg.pathProgress[b.dataset.pathRemove];
    if(fg.pathOverrides) delete fg.pathOverrides[b.dataset.pathRemove];
    if(pendingTipAdd && pendingTipAdd.methodId===b.dataset.pathRemove) pendingTipAdd=null;
    saveState(); render();
  });
  const customPathAdd = document.getElementById('customPathAdd');
  if(customPathAdd) customPathAdd.onclick = ()=>{
    const fg = state.financialGoal;
    if(!fg.customPaths) fg.customPaths = [];
    const inp = document.getElementById('customPathInput');
    const val = inp.value.trim();
    if(!val) return;
    fg.customPaths.push({id:uid(), label:val});
    saveState(); render();
  };
  document.querySelectorAll('[data-custompath-del]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    fg.customPaths = fg.customPaths.filter(x=>x.id!==b.dataset.custompathDel);
    saveState(); render();
  });

  document.querySelectorAll('[data-tip-skip]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    if(!fg.pathProgress) fg.pathProgress = {};
    fg.pathProgress[b.dataset.tipSkip] = (fg.pathProgress[b.dataset.tipSkip]||0)+1;
    saveState(); render();
  });
  document.querySelectorAll('[data-tip-edit]').forEach(ta=>{
    ta.onchange = ()=>{
      const [pid, idxStr] = ta.dataset.tipEdit.split('|');
      const idx = parseInt(idxStr,10);
      const fg = state.financialGoal;
      if(!fg.pathOverrides) fg.pathOverrides = {};
      if(!fg.pathOverrides[pid]) fg.pathOverrides[pid] = {};
      const val = ta.value.trim();
      if(val) fg.pathOverrides[pid][idx] = val; else delete fg.pathOverrides[pid][idx];
      saveState();
    };
  });
  document.querySelectorAll('[data-tip-accept]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    const seq = getEffectiveSequence(fg, b.dataset.tipAccept);
    const idx = (fg.pathProgress&&fg.pathProgress[b.dataset.tipAccept])||0;
    const override = fg.pathOverrides && fg.pathOverrides[b.dataset.tipAccept] && fg.pathOverrides[b.dataset.tipAccept][idx];
    pendingTipAdd = { methodId: b.dataset.tipAccept, tipText: override!=null? override : seq[idx], due:'', period:null };
    render();
  });
  const cancelTipAdd = document.getElementById('cancelTipAdd');
  if(cancelTipAdd) cancelTipAdd.onclick = ()=>{ pendingTipAdd = null; render(); };
  document.querySelectorAll('[data-tip-due]').forEach(b=> b.onclick=()=>{
    if(!pendingTipAdd) return;
    pendingTipAdd.due = addDays(todayStr(), parseInt(b.dataset.tipDue,10));
    render();
  });
  document.querySelectorAll('[data-tip-period]').forEach(b=> b.onclick=()=>{
    if(!pendingTipAdd) return;
    pendingTipAdd.period = (pendingTipAdd.period===b.dataset.tipPeriod? null : b.dataset.tipPeriod);
    render();
  });
  const confirmTipAdd = document.getElementById('confirmTipAdd');
  if(confirmTipAdd) confirmTipAdd.onclick = ()=>{
    if(!pendingTipAdd) return;
    const fg = state.financialGoal;
    const due = pendingTipAdd.due || todayStr();
    state.tasks.push({id:uid(), title:pendingTipAdd.tipText, goalId:null, category:'business', priority:'متوسطة', period:pendingTipAdd.period||null, due, link:null, done:false, createdAt:todayStr()});
    if(!fg.pathProgress) fg.pathProgress = {};
    fg.pathProgress[pendingTipAdd.methodId] = (fg.pathProgress[pendingTipAdd.methodId]||0)+1;
    pendingTipAdd = null;
    saveState(); render();
  };

  const financeEdit = document.getElementById('financeEdit');
  if(financeEdit) financeEdit.onclick = ()=>{
    const fg = state.financialGoal;
    financeSetupDraft = {title:fg.title, targetAmount:fg.targetAmount, currentAmount:fg.currentAmount, deadline:fg.deadline||''};
    render();
  };
  const fgAddAmountBtn = document.getElementById('fgAddAmountBtn');
  if(fgAddAmountBtn) fgAddAmountBtn.onclick = ()=>{
    const inp = document.getElementById('fgAddAmountInput');
    const amt = parseFloat(inp.value);
    if(!amt || amt<=0) return;
    const fg = state.financialGoal;
    fg.currentAmount = (fg.currentAmount||0) + amt;
    fg.stages.forEach(s=>{ if(!s.done && fg.currentAmount >= s.targetAmount) s.done = true; });
    saveState(); popStamp('زادت مدخراتك!','ماشاءالله عليك'); render();
  };

  document.querySelectorAll('[data-stagetask-toggle]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskToggle.split('|');
    const fg = state.financialGoal;
    const stage = fg.stages.find(s=>s.id===stageId);
    const t = stage.tasks.find(x=>x.id===taskId);
    if(t) t.done = !t.done;
    saveState(); render();
  });
  document.querySelectorAll('[data-stagetask-edit]').forEach(inp=>{
    inp.onchange = ()=>{
      const [stageId, taskId] = inp.dataset.stagetaskEdit.split('|');
      const stage = state.financialGoal.stages.find(s=>s.id===stageId);
      const t = stage.tasks.find(x=>x.id===taskId);
      if(t){ t.text = inp.value.trim() || t.text; saveState(); }
    };
  });
  document.querySelectorAll('[data-stagetask-addtotasks]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskAddtotasks.split('|');
    pendingStageTaskAdd = { stageId, taskId, due:'', period:null };
    render();
  });
  const stageTaskAddCancel = document.getElementById('stageTaskAddCancel');
  if(stageTaskAddCancel) stageTaskAddCancel.onclick = ()=>{ pendingStageTaskAdd = null; render(); };
  document.querySelectorAll('[data-stagetask-due]').forEach(b=> b.onclick=()=>{
    if(!pendingStageTaskAdd) return;
    pendingStageTaskAdd.due = addDays(todayStr(), parseInt(b.dataset.stagetaskDue,10));
    render();
  });
  document.querySelectorAll('[data-stagetask-period]').forEach(b=> b.onclick=()=>{
    if(!pendingStageTaskAdd) return;
    pendingStageTaskAdd.period = (pendingStageTaskAdd.period===b.dataset.stagetaskPeriod? null : b.dataset.stagetaskPeriod);
    render();
  });
  const stageTaskAddConfirm = document.getElementById('stageTaskAddConfirm');
  if(stageTaskAddConfirm) stageTaskAddConfirm.onclick = ()=>{
    if(!pendingStageTaskAdd) return;
    const stage = state.financialGoal.stages.find(s=>s.id===pendingStageTaskAdd.stageId);
    const t = stage && stage.tasks.find(x=>x.id===pendingStageTaskAdd.taskId);
    if(t){
      const due = pendingStageTaskAdd.due || todayStr();
      state.tasks.push({id:uid(), title:t.text, goalId:null, category:'business', priority:'متوسطة', period:pendingStageTaskAdd.period||null, due, link:null, done:false, createdAt:todayStr()});
    }
    pendingStageTaskAdd = null;
    saveState(); render();
  };
  document.querySelectorAll('[data-stagetask-del]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskDel.split('|');
    const stage = state.financialGoal.stages.find(s=>s.id===stageId);
    stage.tasks = stage.tasks.filter(x=>x.id!==taskId);
    saveState(); render();
  });
  const stageTaskAdd = document.getElementById('stageTaskAdd');
  if(stageTaskAdd) stageTaskAdd.onclick = ()=>{
    const stage = state.financialGoal.stages.find(s=>s.id===stageTaskAdd.dataset.stage);
    const inp = document.getElementById('stageTaskInput');
    const val = inp.value.trim();
    if(!val) return;
    stage.tasks.push({id:uid(), text:val, done:false});
    saveState(); render();
  };
  const stageDone = document.getElementById('stageDone');
  if(stageDone) stageDone.onclick = ()=>{
    const fg = state.financialGoal;
    const stage = fg.stages.find(s=>s.id===stageDone.dataset.stage);
    stage.done = true;
    fg.currentAmount = Math.max(fg.currentAmount, stage.targetAmount);
    saveState(); popStamp('وصلتي للمرحلة!','ماشاءالله عليك'); render();
  };
  document.querySelectorAll('[data-stage-del]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    fg.stages = fg.stages.filter(s=>s.id!==b.dataset.stageDel);
    saveState(); render();
  });
  const stageAddBtn = document.getElementById('stageAddBtn');
  if(stageAddBtn) stageAddBtn.onclick = ()=>{
    const title = document.getElementById('stageAddTitle').value.trim();
    const amount = parseFloat(document.getElementById('stageAddAmount').value);
    if(!title || !amount) return;
    state.financialGoal.stages.push({id:uid(), title, targetAmount:amount, done:false, tasks:[]});
    state.financialGoal.stages.sort((a,b)=> (a.done-b.done) || (a.targetAmount-b.targetAmount));
    saveState(); render();
  };
}

    assets:[{id:uid(), item:"", custom:"", tag:"fast", amount:""}],

function scBuildSimpleOptions(options, selected){

function scBuildTagOptions(selected){

function scBuildAssetTagOptions(selected){
  return Object.keys(SC_ASSET_TAG_META).map(k=>`<option value="${k}" ${selected===k?'selected':''}>${SC_ASSET_TAG_META[k].emoji} ${SC_ASSET_TAG_META[k].label}</option>`).join('');
}
function scActiveList(rows){

    tag: r.tag,

}

function scRenderAssetRows(){
  const sc = state.safety;
  const container = document.getElementById('scAssetRows');
  if(!container) return;
  container.innerHTML = sc.assets.map(r=>{
    const isCustom = r.item === SC_CUSTOM_VALUE;
    const tag = r.tag || 'fast';
    return `
    <div class="item-row" data-id="${r.id}">
      <select class="sel-item">${scBuildSimpleOptions(SC_ASSET_OPTIONS, r.item)}</select>
      ${isCustom ? `<input class="sel-custom" type="text" placeholder="اكتبي اسم الأصل" value="${escapeHtml(r.custom||'')}" />` : ''}
      <select class="sel-tag">${scBuildAssetTagOptions(tag)}</select>
      <input class="inp-amt" type="number" min="0" step="0.01" placeholder="المبلغ" value="${r.amount||''}" />
      <button type="button" class="del-row" aria-label="حذف">✕</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.item-row').forEach(rowEl=>{
    const id = rowEl.getAttribute('data-id');
    const row = sc.assets.find(r=>String(r.id)===id);
    const selItem = rowEl.querySelector('.sel-item');
    selItem.onchange = ()=>{
      row.item = selItem.value; if(row.item!==SC_CUSTOM_VALUE) row.custom='';
      row.tag = SC_ASSET_TAG_MAP[row.item] || 'fast';
      saveState(); scRenderAssetRows(); scUpdateSummary();
    };
    const selCustom = rowEl.querySelector('.sel-custom');
    if(selCustom) selCustom.oninput = ()=>{ row.custom = selCustom.value; saveState(); scUpdateSummary(); };
    const selTag = rowEl.querySelector('.sel-tag');
    if(selTag) selTag.onchange = ()=>{ row.tag = selTag.value; saveState(); scUpdateSummary(); };
    rowEl.querySelector('.inp-amt').oninput = (e)=>{ row.amount = e.target.value; saveState(); scUpdateSummary(); };
    rowEl.querySelector('.del-row').onclick = ()=>{
      sc.assets = sc.assets.filter(x=>x!==row);
      if(sc.assets.length===0) sc.assets.push({id:uid(), item:"", custom:"", tag:"fast", amount:""});
      saveState(); scRenderAssetRows(); scUpdateSummary();
    };
  });
}

function scUpdateSummary(){
  const sc = state.safety;
  scSyncSharedIncome();
  const assets = scActiveList(sc.assets);
  const income = scActiveList(sc.income);
  const expenses = scActiveList(sc.expenses);
  const goals = scActiveList(sc.goals);

  const totalAssets = assets.reduce((s,e)=>s+e.amount,0);
  const fastAssets = assets.filter(e=>e.tag==='fast').reduce((s,e)=>s+e.amount,0);
  const slowAssets = assets.filter(e=>e.tag==='slow').reduce((s,e)=>s+e.amount,0);
  const fixedAssets = assets.filter(e=>e.tag==='fixed').reduce((s,e)=>s+e.amount,0);
  const liquidAssets = fastAssets + slowAssets;
  const totalIncomeMonthly = income.reduce((s,e)=> s + (SC_INCOME_ANNUAL_ITEMS.has(e.name) ? e.amount/12 : e.amount), 0);
  const essentialMonthly = expenses.filter(e=>e.tag==='essential').reduce((s,e)=>s+e.amount,0);
  const nonEssentialMonthly = expenses.filter(e=>e.tag==='nonessential').reduce((s,e)=>s+e.amount,0);
  const totalExpenseMonthly = essentialMonthly + nonEssentialMonthly;
  const totalGoals = goals.reduce((s,e)=>s+e.amount,0);

  const el = id => document.getElementById(id);
  if(!el('scAssetsTotal')) return;

  el('scAssetsTotal').textContent = scFmt(totalAssets) + ' ريال';
  const breakdownParts = [];
  if(fastAssets > 0) breakdownParts.push(`⚡ <b>${scFmt(fastAssets)} ريال</b> سيولة سريعة`);
  if(slowAssets > 0) breakdownParts.push(`🐢 <b>${scFmt(slowAssets)} ريال</b> سيولة طويلة المدى`);
  if(fixedAssets > 0) breakdownParts.push(`🏠 <b style="color:var(--rose-dark)">${scFmt(fixedAssets)} ريال</b> أصل ثابت (لا يُحسب)`);
  el('scAssetsBreakdown').innerHTML = breakdownParts.join(' — ');
  el('scIncomeTotal').textContent = scFmt(totalIncomeMonthly) + ' ريال';
  el('scExpenseTotal').textContent = scFmt(totalExpenseMonthly) + ' ريال';
  el('scGoalsTotal').textContent = scFmt(totalGoals) + ' ريال';

  const annualIncome = totalIncomeMonthly*12;
  const annualExpenseAll = totalExpenseMonthly*12;
  const annualNetSavings = annualIncome - annualExpenseAll;
  const annualEssential = essentialMonthly*12;

  const coreBeforeInflation = annualEssential * SC_COVERAGE_YEARS;
  const safetyTarget = coreBeforeInflation + coreBeforeInflation * SC_INFLATION_RATE;
  const remaining = Math.max(0, safetyTarget - liquidAssets);

  el('scSafetyTargetVal').textContent = scFmt(safetyTarget) + ' ريال';
  el('scSafetyTargetSub').textContent = `= (${scFmt(annualEssential)} ريال مصاريف أساسية سنوية × ${SC_COVERAGE_YEARS} سنوات) + تضخم 2%`;
  el('scEssentialAnnualVal').textContent = scFmt(annualEssential) + ' ريال';
  el('scNetSavingsVal').textContent = scFmt(annualNetSavings) + ' ريال';
  el('scRemainingVal').textContent = scFmt(remaining) + ' ريال';

  const nonEssentialBase = totalIncomeMonthly > 0 ? totalIncomeMonthly : totalExpenseMonthly;
  const nonEssentialPct = nonEssentialBase > 0 ? (nonEssentialMonthly / nonEssentialBase * 100) : 0;
  el('scNonEssentialMonthlyVal').textContent = scFmt(nonEssentialMonthly) + ' ريال';
  el('scNonEssentialMonthlyLabel').textContent = totalIncomeMonthly > 0
    ? `هذا الرقم يمثل ${nonEssentialPct.toFixed(0)}% من دخلك، ويذهب للمصاريف غير الأساسية شهريًا`
    : 'من ميزانيتك يذهب للمصاريف غير الأساسية شهريًا';

  const monthlyGap = Math.max(0, totalExpenseMonthly - totalIncomeMonthly);
  el('scMonthlyGapVal').textContent = monthlyGap > 0 ? scFmt(monthlyGap) + ' ريال' : '0 ريال (لا يوجد عجز)';

  const statusBanner = el('scStatusBanner');
  const yearsValEl = el('scYearsVal');
  if(totalIncomeMonthly===0 && essentialMonthly===0){
    statusBanner.innerHTML = ''; yearsValEl.textContent = '—';
  } else if(remaining <= 0){
    yearsValEl.textContent = '0 سنة';
    statusBanner.innerHTML = `<div class="status-banner status-green">🎉 وصلتِ لنقطة الأمان المالي! أصولك الحالية تغطي احتياجاتك الأساسية لـ ${SC_COVERAGE_YEARS} سنوات وأكثر.</div>`;
  } else if(annualNetSavings === 0){
    yearsValEl.textContent = '∞ سنة';
    statusBanner.innerHTML = `<div class="status-banner status-red">🔴 دخلك يساوي مصاريفك بالضبط — ما فيه فائض سنوي يقربك من الأمان المالي. تحتاجين دخل إضافي شهري بمقدار ${scFmt(monthlyGap>0?monthlyGap:1)} ريال على الأقل لتبدأ تتحرك نحو الهدف.</div>`;
  } else {
    const years = remaining / annualNetSavings;
    const yearsText = Math.abs(years).toFixed(1) + ' سنة';
    let cls, msg;
    if(years < 0){
      yearsValEl.textContent = '-' + yearsText;
      msg = `🔴 مصاريفك تتجاوز دخلك، فأنتِ حاليًا تبتعدين عن الأمان المالي بدل الاقتراب منه. تحتاجين دخل إضافي شهري بمقدار ${scFmt(monthlyGap)} ريال على الأقل للتعادل، وأكثر من ذلك للبدء بالتقدم.`;
      cls = 'status-red';
    } else {
      yearsValEl.textContent = yearsText;
      if(years <= 5){ cls='status-yellow'; msg = `🟡 أنتِ قريبة من تحقيق أمانك المالي — تحتاجين تقريبًا ${yearsText} بمعدل ادخارك الحالي.`; }
      else { cls='status-red'; msg = `🔴 بمعدل ادخارك الحالي تحتاجين ${yearsText} تقريبًا — قد تحتاجين مصادر دخل إضافية لتسريع الوصول.`; }
    }
    statusBanner.innerHTML = `<div class="status-banner ${cls}">${msg}</div>`;
  }

  const goalsExtraYearsEl = el('scGoalsExtraYears');
  if(totalGoals === 0){
    goalsExtraYearsEl.textContent = 'أضيفي رغباتك لمعرفة التكلفة الإجمالية';
  } else if(annualNetSavings > 0){
    goalsExtraYearsEl.textContent = `بمعدل ادخارك الحالي، تحتاجين ~${(totalGoals/annualNetSavings).toFixed(1)} سنة إضافية لتحقيق هذه الرغبات (بجانب مسار الأمان المالي)`;
  } else if(annualNetSavings === 0){
    goalsExtraYearsEl.textContent = `ما فيه فائض ادخار حاليًا — تحتاجين دخل إضافي شهري ${scFmt(monthlyGap>0?monthlyGap:1)} ريال على الأقل قبل ما تقدرين تبدين بتحقيق هذه الرغبات`;
  } else {
    goalsExtraYearsEl.textContent = `مصاريفك تتجاوز دخلك حاليًا، فهذه الرغبات بعيدة أكثر لا أقرب — تحتاجين دخل إضافي شهري ${scFmt(monthlyGap)} ريال على الأقل للتعادل أولًا`;
  }

  const goalsTargetStatusEl = el('scGoalsTargetStatus');
  const targetYears = parseFloat(sc.goalsTargetYears);
  if(totalGoals > 0 && targetYears > 0){
    const requiredMonthly = totalGoals / (targetYears * 12);
    const availableMonthly = annualNetSavings / 12;
    goalsTargetStatusEl.style.display = 'block';
    if(availableMonthly >= requiredMonthly){
      goalsTargetStatusEl.className = 'status-banner status-green';
      goalsTargetStatusEl.innerHTML = `🎉 بمعدل ادخارك الحالي (${scFmt(availableMonthly)} ريال شهريًا)، تقدرين تحققين هالهدف خلال ${targetYears} سنة براحة — يتطلب بس ${scFmt(requiredMonthly)} ريال شهريًا.`;
    } else {
      const gap = requiredMonthly - availableMonthly;
      goalsTargetStatusEl.className = 'status-banner status-red';
      goalsTargetStatusEl.innerHTML = `🔴 عشان تحققين هالهدف خلال ${targetYears} سنة، تحتاجين تدخرين ${scFmt(requiredMonthly)} ريال شهريًا — وهذا أكبر من فائضك الحالي (${scFmt(availableMonthly)} ريال) بمقدار <b>${scFmt(gap)} ريال</b> شهريًا إضافية.`;
    }
  } else {
    goalsTargetStatusEl.style.display = 'none';
    goalsTargetStatusEl.innerHTML = '';
  }
}

const ED_ITEM_TAG_MAP = {};
ED_CATEGORY_GROUPS.forEach(g => g.items.forEach(it => ED_ITEM_TAG_MAP[it.name] = it.tag));

function edMonthKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function edCurrentMonthLabel(){ const d = new Date(); return 'مصاريف شهر ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function edEmptyMonthData(){ return {salary: state.sharedIncome||'', extra:'', rows:[{id:uid(), item:"", custom:"", tag:"reducible", amount:""}]}; }
function edGetMonth(){
  if(!state.expenseDiag) state.expenseDiag = {};
  const k = edMonthKey();
  if(!state.expenseDiag[k]) state.expenseDiag[k] = edEmptyMonthData();
  const m = state.expenseDiag[k];
  if(!state.sharedIncome && m.salary) state.sharedIncome = m.salary; /* migrate legacy per-month salary into the shared value */
  return m;
}
function edFmt(n){ return Number(n||0).toLocaleString('ar-SA', {maximumFractionDigits:2}); }
function edBuildItemOptions(selected){
  let html = `<option value="">اختاري بند...</option>`;
  ED_CATEGORY_GROUPS.forEach(g=>{
    html += `<optgroup label="${g.group}">`;
    g.items.forEach(it=>{ html += `<option value="${escapeHtml(it.name)}" ${selected===it.name?'selected':''}>${escapeHtml(it.name)}</option>`; });
    html += `</optgroup>`;
  });
  html += `<option value="${ED_CUSTOM_VALUE}" ${selected===ED_CUSTOM_VALUE?'selected':''}>✏️ أخرى (اكتبي يدويًا)</option>`;
  return html;
}
function edBuildTagOptions(selected){
  return Object.keys(ED_TAGS).map(k=>`<option value="${k}" ${selected===k?'selected':''}>${ED_TAGS[k].emoji} ${ED_TAGS[k].label}</option>`).join('');
}
function edActiveExpenses(m){
  return m.rows.map(r=>({
    name: r.item===ED_CUSTOM_VALUE ? ((r.custom||'').trim() || "بند بدون اسم") : r.item,
    tag: r.tag || ED_ITEM_TAG_MAP[r.item] || 'reducible',
    amount: parseFloat(r.amount) || 0,
  })).filter(e => e.name && e.amount > 0);
}

function edRenderRows(){
  const m = edGetMonth();
  const container = document.getElementById('edExpenseRows');
  if(!container) return;
  container.innerHTML = m.rows.map(r=>{
    const isCustom = r.item === ED_CUSTOM_VALUE;
    return `
    <div class="exp-row" data-id="${r.id}">
      <select class="sel-item">${edBuildItemOptions(r.item)}</select>
      ${isCustom ? `<input class="sel-custom" type="text" placeholder="اكتبي اسم البند" value="${escapeHtml(r.custom||'')}" />` : ''}
      ${isCustom ? `<select class="sel-tag">${edBuildTagOptions(r.tag)}</select>` : ''}
      <input class="inp-amt" type="number" min="0" step="0.01" placeholder="المبلغ" value="${r.amount||''}" />
      <button type="button" class="del-row" aria-label="حذف">✕</button>
    </div>`;
  }).join('');
  container.querySelectorAll('.exp-row').forEach(rowEl=>{
    const id = rowEl.getAttribute('data-id');
    const row = m.rows.find(r=>String(r.id)===id);
    const selItem = rowEl.querySelector('.sel-item');
    selItem.onchange = ()=>{
      row.item = selItem.value;
      if(row.item !== ED_CUSTOM_VALUE){ row.tag = ED_ITEM_TAG_MAP[row.item] || 'reducible'; row.custom=''; }
      saveState(); edRenderRows(); edUpdateSummary();
    };
    const selCustom = rowEl.querySelector('.sel-custom');
    if(selCustom) selCustom.oninput = ()=>{ row.custom = selCustom.value; saveState(); edUpdateSummary(); };
    const selTag = rowEl.querySelector('.sel-tag');
    if(selTag) selTag.onchange = ()=>{ row.tag = selTag.value; saveState(); edUpdateSummary(); };
    rowEl.querySelector('.inp-amt').oninput = (e)=>{ row.amount = e.target.value; saveState(); edUpdateSummary(); };
    rowEl.querySelector('.del-row').onclick = ()=>{
      m.rows = m.rows.filter(x=>x!==row);
      if(m.rows.length===0) m.rows.push({id:uid(), item:"", custom:"", tag:"reducible", amount:""});
      saveState(); edRenderRows(); edUpdateSummary();
    };
  });
}

function edUpdateSummary(){
  const m = edGetMonth();
  const el = id => document.getElementById(id);
  if(!el('edIncomeTotal')) return;
  const salary = parseFloat(state.sharedIncome)||0;
  const extra = parseFloat(m.extra)||0;
  const income = salary + extra;
  el('edIncomeTotal').textContent = edFmt(income) + ' ريال';

  const exp = edActiveExpenses(m);
  const totalExp = exp.reduce((s,e)=>s+e.amount,0);
  el('edExpenseTotal').textContent = edFmt(totalExp) + ' ريال';

  const byTag = {necessary:0, reducible:0, luxury:0, wealth:0};
  exp.forEach(e=> byTag[e.tag] += e.amount);
  const pctOfIncome = {};
  Object.keys(ED_TAGS).forEach(k=> pctOfIncome[k] = income>0 ? (byTag[k]/income*100) : 0);
  const remainingPct = income>0 ? Math.max(0, 100 - Object.values(pctOfIncome).reduce((a,b)=>a+b,0)) : 0;

  const alertsBox = el('edAlertsBox');
  alertsBox.innerHTML = '';
  if(income>0 && totalExp > income){
    alertsBox.innerHTML += `<div class="alert bad">⚠️ مصاريفك تتجاوز دخلك بمقدار ${edFmt(totalExp-income)} ريال هذا الشهر.</div>`;
  } else if(income>0 && byTag.wealth === 0){
    alertsBox.innerHTML += `<div class="alert bad">💡 ما فيه أي مبلغ مخصص للادخار أو الاستثمار هذا الشهر.</div>`;
  } else if(income>0){
    alertsBox.innerHTML += `<div class="alert ok">✅ مصاريفك ضمن حدود دخلك.</div>`;
  }

  el('edDiagBar').innerHTML = Object.keys(ED_TAGS).map(k=>
    `<span style="width:${pctOfIncome[k]}%; background:${ED_TAGS[k].color}"></span>`
  ).join('') + `<span style="width:${remainingPct}%; background:var(--line)"></span>`;

  el('edDiagLegend').innerHTML = Object.keys(ED_TAGS).map(k=>
    `<span class="li"><span class="dot" style="background:${ED_TAGS[k].color}"></span>${ED_TAGS[k].emoji} ${ED_TAGS[k].label} <b>${pctOfIncome[k].toFixed(0)}%</b></span>`
  ).join('') + `<span class="li"><span class="dot" style="background:var(--line)"></span>متبقي <b>${remainingPct.toFixed(0)}%</b></span>`;

  el('edBreakdownGrid').innerHTML = Object.keys(ED_TAGS).map(k=>
    `<div class="bd-item" style="background:${ED_TAGS[k].bg}">
      <div class="p" style="color:${ED_TAGS[k].color}">${edFmt(byTag[k])} ريال</div>
      <div class="l" style="color:${ED_TAGS[k].color}">${ED_TAGS[k].emoji} ${ED_TAGS[k].label} — ${totalExp>0?(byTag[k]/totalExp*100).toFixed(0):0}% من مصاريفك</div>
    </div>`
  ).join('');

  const grouped = {};
  exp.forEach(e=>{ grouped[e.name] = (grouped[e.name]||0) + e.amount; });
  const sortedItems = Object.entries(grouped).sort((a,b)=>b[1]-a[1]).slice(0,5);
  el('edTopItemsBox').innerHTML = sortedItems.length===0
    ? `<div class="empty">أضيفي بنود المصاريف بالأعلى عشان تظهر هنا</div>`
    : sortedItems.map(([name,amt],i)=> `<div class="top-item"><span><span class="rank">${i+1}.</span>${escapeHtml(name)}</span><span class="amt">${edFmt(amt)} ريال</span></div>`).join('');

  const reducibleCandidates = exp.filter(e => e.tag==='reducible' || e.tag==='luxury')
    .reduce((acc,e)=>{ acc[e.name]=(acc[e.name]||0)+e.amount; return acc; }, {});
  const topReducible = Object.entries(reducibleCandidates).sort((a,b)=>b[1]-a[1]).slice(0,2);
  el('edTipsBox').innerHTML = topReducible.length===0
    ? `<div class="empty">ما فيه بنود "قابلة للتقليل" أو "كمالية" حاليًا لنقترح عليها توفير</div>`
    : topReducible.map(([name,amt])=>{
        const monthly = amt*0.3, yearly = monthly*12;
        return `<div class="tip">💡 لو خفضتِ <b>${escapeHtml(name)}</b> بنسبة 30%، راح توفّرين <b>${edFmt(monthly)} ريال</b> شهريًا (${edFmt(yearly)} ريال سنويًا).</div>`;
      }).join('');

  edRenderScore(income, totalExp, byTag, pctOfIncome);
}

function edRenderScore(income, totalExp, byTag, pctOfIncome){
  let score = 50;
  const wealthPct = pctOfIncome.wealth, luxuryPct = pctOfIncome.luxury;
  const notes = [];
  if(income>0){
    score += Math.min(30, wealthPct*1.5);
    score -= Math.min(30, luxuryPct*1.0);
    if(totalExp > income){ score -= 25; notes.push('مصاريفك تتجاوز دخلك — هذا أكبر مؤثر سلبي على المؤشر.'); }
    if(byTag.wealth === 0){ score -= 15; notes.push('لا يوجد مبلغ مخصص للادخار/الاستثمار هذا الشهر.'); }
    if(wealthPct >= 15) notes.push('نسبة جيدة من دخلك تذهب لبناء الثروة 👏');
    if(luxuryPct >= 20) notes.push('نسبة الإنفاق الكمالي مرتفعة نسبيًا مقارنة بدخلك.');
  } else {
    score = 0;
    notes.push('أدخلي الدخل الشهري عشان يُحتسب المؤشر.');
  }
  score = Math.max(0, Math.min(100, Math.round(score)));
  document.getElementById('edScoreNum').textContent = score;
  document.getElementById('edScoreBarFill').style.width = score + '%';
  let label, ratingColor;
  if(income===0){ label='—'; ratingColor='#6b7a78'; }
  else if(score>=80){ label='🟢 ممتاز'; ratingColor='#2f9e6e'; }
  else if(score>=60){ label='🟡 جيد'; ratingColor='#d99a1f'; }
  else if(score>=40){ label='🟠 يحتاج تحسين'; ratingColor='#d9772f'; }
  else { label='🔴 مقلق'; ratingColor='var(--rose)'; }
  const scoreLabelEl = document.getElementById('edScoreLabel');
  scoreLabelEl.textContent = label;
  scoreLabelEl.style.color = ratingColor;
  document.getElementById('edScoreExplain').innerHTML = notes.length ? notes.map(n=>'• '+escapeHtml(n)).join('<br/>') : '';
}

  const dates = Array.from({length:7},(_,i)=>addDays(start,i));
  /* union of active (enabled) habit labels across this week's templates, in day order, de-duplicated */
  const habitSet = [];
  dates.forEach(d=>{
    const tpl = state.dayTemplates[dowOf(d)];
    tpl.habits.filter(h=>h.enabled!==false).forEach(h=>{ if(!habitSet.includes(h.label)) habitSet.push(h.label); });
  });

  const rangeLabel = `${formatDateAr(dates[0])} – ${formatDateAr(dates[6])}`;

  let rows = '';
  if(habitSet.length===0){
    rows = `<tr><td colspan="8" style="padding:20px;color:#8b9694;">ما فيه عادات مفعّلة لأيام هالأسبوع. أضيفي وفعّلي عادات من الإدارة تحت.</td></tr>`;
  }else{
    rows = habitSet.map((label,rowIdx)=>{
      let cells = dates.map(d=>{
        const tpl = state.dayTemplates[dowOf(d)];
        const active = tpl.habits.filter(h=>h.enabled!==false).map(h=>h.label);
        if(!active.includes(label)) return `<td><span class="gcheck na">–</span></td>`;
        const log = getLog(d);
        const done = !!log.habits[label];
        return `<td><button type="button" class="gcheck ${done?'done':''}" data-gdate="${d}" data-glabel="${escapeHtml(label)}">${done?'<svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg>':''}</button></td>`;
      }).join('');
      return `<tr><td class="habit-label-cell">
        <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end;">
          <span>${escapeHtml(label)}</span>
          <div style="display:flex;flex-direction:column;gap:0;">
            <button type="button" class="icon-btn" style="padding:0 4px;font-size:10px;line-height:1;" data-weekhabit-up="${escapeHtml(label)}" ${rowIdx===0?'disabled':''}>▲</button>
            <button type="button" class="icon-btn" style="padding:0 4px;font-size:10px;line-height:1;" data-weekhabit-down="${escapeHtml(label)}" ${rowIdx===habitSet.length-1?'disabled':''}>▼</button>
          </div>
        </div>
      </td>${cells}</tr>`;
    }).join('');
  }

  let pctCells = dates.map(d=>{
    const tpl = state.dayTemplates[dowOf(d)];
    const active = tpl.habits.filter(h=>h.enabled!==false);
    if(!active.length) return `<td>–</td>`;
    const log = getLog(d);
    const done = active.filter(h=>log.habits[h.label]).length;
    return `<td>${done}/${active.length}</td>`;
  }).join('');

  const reflections = dates.map(d=> getLog(d).reflection);
  const rated = reflections.filter(r=> r!=null);
  const avg = rated.length? (rated.reduce((a,b)=>a+b,0)/rated.length) : null;

  return `
  <h2 style="font-size:22px;color:var(--petrol-dark);margin-bottom:14px;">متابعة العادات الأسبوعية</h2>

  <div class="card">
    <div class="card-title"><h3>نتيجة أسبوعك</h3></div>
    <p class="muted" style="margin-bottom:12px;">تقييمك اليومي (⭐) لكل يوم بالأسبوع، عشان تشوفين شلون كانت معظم أيامك.</p>
    <div class="htable-wrap">
      <table class="htable">
        <thead>
          <tr>
            ${dates.map(d=>`<th>${DOW_NAMES[dowOf(d)].replace('ال','')}<span class="d">${parseISO(d).getDate()}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          <tr>
            ${dates.map((d,i)=>`<td style="font-size:14px;">${reflections[i]? '⭐'.repeat(reflections[i]) : '<span class="gcheck na">–</span>'}</td>`).join('')}
          </tr>
        </tbody>
      </table>
    </div>
    ${avg!=null? `<p class="muted" style="margin-top:10px;">متوسط تقييمك هالأسبوع: <b style="color:var(--petrol-dark);">${avg.toFixed(1)} ⭐</b> (من ${rated.length} يوم مقيّم)</p>` : `<p class="muted" style="margin-top:10px;">ما فيه تقييمات هالأسبوع بعد. قيّمي يومك من صفحة "اليوم" آخر كل يوم.</p>`}
  </div>

  <div class="card">
    <div class="week-nav">
      <button type="button" class="arrow" id="prevWeek" style="width:32px;height:32px;border-radius:8px;background:var(--parchment);border:1px solid var(--line);">‹</button>
      <span class="lbl">${rangeLabel}${startOfWeek(todayStr())===start? ' (الأسبوع الحالي)':''}</span>
      <button type="button" class="arrow" id="nextWeek" style="width:32px;height:32px;border-radius:8px;background:var(--parchment);border:1px solid var(--line);">›</button>
    </div>
    <div class="htable-wrap">
      <table class="htable">
        <thead>
          <tr>
            <th style="text-align:right;">العادة</th>
            ${dates.map(d=>`<th>${DOW_NAMES[dowOf(d)].replace('ال','')}<span class="d">${parseISO(d).getDate()}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows}
          ${habitSet.length? `<tr class="pct-row"><td class="habit-label-cell">الإنجاز</td>${pctCells}</tr>`:''}
        </tbody>
      </table>
    </div>
  </div>
  <p class="muted" style="padding:0 4px;">العلامة "–" تعني إن هالعادة مو ضمن روتين ذاك اليوم. الإدارة الكاملة تحت 👇</p>

  <details class="card" style="margin-top:16px;">
    <summary><h3>✏️ تعديل العادات <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <p class="muted" style="margin-bottom:10px;">اختاري اليوم، وفعّلي أو عطّلي أو عدّلي أو احذفي أو رتّبي أي عادة منه.</p>
      <div class="chip-row" style="margin-bottom:14px;" id="habitDowPicker">
        ${DOW_NAMES.map((n,i)=>`<button type="button" class="chip ${(_habitPickDow===i)?'selected':''}" data-pick-dow="${i}">${n}</button>`).join('')}
      </div>
      ${state.dayTemplates[_habitPickDow].habits.length===0? `<p class="muted" style="margin-bottom:10px;">ما فيه عادات ليوم ${DOW_NAMES[_habitPickDow]} بعد.</p>`:''}
      ${state.dayTemplates[_habitPickDow].habits.map((h,idx)=>{
        const isOn = h.enabled!==false;
        const last = state.dayTemplates[_habitPickDow].habits.length-1;
        return `<div style="${isOn?'':'opacity:.45;'}padding:8px 0;border-bottom:1px dashed var(--line);">
          <div class="habit-item" style="border:none;padding:0 0 6px;">
            <div style="display:flex;flex-direction:column;gap:1px;">
              <button type="button" class="icon-btn" style="padding:1px 6px;font-size:12px;" data-habit-up="${idx}" ${idx===0?'disabled':''}>▲</button>
              <button type="button" class="icon-btn" style="padding:1px 6px;font-size:12px;" data-habit-down="${idx}" ${idx===last?'disabled':''}>▼</button>
            </div>
            <input type="text" data-mgmt-habit-i="${idx}" value="${escapeHtml(h.label)}" style="flex:1;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:${isOn?'var(--parchment)':'#eee'};font-size:13.5px;"/>
            <button type="button" class="btn ${isOn?'ghost':''} sm" data-toggle-active="${idx}" data-toggle-dow="${_habitPickDow}">${isOn?'تعطيل':'تفعيل'}</button>
            <button type="button" class="icon-btn" data-mgmt-del="${idx}">✕</button>
          </div>
          <input type="text" data-mgmt-habit-link="${idx}" value="${escapeHtml(h.link||'')}" placeholder="🔗 رابط مساعد (اختياري)" style="width:100%;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--parchment);font-size:12px;direction:ltr;text-align:left;"/>
        </div>`;
      }).join('')}
      <p class="muted" style="margin-top:8px;">💡 ما عندي بحث تلقائي بالنسخة المستضافة، بس اطلبي مني رابط فيديو يساعدك بعادة معينة بالمحادثة، وألصقيه بخانة الرابط جنبها.</p>
    </div>
  </details>

  <details class="card" style="margin-top:12px;">
    <summary><h3>➕ إضافة عادة جديدة <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <p class="muted" style="margin-bottom:6px;">لأي أيام تضيفين العادة الجديدة؟ (تقدرين تختارين أكثر من يوم)</p>
      <div class="chip-row" style="margin-bottom:10px;" id="habitAddDowPicker">
        ${DOW_NAMES.map((n,i)=>`<button type="button" class="chip ${_habitAddDows.includes(i)?'selected':''}" data-add-dow="${i}">${n}</button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input type="text" id="pageHabitInput" placeholder="اسم عادة جديدة…" style="flex:1;"/>
        <button class="btn sm" id="pageHabitAdd">إضافة</button>
      </div>
      <div class="chip-row" style="margin-top:10px;">
        ${PRESET_HABITS.map(p=>`<button type="button" class="chip" data-page-preset="${escapeHtml(p.label)}">${p.icon} ${p.label}</button>`).join('')}
      </div>
    </div>
  </details>
  `;
}

        <p class="muted" style="margin-top:6px;">ما عندي بحث تلقائي بالنسخة المستضافة، بس اطلبي مني رابط فيديو بالمحادثة وأنا أدورلك عليه وأعطيك إياه جاهز تلصقينه هنا.</p>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn btn-block" id="tdSave">حفظ المهمة</button>

function attachTaskDraftEvents(){
  document.querySelectorAll('[data-pri]').forEach(b=> b.onclick=()=>{ syncDraft(); taskDraft.priority=b.dataset.pri; render(); });
  document.querySelectorAll('[data-per]').forEach(b=> b.onclick=()=>{ syncDraft(); taskDraft.period = (taskDraft.period===b.dataset.per? null : b.dataset.per); render(); });
  document.getElementById('tdSave').onclick = ()=>{
    syncDraft();
    if(!taskDraft.title.trim()){ document.getElementById('tdTitle').focus(); return; }
    if(taskDraft.id){
      const t = state.tasks.find(x=>x.id===taskDraft.id);
      if(t){
        t.title = taskDraft.title.trim();
        t.goalId = taskDraft.goalId||null;
        t.category = taskDraft.category||null;
        t.priority = taskDraft.priority;
        t.period = taskDraft.period||null;
        t.due = taskDraft.due||null;
        t.link = taskDraft.link||null;
      }
    }else{
      state.tasks.push({
        id:uid(), title:taskDraft.title.trim(), goalId:taskDraft.goalId||null, category:taskDraft.category||null,
        priority:taskDraft.priority, period:taskDraft.period||null, due:taskDraft.due||null, link:taskDraft.link||null,
        done:false, createdAt:todayStr()
      });
    }
    saveState();
    taskDraft = null;
    render();
  };
  document.getElementById('tdCancel').onclick = ()=>{ taskDraft=null; render(); };
}
function syncDraft(){
  taskDraft.title = document.getElementById('tdTitle').value;
  taskDraft.goalId = document.getElementById('tdGoal').value;
  taskDraft.category = document.getElementById('tdCat').value;
  taskDraft.due = document.getElementById('tdDue').value;
  taskDraft.link = document.getElementById('tdLink').value;
}

/* ============ global events ============ */
function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick=()=>{ view=b.dataset.nav; render(); });

  const sizeDown = document.getElementById('sizeDown');
  if(sizeDown) sizeDown.onclick = ()=> changeTextScale(-0.1);
  const sizeUp = document.getElementById('sizeUp');
  if(sizeUp) sizeUp.onclick = ()=> changeTextScale(0.1);
  const openSettings = document.getElementById('openSettings');
  if(openSettings) openSettings.onclick = ()=>{ settingsOpen=true; syncExportCode=''; syncMsg=null; render(); };

  /* date navigator */
  const prevDay = document.getElementById('prevDay');
  if(prevDay) prevDay.onclick = ()=>{ selectedDate = addDays(selectedDate,-1); render(); };
  const nextDay = document.getElementById('nextDay');
  if(nextDay) nextDay.onclick = ()=>{ selectedDate = addDays(selectedDate,1); render(); };
  const jumpToday = document.getElementById('jumpToday');
  if(jumpToday) jumpToday.onclick = ()=>{ selectedDate = todayStr(); render(); };
  const datePick = document.getElementById('datePick');
  const dateMid = document.getElementById('dateMidClick');
  if(datePick){
    datePick.onchange = ()=>{ if(datePick.value){ selectedDate = datePick.value; render(); } };
    if(dateMid) dateMid.onclick = ()=>{ datePick.showPicker ? datePick.showPicker() : datePick.focus(); };
  }

  document.querySelectorAll('[data-edit-template]').forEach(b=> b.onclick=()=>{

/* parses lines like: "نص المهمة | تصنيف | أولوية | فترة | موعد"
   pasted from a chat reply, with no network call involved. */
function guessCategory(raw){
  const s = (raw||'').trim();
  if(/عمل|بزنس|business/i.test(s)) return 'business';
  if(/مشروع|project/i.test(s)) return 'project';
  if(/عائل|family/i.test(s)) return 'family';
  if(/شخص|personal/i.test(s)) return 'personal';
  return 'other';
}
function guessPriority(raw){
  const s = (raw||'').trim();
  if(/عالي|high/i.test(s)) return 'عالية';
  if(/منخفض|low/i.test(s)) return 'منخفضة';
  return 'متوسطة';
}
function guessPeriod(raw){
  const s = (raw||'').trim();
  if(/صباح/i.test(s)) return 'صباح';
  if(/ظهر/i.test(s)) return 'ظهر';
  if(/مساء/i.test(s)) return 'مساء';
  return null;
}
function guessDue(raw){
  const s = (raw||'').trim();
  if(!s || s==='-') return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if(/اليوم|today/i.test(s)) return todayStr();
  if(/بكرة|غدا|غداً|tomorrow/i.test(s)) return addDays(todayStr(),1);
  if(/أسبوع|اسبوع|week/i.test(s)) return addDays(todayStr(),6);
  return null;
}
/* ============ voice / smart quick-add ============ */
function vqParseDateTime(text){
  const s = text;
  let due = null, period = null;
  if(/بكرة|باجر|غدا(ً)?/.test(s)) due = addDays(todayStr(),1);
  else if(/بعد يومين/.test(s)) due = addDays(todayStr(),2);
  else if(/بعد\s*3\s*أيام|بعد ثلاث أيام/.test(s)) due = addDays(todayStr(),3);
  else if(/الأسبوع (الجاي|القادم)|بعد أسبوع/.test(s)) due = addDays(todayStr(),7);
  else if(/اليوم/.test(s)) due = todayStr();
  else {
    const dayIdx = DOW_NAMES.findIndex(n => s.includes(n));
    if(dayIdx>-1){
      const cur = parseISO(todayStr()).getDay();
      let delta = (dayIdx - cur + 7) % 7;
      if(delta===0) delta = 7;
      due = addDays(todayStr(), delta);
    }
  }
  if(/صباح/.test(s)) period = 'صباح';
  else if(/ظهر/.test(s)) period = 'ظهر';
  else if(/مساء|بالليل|الليل/.test(s)) period = 'مساء';
  else {
    const m = s.match(/الساعة\s*(\d{1,2})/);
    if(m){
      const h = parseInt(m[1],10);
      if(h>=1 && h<=6) period = 'مساء';
      else if(h>=7 && h<=11) period = 'صباح';
      else period = 'ظهر';
    }
  }
  return {due, period};
}
function vqParseCategory(text){
  if(/مالي|فلوس|فاتورة|بنك|ادخار|مصروف|قرض|راتب/.test(text)) return 'business';
  if(/مشروع/.test(text)) return 'project';
  if(/عائل|أطفال|بيت/.test(text)) return 'family';
  if(/شخصي/.test(text)) return 'personal';
  return null;
}
function vqParsePriority(text){
  if(/مهم جدا|ضروري|عاجل/.test(text)) return 'عالية';
  if(/لو قدرت|مو مستعجل/.test(text)) return 'منخفضة';
  return 'متوسطة';
}
function vqSplitTasks(raw){
  let parts = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){
    const bySentence = raw.split(/[.؛]+/).map(s=>s.trim()).filter(Boolean);
    if(bySentence.length>1) parts = bySentence;
  }
  if(parts.length<=1){
    const byAnd = raw.split(/\s+و\s+/).map(s=>s.trim()).filter(s=>s.length>3);
    if(byAnd.length>1) parts = byAnd;
  }
  if(parts.length===0) parts = [raw.trim()];
  return parts;
}
function vqAnalyze(raw){
  return vqSplitTasks(raw).filter(Boolean).map(p=>{
    const {due, period} = vqParseDateTime(p);
    return {id:uid(), text:p, category: vqParseCategory(p), priority: vqParsePriority(p), period, due, include:true};
  });
}
function startVoiceRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    voiceError = 'التسجيل المباشر ما يدعمه متصفحك — اضغطي أيقونة المايك 🎙️ اللي بلوحة مفاتيح جوالك جوا خانة الكتابة وأملي فيها، وبعدين اضغطي "حلّليها لمهام".';
    render();
    const ta = document.getElementById('voiceDraftInput');
    if(ta) ta.focus();
    return;
  }
  voiceRecognizer = new SR();
  voiceRecognizer.lang = 'ar-SA';
  voiceRecognizer.interimResults = false;
  voiceRecognizer.maxAlternatives = 1;
  voiceRecognizer.onstart = ()=>{ voiceListening = true; voiceError = null; render(); };
  voiceRecognizer.onresult = (e)=>{
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join(' ');
    voiceDraftText = (voiceDraftText? voiceDraftText+' ' : '') + transcript;
  };
  voiceRecognizer.onerror = ()=>{ voiceError = 'ما قدرت أسمع بوضوح، جربي مرة ثانية أو اكتبي.'; voiceListening = false; render(); };
  voiceRecognizer.onend = ()=>{ voiceListening = false; render(); };
  try{ voiceRecognizer.start(); }catch(e){ voiceError = 'صار خطأ بالتسجيل.'; render(); }
}

function importPlanFromText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  lines.forEach(line=>{
    if(!line.includes('|')){
      /* plain line with no separators: treat as a bare task title */
      items.push({sourceId:uid(), text:line, category:null, priority:'متوسطة', period:null, due:null, note:'', include:true});
      return;
    }
    const parts = line.split('|').map(p=>p.trim());
    const [textPart, catPart, priPart, perPart, duePart] = parts;
    if(!textPart) return;
    items.push({
      sourceId: uid(),
      text: textPart.replace(/^[-•\d.\)]+\s*/,''),
      category: catPart? guessCategory(catPart) : null,
      priority: priPart? guessPriority(priPart) : 'متوسطة',
      period: perPart? guessPeriod(perPart) : null,
      due: duePart? guessDue(duePart) : null,
      note: '',
      include: true,
    });
  });
  return items;
}
async function runImportPaste(){
  const ta = document.getElementById('importPaste');
  const text = (ta? ta.value : importPasteText).trim();
  importError = null;
  if(!text){ importError = 'الصقي النص أول.'; render(); return; }
  const items = importPlanFromText(text);
  if(items.length===0){ importError = 'ما لقيت مهام بالنص، تأكدي من التنسيق.'; render(); return; }
  aiPlan = items;
  importPasteText = '';
  render();
}

/* ============ AI suggestion via Claude API ============ */
async function runAiSuggestion(){
  aiLoading = true; aiError = null; render();
  try{
    const goalsText = state.goals.map(g=>`- ${g.title} (${CAT_MAP[g.cat]?.label||g.cat}): ${g.answers.filter(Boolean).join(' | ')}`).join('\n') || 'لا توجد أهداف مسجلة بعد';
    const tasksText = state.tasks.filter(t=>!t.done).map(t=>`- ${t.title}`).join('\n') || 'لا توجد مهام حالياً';
    const inboxText = state.inbox.map((it,i)=>`${i}: ${it.text}${it.category? ' ('+(TCAT_MAP[it.category]?.label||it.category)+')':''}`).join('\n') || 'لا توجد مهام بصندوق المهام حالياً';
    const log = getLog(todayStr());

    const prompt = `أنت مساعدة تنظيم شخصي. هذه أهداف المستخدمة السنوية:
${goalsText}

هذه مهامها المجدولة حالياً غير المنجزة (لا تكرري شي يشبهها):
${tasksText}

هذه مهام بصندوقها العشوائي (لسا ما انضافت لجدولها):
${inboxText}

مزاجها اليوم: ${log.mood.join('، ')||'غير محددة'}

اختاري أفضل مهمة واحدة تقرّبها من أهدافها اليوم: إما مهمة جديدة تخدم الهدف الأقل تغطية، أو -إذا فيه شي بصندوقها يخدم هدف واضح- اختاري نفس نصها بالضبط من الصندوق.
أجيبي فقط بكائن JSON صالح وبدون أي نص أو markdown حوله، بهذا الشكل بالضبط:
{"text":"جملة المهمة بالعربية العامية الخليجية الخفيفة، أقل من 18 كلمة، بدون علامات تنصيص","sourceInboxIndex": الرقم من الصندوق أو null إذا مهمة جديدة}`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        messages:[{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    if(!response.ok || data.type==='error'){
      throw new Error(data?.error?.message || `فشل الاتصال (${response.status})`);
    }
    let raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const firstBrace = raw.indexOf('{');
    const lastBrace = raw.lastIndexOf('}');
    if(firstBrace>-1 && lastBrace>-1) raw = raw.slice(firstBrace, lastBrace+1);
    if(!raw) throw new Error('ما رجع لي أي مقترح.');
    const parsed = JSON.parse(raw);
    const text = (parsed.text||'').replace(/^["“]|["”]$/g,'').trim();
    if(!text) throw new Error('ما رجع لي أي مقترح.');
    let sourceId = null;
    if(parsed.sourceInboxIndex!==null && parsed.sourceInboxIndex!==undefined){
      const it = state.inbox[parsed.sourceInboxIndex];
      if(it) sourceId = it.id;
    }
    aiSuggestion = { text, sourceId };
  }catch(e){
    console.error('ai suggestion error', e);
    aiError = 'صار خطأ: ' + friendlyErr(e);
    aiSuggestion = null;
  }
  aiLoading = false;
  render();
}

async function runInboxOrganizer(){
  aiPlanLoading = true; aiPlanError = null; render();
  try{
    const items = state.inbox;
    const itemsText = items.map((it,i)=>`${i}: ${it.text}`).join('\n');
    const goalsText = state.goals.map(g=>`- ${g.title} (${CAT_MAP[g.cat]?.label||g.cat})`).join('\n') || 'لا توجد أهداف مسجلة';
    const busyText = state.tasks.filter(t=>!t.done).map(t=>`- ${t.title} (${t.priority}${t.due? '، موعدها '+t.due:''})`).join('\n') || 'لا توجد مهام أخرى حالياً';
    const catList = TCATS.map(c=>`"${c.id}" (${c.label})`).join('، ');

    const prompt = `أنت مساعدة تنظيم شخصي محترفة. اليوم هو ${todayStr()}.
هذه أهداف المستخدمة السنوية:
${goalsText}

هذه مهامها الأخرى غير المنجزة حالياً (لا تكرري أي شي يشبهها):
${busyText}

هذه قائمة مهام عشوائية غير مرتبة كتبتها المستخدمة بدون أي ترتيب، وممكن بعضها ملزق مع بعض من نفس الفكرة:
${itemsText}

لكل عنصر بالقائمة أعلاه حددي:
- category: وحدة من هذي القيم بالضبط: ${catList}
- priority: "عالية" أو "متوسطة" أو "منخفضة"
- period: "صباح" أو "ظهر" أو "مساء" أو null (أنسب وقت لتنفيذها)
- due: "today" أو "tomorrow" أو "week" أو null (متى يفضل تنجزها)
- note: سبب مختصر جداً بالعربية العامية الخليجية الخفيفة، أقل من 10 كلمات، بدون علامات تنصيص، اربطيه بهدفها إذا فيه ارتباط واضح

أجيبي فقط بمصفوفة JSON صالحة (valid JSON array) وبدون أي نص أو شرح أو علامات markdown قبلها أو بعدها، بهذا الشكل بالضبط:
[{"index":0,"category":"business","priority":"عالية","period":"صباح","due":"today","note":"..."}, ...]
لازم تشمل كل عناصر القائمة بدون استثناء، وبنفس ترقيم index المعطى.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"text/plain"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:2000,
        messages:[{role:"user", content: prompt}]
      })
    });
    const data = await response.json();
    if(!response.ok || data.type==='error'){
      throw new Error(data?.error?.message || `فشل الاتصال (${response.status})`);
    }
    let raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    raw = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const firstBracket = raw.indexOf('[');
    const lastBracket = raw.lastIndexOf(']');
    if(firstBracket>-1 && lastBracket>-1) raw = raw.slice(firstBracket, lastBracket+1);
    if(!raw) throw new Error('ما رجع لي أي نتيجة، جربي مرة ثانية.');
    const parsed = JSON.parse(raw);

    const dueMap = { today: todayStr(), tomorrow: addDays(todayStr(),1), week: addDays(todayStr(),6) };
    const validCat = TCATS.map(c=>c.id);
    aiPlan = parsed.map(p=>{
      const src = items[p.index];
      if(!src) return null;
      const cat = validCat.includes(p.category)? p.category : null;
      if(cat) src.category = cat; /* persist classification back onto the inbox item */
      return {
        sourceId: src.id,
        text: src.text,
        category: cat,
        priority: ['عالية','متوسطة','منخفضة'].includes(p.priority)? p.priority : 'متوسطة',
        period: ['صباح','ظهر','مساء'].includes(p.period)? p.period : null,
        due: dueMap[p.due] || null,
        note: p.note || '',
        include: true,
      };
    }).filter(Boolean);

    if(aiPlan.length===0){ aiPlanError = 'ما قدرت أنظم القائمة هالمرة، جربي مرة ثانية.'; aiPlan=null; }
    else{ saveState(); }
  }catch(e){
    console.error('inbox organizer error', e);
    aiPlanError = 'صار خطأ أثناء الترتيب: ' + friendlyErr(e);
    aiPlan = null;
  }
  aiPlanLoading = false;
  render();
}

/* ============ utils ============ */
function friendlyErr(e){
  const msg = e && e.message ? e.message : '';
  if(!msg) return 'حاولي مرة ثانية بعد شوي.';
  if(/failed to fetch|networkerror|load failed/i.test(msg)){
    return 'ما قدرت أوصل للخدمة (مشكلة اتصال أو حجب من المتصفح). تأكدي من الإنترنت وجربي تحدثين الصفحة.';
  }
  return msg;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ offline support ============ */
/* Registers a tiny service worker (built inline, no separate file needed) that
   caches this page so it keeps opening even with no internet connection. */
function registerOfflineSupport(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const swCode = `
      const CACHE = 'daftari-v1';
      self.addEventListener('install', e => {
        e.waitUntil(caches.open(CACHE).then(c => c.add(self.registration.scope)));
        self.skipWaiting();
      });
      self.addEventListener('activate', e => { self.clients.claim(); });
      self.addEventListener('fetch', e => {
        if(e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(cached => {
            const fetchPromise = fetch(e.request).then(res => {
              if(res && res.ok){ caches.open(CACHE).then(c => c.put(e.request, res.clone())); }
              return res;
            }).catch(() => cached);
            return cached || fetchPromise;
          })
        );
      });
    `;
    const blobUrl = URL.createObjectURL(new Blob([swCode], {type:'application/javascript'}));
    navigator.serviceWorker.register(blobUrl).catch(()=>{ /* offline caching unavailable, app still works online */ });
  }catch(e){ /* ignore — offline caching is a bonus, not required */ }
}
registerOfflineSupport();

/* ============ text size control (A-/A+) ============ */
function applyTextScale(){
  document.documentElement.style.zoom = textScale;
}
function loadTextScale(){
  try{
    const v = parseFloat(localStorage.getItem('plannerTextScale'));
    if(!isNaN(v) && v>0) textScale = v;
  }catch(e){}
  applyTextScale();
}
function changeTextScale(delta){
  textScale = Math.min(1.4, Math.max(0.85, +(textScale+delta).toFixed(2)));
  applyTextScale();
  try{ localStorage.setItem('plannerTextScale', textScale); }catch(e){}
}
loadTextScale();

loadState();
