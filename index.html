function attachFinanceEvents(){
  plRenderRows(); plUpdateStats();
  const plAddRowBtn = document.getElementById('plAddRowBtn');
  if(plAddRowBtn) plAddRowBtn.onclick = ()=>{
    const newRow = {id:uid(), type:'income', desc:'', category:PL_INCOME_CATS[0], amount:'', date:todayStr()};
    state.projectLedger.push(newRow);
    saveState(); plRenderRows();
  };
  const fsSave = document.getElementById('fsSave');
  if(fsSave) fsSave.onclick = ()=>{
    const title = document.getElementById('fsTitle').value.trim() || `الهدف المالي ${new Date().getFullYear()}`;
    const target = parseFloat(document.getElementById('fsTarget').value);
    const current = parseFloat(document.getElementById('fsCurrent').value)||0;
    const deadline = document.getElementById('fsDeadline').value || null;
    if(!target || target<=0){ document.getElementById('fsTarget').focus(); return; }
    const existing = state.financialGoal;
    const keepStages = existing && existing.configured && existing.targetAmount===target;
    state.financialGoal = {
      title, targetAmount: target, currentAmount: current, deadline, configured:true,
      stages: keepStages? existing.stages : generateFinanceStages(target, current),
      paths: existing? (existing.paths||[]) : [],
      customPaths: existing? (existing.customPaths||[]) : [],
      pathProgress: existing? (existing.pathProgress||{}) : {},
      pathSetup: existing? (existing.pathSetup||{}) : {},
    };
    financeSetupDraft = null;
    saveState(); render();
  };
  const fsCancel = document.getElementById('fsCancel');
  if(fsCancel) fsCancel.onclick = ()=>{ financeSetupDraft = null; render(); };

  const methodAdd = document.getElementById('methodAdd');
  if(methodAdd) methodAdd.onclick = ()=>{
    const sel = document.getElementById('methodSelect');
    const val = sel.value;
    if(!val) return;
    const p = FINANCE_PATHS.find(x=>x.id===val);
    pathQualifyDraft = { methodId:val, skillLevel:'', timeline:'', successCriteria:'', tools: Object.fromEntries((p.tools||[]).map(t=>[t,false])) };
    render();
  };
  document.querySelectorAll('[data-path-remove]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    const p = FINANCE_PATHS.find(x=>x.id===b.dataset.pathRemove);
    if(!confirm(`تحذفين طريقة "${p? p.label : ''}"؟`)) return;
    fg.paths = fg.paths.filter(id=>id!==b.dataset.pathRemove);
    if(fg.pathProgress) delete fg.pathProgress[b.dataset.pathRemove];
    if(fg.pathOverrides) delete fg.pathOverrides[b.dataset.pathRemove];
    if(pendingTipAdd && pendingTipAdd.methodId===b.dataset.pathRemove) pendingTipAdd=null;
    saveState(); render();
  });
  const customPathAdd = document.getElementById('customPathAdd');
  if(customPathAdd) customPathAdd.onclick = ()=>{
    const fg = state.financialGoal;
    if(!fg.customPaths) fg.customPaths = [];
    const inp = document.getElementById('customPathInput');
    const val = inp.value.trim();
    if(!val) return;
    fg.customPaths.push({id:uid(), label:val, icon:'✏️', target:'', earned:'', successCriteria:'', note:'', steps:[]});
    inp.value = '';
    saveState(); render();
  };
  document.querySelectorAll('[data-custompath-del]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    const cp = fg.customPaths.find(x=>x.id===b.dataset.custompathDel);
    if(!confirm(`تحذفين طريقة "${cp? cp.label : ''}"؟ خطواتها وأرقامها بتنمسح معها.`)) return;
    fg.customPaths = fg.customPaths.filter(x=>x.id!==b.dataset.custompathDel);
    saveState(); render();
  });

  /* ---- her own income paths: same shape as the built-in ones ---- */
  const cpOf = id => (state.financialGoal.customPaths||[]).find(x=>x.id===id);
  const cpStepOf = (pair)=>{
    const [cid, sid] = pair.split('|');
    const cp = cpOf(cid);
    return {cp, step: cp && (cp.steps||[]).find(s=>s.id===sid)};
  };
  const cpField = (attr, prop, isNumber)=>{
    document.querySelectorAll('['+attr+']').forEach(inp=>{
      inp.onchange = ()=>{
        const cp = cpOf(inp.getAttribute(attr));
        if(!cp) return;
        const v = inp.value.trim();
        if(prop==='label' && !v) return; /* a path with no name can't be found again */
        cp[prop] = isNumber? (v===''? '' : v) : v;
        saveState(); render();
      };
    });
  };
  cpField('data-cp-label','label');
  cpField('data-cp-icon','icon');
  cpField('data-cp-success','successCriteria');
  cpField('data-cp-note','note');
  cpField('data-cp-target','target', true);
  cpField('data-cp-earned','earned', true);

  document.querySelectorAll('[data-cp-step-toggle]').forEach(b=> b.onclick=()=>{
    const {step} = cpStepOf(b.dataset.cpStepToggle);
    if(step){ step.done = !step.done; saveState(); render(); }
  });
  document.querySelectorAll('[data-cp-step-done]').forEach(b=> b.onclick=()=>{
    const {step} = cpStepOf(b.dataset.cpStepDone);
    if(step){ step.done = true; saveState(); popStamp('خطوة خلصت','ماشاءالله'); render(); }
  });
  document.querySelectorAll('[data-cp-step-text]').forEach(inp=>{
    inp.onchange = ()=>{
      const {step} = cpStepOf(inp.dataset.cpStepText);
      if(step){ step.text = inp.value.trim() || step.text; saveState(); render(); }
    };
  });
  document.querySelectorAll('[data-cp-step-del]').forEach(b=> b.onclick=()=>{
    const [cid, sid] = b.dataset.cpStepDel.split('|');
    const cp = cpOf(cid);
    if(!cp) return;
    cp.steps = (cp.steps||[]).filter(s=>s.id!==sid);
    saveState(); render();
  });
  document.querySelectorAll('[data-cp-step-add]').forEach(b=> b.onclick=()=>{
    const cp = cpOf(b.dataset.cpStepAdd);
    const inp = document.querySelector('[data-cp-step-new="'+b.dataset.cpStepAdd+'"]');
    if(!cp || !inp) return;
    const val = inp.value.trim();
    if(!val) return;
    if(!cp.steps) cp.steps = [];
    cp.steps.push({id:uid(), text:val, done:false});
    saveState(); render();
  });
  /* mirrors the built-in paths' "add to my tasks" — lands in the same task list,
     tagged business, so it flows through the day views like any other task */
  document.querySelectorAll('[data-cp-step-task]').forEach(b=> b.onclick=()=>{
    const {cp, step} = cpStepOf(b.dataset.cpStepTask);
    if(!cp || !step) return;
    state.tasks.push({
      id:uid(), title:step.text, goalId:null, category:'business', priority:'متوسطة',
      period:null, due:todayStr(), link:null, done:false, createdAt:todayStr()
    });
    saveState(); popStamp('انضافت لمهامك','بالتوفيق'); render();
  });

  document.querySelectorAll('[data-tip-skip]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    if(!fg.pathProgress) fg.pathProgress = {};
    fg.pathProgress[b.dataset.tipSkip] = (fg.pathProgress[b.dataset.tipSkip]||0)+1;
    saveState(); render();
  });
  document.querySelectorAll('[data-tip-edit]').forEach(ta=>{
    ta.onchange = ()=>{
      const [pid, idxStr] = ta.dataset.tipEdit.split('|');
      const idx = parseInt(idxStr,10);
      const fg = state.financialGoal;
      if(!fg.pathOverrides) fg.pathOverrides = {};
      if(!fg.pathOverrides[pid]) fg.pathOverrides[pid] = {};
      const val = ta.value.trim();
      if(val) fg.pathOverrides[pid][idx] = val; else delete fg.pathOverrides[pid][idx];
      saveState();
    };
  });
  document.querySelectorAll('[data-tip-accept]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    const seq = getEffectiveSequence(fg, b.dataset.tipAccept);
    const idx = (fg.pathProgress&&fg.pathProgress[b.dataset.tipAccept])||0;
    const override = fg.pathOverrides && fg.pathOverrides[b.dataset.tipAccept] && fg.pathOverrides[b.dataset.tipAccept][idx];
    pendingTipAdd = { methodId: b.dataset.tipAccept, tipText: override!=null? override : seq[idx], due:'', period:null };
    render();
  });
  const cancelTipAdd = document.getElementById('cancelTipAdd');
  if(cancelTipAdd) cancelTipAdd.onclick = ()=>{ pendingTipAdd = null; render(); };
  document.querySelectorAll('[data-tip-due]').forEach(b=> b.onclick=()=>{
    if(!pendingTipAdd) return;
    pendingTipAdd.due = addDays(todayStr(), parseInt(b.dataset.tipDue,10));
    render();
  });
  document.querySelectorAll('[data-tip-period]').forEach(b=> b.onclick=()=>{
    if(!pendingTipAdd) return;
    pendingTipAdd.period = (pendingTipAdd.period===b.dataset.tipPeriod? null : b.dataset.tipPeriod);
    render();
  });
  const confirmTipAdd = document.getElementById('confirmTipAdd');
  if(confirmTipAdd) confirmTipAdd.onclick = ()=>{
    if(!pendingTipAdd) return;
    const fg = state.financialGoal;
    const due = pendingTipAdd.due || todayStr();
    state.tasks.push({id:uid(), title:pendingTipAdd.tipText, goalId:null, category:'business', priority:'متوسطة', period:pendingTipAdd.period||null, due, link:null, done:false, createdAt:todayStr()});
    if(!fg.pathProgress) fg.pathProgress = {};
    fg.pathProgress[pendingTipAdd.methodId] = (fg.pathProgress[pendingTipAdd.methodId]||0)+1;
    pendingTipAdd = null;
    saveState(); render();
  };

  const financeEdit = document.getElementById('financeEdit');
  if(financeEdit) financeEdit.onclick = ()=>{
    const fg = state.financialGoal;
    financeSetupDraft = {title:fg.title, targetAmount:fg.targetAmount, currentAmount:fg.currentAmount, deadline:fg.deadline||''};
    render();
  };
  const fgAddAmountBtn = document.getElementById('fgAddAmountBtn');
  if(fgAddAmountBtn) fgAddAmountBtn.onclick = ()=>{
    const inp = document.getElementById('fgAddAmountInput');
    const amt = parseFloat(inp.value);
    if(!amt || amt<=0) return;
    const fg = state.financialGoal;
    fg.currentAmount = (fg.currentAmount||0) + amt;
    fg.stages.forEach(s=>{ if(!s.done && fg.currentAmount >= s.targetAmount) s.done = true; });
    /* opt-in, because the money may already be sitting in the savings balance she
       recorded on the safety page — auto-adding it there would double-count */
    const alsoAsset = document.getElementById('fgAlsoAsset');
    if(alsoAsset && alsoAsset.checked) scAddToSavingsAsset(amt);
    saveState(); popStamp('زادت مدخراتك!','ماشاءالله عليك'); render();
  };

  document.querySelectorAll('[data-stagetask-toggle]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskToggle.split('|');
    const fg = state.financialGoal;
    const stage = fg.stages.find(s=>s.id===stageId);
    const t = stage.tasks.find(x=>x.id===taskId);
    if(t) t.done = !t.done;
    saveState(); render();
  });
  document.querySelectorAll('[data-stagetask-edit]').forEach(inp=>{
    inp.onchange = ()=>{
      const [stageId, taskId] = inp.dataset.stagetaskEdit.split('|');
      const stage = state.financialGoal.stages.find(s=>s.id===stageId);
      const t = stage.tasks.find(x=>x.id===taskId);
      if(t){ t.text = inp.value.trim() || t.text; saveState(); }
    };
  });
  document.querySelectorAll('[data-stagetask-addtotasks]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskAddtotasks.split('|');
    pendingStageTaskAdd = { stageId, taskId, due:'', period:null };
    render();
  });
  const stageTaskAddCancel = document.getElementById('stageTaskAddCancel');
  if(stageTaskAddCancel) stageTaskAddCancel.onclick = ()=>{ pendingStageTaskAdd = null; render(); };
  document.querySelectorAll('[data-stagetask-due]').forEach(b=> b.onclick=()=>{
    if(!pendingStageTaskAdd) return;
    pendingStageTaskAdd.due = addDays(todayStr(), parseInt(b.dataset.stagetaskDue,10));
    render();
  });
  document.querySelectorAll('[data-stagetask-period]').forEach(b=> b.onclick=()=>{
    if(!pendingStageTaskAdd) return;
    pendingStageTaskAdd.period = (pendingStageTaskAdd.period===b.dataset.stagetaskPeriod? null : b.dataset.stagetaskPeriod);
    render();
  });
  const stageTaskAddConfirm = document.getElementById('stageTaskAddConfirm');
  if(stageTaskAddConfirm) stageTaskAddConfirm.onclick = ()=>{
    if(!pendingStageTaskAdd) return;
    const stage = state.financialGoal.stages.find(s=>s.id===pendingStageTaskAdd.stageId);
    const t = stage && stage.tasks.find(x=>x.id===pendingStageTaskAdd.taskId);
    if(t){
      const due = pendingStageTaskAdd.due || todayStr();
      state.tasks.push({id:uid(), title:t.text, goalId:null, category:'business', priority:'متوسطة', period:pendingStageTaskAdd.period||null, due, link:null, done:false, createdAt:todayStr()});
    }
    pendingStageTaskAdd = null;
    saveState(); render();
  };
  document.querySelectorAll('[data-stagetask-del]').forEach(b=> b.onclick=()=>{
    const [stageId, taskId] = b.dataset.stagetaskDel.split('|');
    const stage = state.financialGoal.stages.find(s=>s.id===stageId);
    const t = stage.tasks.find(x=>x.id===taskId);
    if(!confirm(`تحذفين مهمة "${t? t.text : ''}"؟`)) return;
    stage.tasks = stage.tasks.filter(x=>x.id!==taskId);
    saveState(); render();
  });
  const stageTaskAdd = document.getElementById('stageTaskAdd');
  if(stageTaskAdd) stageTaskAdd.onclick = ()=>{
    const stage = state.financialGoal.stages.find(s=>s.id===stageTaskAdd.dataset.stage);
    const inp = document.getElementById('stageTaskInput');
    const val = inp.value.trim();
    if(!val) return;
    stage.tasks.push({id:uid(), text:val, done:false});
    saveState(); render();
  };
  const stageDone = document.getElementById('stageDone');
  if(stageDone) stageDone.onclick = ()=>{
    const fg = state.financialGoal;
    const stage = fg.stages.find(s=>s.id===stageDone.dataset.stage);
    stage.done = true;
    fg.currentAmount = Math.max(fg.currentAmount, stage.targetAmount);
    saveState(); popStamp('وصلتي للمرحلة!','ماشاءالله عليك'); render();
  };
  document.querySelectorAll('[data-stage-del]').forEach(b=> b.onclick=()=>{
    const fg = state.financialGoal;
    const s = fg.stages.find(x=>x.id===b.dataset.stageDel);
    if(!confirm(`تحذفين مرحلة "${s? s.title : ''}"؟`)) return;
    fg.stages = fg.stages.filter(x=>x.id!==b.dataset.stageDel);
    saveState(); render();
  });
  const stageAddBtn = document.getElementById('stageAddBtn');
  if(stageAddBtn) stageAddBtn.onclick = ()=>{
    const title = document.getElementById('stageAddTitle').value.trim();
    const amount = parseFloat(document.getElementById('stageAddAmount').value);
    if(!title || !amount) return;
    state.financialGoal.stages.push({id:uid(), title, targetAmount:amount, done:false, tasks:[]});
    state.financialGoal.stages.sort((a,b)=> (a.done-b.done) || (a.targetAmount-b.targetAmount));
    saveState(); render();
  };
}

function scDefaultState(){
  return {
    assets:[{id:uid(), item:"", custom:"", tag:"fast", amount:""}],
    income:[state.sharedIncome? {id:uid(), item:"راتب شهري", custom:"", amount: state.sharedIncome, freq:"monthly"} : {id:uid(), item:"", custom:"", amount:"", freq:"monthly"}],

  };
}
function scFmt(n){ return Number(n||0).toLocaleString('ar-SA', {maximumFractionDigits:2}); }
function scBuildSimpleOptions(options, selected){
  let html = `<option value="">اختاري بند...</option>`;
  options.forEach(o=>{ html += `<option value="${escapeHtml(o)}" ${selected===o?'selected':''}>${escapeHtml(o)}</option>`; });
  html += `<option value="${SC_CUSTOM_VALUE}" ${selected===SC_CUSTOM_VALUE?'selected':''}>✏️ أخرى (اكتبي يدويًا)</option>`;
  return html;
}
function scBuildExpenseOptions(selected){ return buildExpenseItemOptions(selected, SC_CUSTOM_VALUE); }
function scBuildTagOptions(selected){ return buildExpenseTagOptions(selected); }
function scBuildAssetTagOptions(selected){
  return Object.keys(SC_ASSET_TAG_META).map(k=>`<option value="${k}" ${selected===k?'selected':''}>${SC_ASSET_TAG_META[k].emoji} ${SC_ASSET_TAG_META[k].label}</option>`).join('');
}
function scActiveList(rows){
  return rows.map(r=>({
    name: r.item===SC_CUSTOM_VALUE ? (r.custom||'').trim() : r.item,
    amount: parseFloat(r.amount)||0,
    tag: r.tag,
    freq: r.freq || 'monthly',
  })).filter(x=>x.name && x.amount>0);
}

function scRowDisplayName(r){ return r.item===SC_CUSTOM_VALUE ? (r.custom||'').trim() : r.item; }
/* a fully filled-in row (name + a real amount) shows as a clean one-line
   summary once she's not actively editing it — like every other list in
   this app (tasks, goals) — instead of staying an open form forever. An
   incomplete row, or one she explicitly tapped ✎ on, stays as a card. */
function scRowHasData(r){ return !!scRowDisplayName(r) && (parseFloat(r.amount)||0) > 0; }
function scAssetRowHtml(r, isEditing){
  const isCustom = r.item === SC_CUSTOM_VALUE;
  const tag = r.tag || 'fast';
  if(!isEditing){
    const meta = SC_ASSET_TAG_META[tag] || {};
    return `

      <span class="dot"></span>
      <div style="flex:1;">
        <div style="font-size:var(--t3);color:var(--ink);">${escapeHtml(scRowDisplayName(r))}</div>
        <div class="muted" style="font-size:var(--t2);">${meta.emoji||''} ${meta.label||''} · ${scFmt(parseFloat(r.amount)||0)} ريال</div>
      </div>
      <button type="button" class="icon-btn" data-sc-asset-edit="${r.id}">✎</button>
      <button type="button" class="icon-btn del-row" aria-label="حذف">✕</button>
    </div>`;
  }
  return `
  <div class="item-card" data-id="${r.id}">
    <div class="card-top">
      <select class="sel-item">${scBuildSimpleOptions(SC_ASSET_OPTIONS, r.item)}</select>
      ${isCustom ? `<input class="sel-custom" type="text" placeholder="اكتبي اسم الأصل" value="${escapeHtml(r.custom||'')}" />` : ''}
      <button type="button" class="del-row" aria-label="حذف">✕</button>

    <div class="card-grid">
      <div><label>المبلغ</label><input class="inp-amt" type="number" min="0" step="0.01" placeholder="المبلغ" value="${r.amount||''}" /></div>
      <div><label>نوع السيولة</label><select class="sel-tag">${scBuildAssetTagOptions(tag)}</select></div>
    </div>
    ${scRowHasData(r)? `<button type="button" class="btn ghost sm" style="margin-top:10px;" data-sc-asset-done="${r.id}">✓ تم</button>`:''}
  </div>`;
}
function scRenderAssetRows(){
  const sc = state.safety;
  const container = document.getElementById('scAssetRows');
  if(!container) return;
  container.innerHTML = sc.assets.map(r=>{
    const editing = scAssetEditingId===r.id || !scRowHasData(r);
    return scAssetRowHtml(r, editing);
  }).join('');
  container.querySelectorAll('[data-sc-asset-edit]').forEach(b=> b.onclick=()=>{ scAssetEditingId = b.dataset.scAssetEdit; scRenderAssetRows(); });
  container.querySelectorAll('[data-sc-asset-done]').forEach(b=> b.onclick=()=>{ scAssetEditingId = null; saveState(); scRenderAssetRows(); });
  container.querySelectorAll('[data-id]').forEach(rowEl=>{
    const id = rowEl.getAttribute('data-id');
    const row = sc.assets.find(r=>String(r.id)===id);
    const selItem = rowEl.querySelector('.sel-item');
    if(selItem) selItem.onchange = ()=>{
      row.item = selItem.value; if(row.item!==SC_CUSTOM_VALUE) row.custom='';
      row.tag = SC_ASSET_TAG_MAP[row.item] || 'fast';
      saveState(); scRenderAssetRows(); scUpdateSummary();
    };
    const selCustom = rowEl.querySelector('.sel-custom');
    if(selCustom) selCustom.oninput = ()=>{ row.custom = selCustom.value; saveState(); scUpdateSummary(); };
    const selTag = rowEl.querySelector('.sel-tag');
    if(selTag) selTag.onchange = ()=>{ row.tag = selTag.value; saveState(); scUpdateSummary(); };
    const amtInput = rowEl.querySelector('.inp-amt');
    if(amtInput){
      amtInput.oninput = (e)=>{ row.amount = e.target.value; saveState(); scUpdateSummary(); };
      amtInput.onchange = ()=> scRenderAssetRows();
    }
    rowEl.querySelector('.del-row').onclick = ()=>{
      sc.assets = sc.assets.filter(x=>x!==row);
      if(sc.assets.length===0) sc.assets.push({id:uid(), item:"", custom:"", tag:"fast", amount:""});
      saveState(); scRenderAssetRows(); scUpdateSummary();
    };
  });
}
function scSyncSharedIncome(){

    const selFreq = rowEl.querySelector('.sel-freq');

    if(!row || amt<=0 || !fg || !fg.configured) return;
    fg.currentAmount = (fg.currentAmount||0) + amt;
    fg.stages.forEach(s=>{ if(!s.done && fg.currentAmount >= s.targetAmount) s.done = true; });
    saveState(); popStamp('زادت مدّخراتك!','ماشاءالله عليك'); render();
  });
}
/* tops up the savings-account asset so money added to the financial goal also
   moves the safety number, instead of the two pages disagreeing about the same
   riyals. Creates the row if she doesn't have one yet. */
const SC_SAVINGS_ITEM = "حساب توفير (الرصيد الحالي)";
function scAddToSavingsAsset(amt){
  const sc = state.safety;
  if(!sc || !amt || amt<=0) return;
  let row = sc.assets.find(r=>r.item===SC_SAVINGS_ITEM);
  if(!row){
    row = {id:uid(), item:SC_SAVINGS_ITEM, custom:"", tag:SC_ASSET_TAG_MAP[SC_SAVINGS_ITEM]||'fast', amount:""};
    /* drop it into the first blank row if there is one, so she doesn't end up
       with an empty placeholder card sitting above it */
    const blank = sc.assets.findIndex(r=>!scRowHasData(r));
    if(blank>-1) sc.assets.splice(blank, 1, row); else sc.assets.push(row);
  }
  row.amount = String((parseFloat(row.amount)||0) + amt);
}

    rowEl.querySelector('.del-row').onclick = ()=>{

function scUpdateSummary(){
  const sc = state.safety;
  scSyncSharedIncome();
  const assets = scActiveList(sc.assets);
  const income = scActiveList(sc.income);
  const expenses = scActiveList(sc.expenses);
  const goals = scActiveList(sc.goals);

  const totalAssets = assets.reduce((s,e)=>s+e.amount,0);
  const fastAssets = assets.filter(e=>e.tag==='fast').reduce((s,e)=>s+e.amount,0);
  const slowAssets = assets.filter(e=>e.tag==='slow').reduce((s,e)=>s+e.amount,0);
  const fixedAssets = assets.filter(e=>e.tag==='fixed').reduce((s,e)=>s+e.amount,0);
  const liquidAssets = fastAssets + slowAssets;
  const monthlyEquiv = e => e.freq==='yearly' ? e.amount/12 : e.amount;
  const totalIncomeMonthly = income.reduce((s,e)=> s + monthlyEquiv(e), 0);
  /* أساسي/غير أساسي is derived from the shared expense tag, not stored twice.
     Savings/investment rows are transfers between her own pockets, so they're
     kept out of the expense total — counting them would shrink net savings by
     exactly the amount she saved. They're surfaced on their own line instead. */
  const essentialMonthly    = expenses.filter(e=> isEssentialTag(e.tag)).reduce((s,e)=> s + monthlyEquiv(e), 0);
  const nonEssentialMonthly = expenses.filter(e=> !isEssentialTag(e.tag) && !isTransferTag(e.tag)).reduce((s,e)=> s + monthlyEquiv(e), 0);
  const transferMonthly     = expenses.filter(e=> isTransferTag(e.tag)).reduce((s,e)=> s + monthlyEquiv(e), 0);
  const totalExpenseMonthly = essentialMonthly + nonEssentialMonthly;
  const totalGoals = goals.reduce((s,e)=>s+e.amount,0);

  const el = id => document.getElementById(id);
  if(!el('scAssetsTotal')) return;

  el('scAssetsTotal').textContent = scFmt(totalAssets) + ' ريال';
  const breakdownParts = [];
  if(fastAssets > 0) breakdownParts.push(`⚡ <b>${scFmt(fastAssets)} ريال</b> سيولة سريعة`);
  if(slowAssets > 0) breakdownParts.push(`🐢 <b>${scFmt(slowAssets)} ريال</b> سيولة طويلة المدى`);
  if(fixedAssets > 0) breakdownParts.push(`🏠 <b style="color:var(--rose-dark)">${scFmt(fixedAssets)} ريال</b> أصل ثابت (لا يُحسب)`);
  el('scAssetsBreakdown').innerHTML = breakdownParts.join(' — ');
  el('scIncomeTotal').textContent = scFmt(totalIncomeMonthly) + ' ريال';
  el('scExpenseTotal').textContent = scFmt(totalExpenseMonthly) + ' ريال';
  const expParts = [];
  if(essentialMonthly > 0) expParts.push(`🟢 <b>${scFmt(essentialMonthly)} ريال</b> أساسي`);
  if(nonEssentialMonthly > 0) expParts.push(`🔴 <b>${scFmt(nonEssentialMonthly)} ريال</b> غير أساسي`);
  if(transferMonthly > 0) expParts.push(`🔵 <b style="color:#3f6fd1">${scFmt(transferMonthly)} ريال</b> ادخار/استثمار — محسوب ضمن فائضك، مو مصروفًا`);
  el('scExpenseBreakdown').innerHTML = expParts.join(' — ');
  el('scGoalsTotal').textContent = scFmt(totalGoals) + ' ريال';

  const annualIncome = totalIncomeMonthly*12;
  const annualExpenseAll = totalExpenseMonthly*12;
  const annualNetSavings = annualIncome - annualExpenseAll;
  const annualEssential = essentialMonthly*12;

  const coreBeforeInflation = annualEssential * SC_COVERAGE_YEARS;
  const safetyTarget = coreBeforeInflation + coreBeforeInflation * SC_INFLATION_RATE;
  const remaining = Math.max(0, safetyTarget - liquidAssets);

  el('scSafetyTargetVal').textContent = scFmt(safetyTarget) + ' ريال';
  el('scSafetyTargetSub').textContent = `= (${scFmt(annualEssential)} ريال مصاريف أساسية سنوية × ${SC_COVERAGE_YEARS} سنوات) + تضخم 2%`;
  el('scEssentialAnnualVal').textContent = scFmt(annualEssential) + ' ريال';
  el('scNetSavingsVal').textContent = scFmt(annualNetSavings) + ' ريال';
  el('scRemainingVal').textContent = scFmt(remaining) + ' ريال';

  const nonEssentialBase = totalIncomeMonthly > 0 ? totalIncomeMonthly : totalExpenseMonthly;
  const nonEssentialPct = nonEssentialBase > 0 ? (nonEssentialMonthly / nonEssentialBase * 100) : 0;
  el('scNonEssentialMonthlyVal').textContent = scFmt(nonEssentialMonthly) + ' ريال';
  el('scNonEssentialMonthlyLabel').textContent = totalIncomeMonthly > 0
    ? `هذا الرقم يمثل ${nonEssentialPct.toFixed(0)}% من دخلك، ويذهب للمصاريف غير الأساسية شهريًا`
    : 'من ميزانيتك يذهب للمصاريف غير الأساسية شهريًا';

  const monthlyGap = Math.max(0, totalExpenseMonthly - totalIncomeMonthly);
  el('scMonthlyGapVal').textContent = monthlyGap > 0 ? scFmt(monthlyGap) + ' ريال' : '0 ريال (لا يوجد عجز)';

  const statusBanner = el('scStatusBanner');
  const yearsValEl = el('scYearsVal');
  if(totalIncomeMonthly===0 && essentialMonthly===0){
    statusBanner.innerHTML = ''; yearsValEl.textContent = '—';
  } else if(remaining <= 0){
    yearsValEl.textContent = '0 سنة';
    statusBanner.innerHTML = `<div class="status-banner status-green">🎉 وصلتِ لنقطة الأمان المالي! أصولك الحالية تغطي احتياجاتك الأساسية لـ ${SC_COVERAGE_YEARS} سنوات وأكثر.</div>`;
  } else if(annualNetSavings === 0){
    yearsValEl.textContent = '∞ سنة';
    statusBanner.innerHTML = `<div class="status-banner status-red">🔴 دخلك يساوي مصاريفك بالضبط — ما فيه فائض سنوي يقربك من الأمان المالي. تحتاجين دخل إضافي شهري بمقدار ${scFmt(monthlyGap>0?monthlyGap:1)} ريال على الأقل لتبدأ تتحرك نحو الهدف.</div>`;
  } else {
    const years = remaining / annualNetSavings;
    const yearsText = Math.abs(years).toFixed(1) + ' سنة';
    let cls, msg;
    if(years < 0){
      yearsValEl.textContent = '-' + yearsText;
      msg = `🔴 مصاريفك تتجاوز دخلك، فأنتِ حاليًا تبتعدين عن الأمان المالي بدل الاقتراب منه. تحتاجين دخل إضافي شهري بمقدار ${scFmt(monthlyGap)} ريال على الأقل للتعادل، وأكثر من ذلك للبدء بالتقدم.`;
      cls = 'status-red';
    } else {
      yearsValEl.textContent = yearsText;
      if(years <= 5){ cls='status-yellow'; msg = `🟡 أنتِ قريبة من تحقيق أمانك المالي — تحتاجين تقريبًا ${yearsText} بمعدل ادخارك الحالي.`; }
      else { cls='status-red'; msg = `🔴 بمعدل ادخارك الحالي تحتاجين ${yearsText} تقريبًا — قد تحتاجين مصادر دخل إضافية لتسريع الوصول.`; }
    }
    statusBanner.innerHTML = `<div class="status-banner ${cls}">${msg}</div>`;
  }

  const goalsExtraYearsEl = el('scGoalsExtraYears');
  if(totalGoals === 0){
    goalsExtraYearsEl.textContent = 'أضيفي رغباتك لمعرفة التكلفة الإجمالية';
  } else if(annualNetSavings > 0){
    goalsExtraYearsEl.textContent = `بمعدل ادخارك الحالي، تحتاجين ~${(totalGoals/annualNetSavings).toFixed(1)} سنة إضافية لتحقيق هذه الرغبات (بجانب مسار الأمان المالي)`;
  } else if(annualNetSavings === 0){
    goalsExtraYearsEl.textContent = `ما فيه فائض ادخار حاليًا — تحتاجين دخل إضافي شهري ${scFmt(monthlyGap>0?monthlyGap:1)} ريال على الأقل قبل ما تقدرين تبدين بتحقيق هذه الرغبات`;
  } else {
    goalsExtraYearsEl.textContent = `مصاريفك تتجاوز دخلك حاليًا، فهذه الرغبات بعيدة أكثر لا أقرب — تحتاجين دخل إضافي شهري ${scFmt(monthlyGap)} ريال على الأقل للتعادل أولًا`;
  }

  const goalsTargetStatusEl = el('scGoalsTargetStatus');
  const targetYears = parseFloat(sc.goalsTargetYears);
  if(totalGoals > 0 && targetYears > 0){
    const requiredMonthly = totalGoals / (targetYears * 12);
    const availableMonthly = annualNetSavings / 12;
    goalsTargetStatusEl.style.display = 'block';
    if(availableMonthly >= requiredMonthly){
      goalsTargetStatusEl.className = 'status-banner status-green';
      goalsTargetStatusEl.innerHTML = `🎉 بمعدل ادخارك الحالي (${scFmt(availableMonthly)} ريال شهريًا)، تقدرين تحققين هالهدف خلال ${targetYears} سنة براحة — يتطلب بس ${scFmt(requiredMonthly)} ريال شهريًا.`;
    } else {
      const gap = requiredMonthly - availableMonthly;
      goalsTargetStatusEl.className = 'status-banner status-red';
      goalsTargetStatusEl.innerHTML = `🔴 عشان تحققين هالهدف خلال ${targetYears} سنة، تحتاجين تدخرين ${scFmt(requiredMonthly)} ريال شهريًا — وهذا أكبر من فائضك الحالي (${scFmt(availableMonthly)} ريال) بمقدار <b>${scFmt(gap)} ريال</b> شهريًا إضافية.`;
    }
  } else {
    goalsTargetStatusEl.style.display = 'none';
    goalsTargetStatusEl.innerHTML = '';
  }
}

/* ============ monthly expense diagnosis ============ */
const ED_CUSTOM_VALUE = "__custom__";
/* expense items/tags for this page come from the shared EXPENSE_GROUPS
   vocabulary at the top of the file — see the note there */

function edMonthKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function edCurrentMonthLabel(){ const d = new Date(); return 'مصاريف شهر ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }
function edEmptyMonthData(){ return {salary: state.sharedIncome||'', extra:'', rows:[{id:uid(), item:"", custom:"", tag:"reducible", amount:"", date:todayStr()}]}; }
function edGetMonth(){
  if(!state.expenseDiag) state.expenseDiag = {};
  const k = edMonthKey();
  if(!state.expenseDiag[k]) state.expenseDiag[k] = edEmptyMonthData();
  const m = state.expenseDiag[k];
  if(!state.sharedIncome && m.salary) state.sharedIncome = m.salary; /* migrate legacy per-month salary into the shared value */
  return m;
}
function edFmt(n){ return Number(n||0).toLocaleString('ar-SA', {maximumFractionDigits:2}); }
function edBuildItemOptions(selected){ return buildExpenseItemOptions(selected, ED_CUSTOM_VALUE); }
function edBuildTagOptions(selected){ return buildExpenseTagOptions(selected); }
function edActiveExpenses(m){
  return m.rows.map(r=>({
    name: r.item===ED_CUSTOM_VALUE ? ((r.custom||'').trim() || "بند بدون اسم") : r.item,
    tag: r.tag || EXPENSE_TAG_OF[r.item] || 'reducible',
    amount: parseFloat(r.amount) || 0,
  })).filter(e => e.name && e.amount > 0);
}

/* one editable transaction row — used both for freshly-added (uncategorized)
   rows and for rows nested inside an expanded category group */
function edRowDisplayName(r){ return r.item===ED_CUSTOM_VALUE ? (r.custom||'').trim() : r.item; }
function edRowHasData(r){ return !!edRowDisplayName(r) && (parseFloat(r.amount)||0) > 0; }
/* same idea as the safety calculator: a filled-in transaction collapses to
   a one-line summary (name is already the group header above it, so this
   just shows date + amount) instead of always showing the full 5-field
   form. Incomplete rows, or ones explicitly reopened via ✎, stay editable. */
function edRowHtml(r){
  const editing = edEditingId===r.id || !edRowHasData(r);
  if(!editing){
    return `
    <div class="inbox-row" data-id="${r.id}">
      <span class="dot"></span>
      <div style="flex:1;">
        <div style="font-size:var(--t3);color:var(--ink);">🗓️ ${r.date||todayStr()}</div>
        <div class="muted" style="font-size:var(--t2);">${edFmt(parseFloat(r.amount)||0)} ريال</div>
      </div>
      <button type="button" class="icon-btn" data-ed-edit="${r.id}">✎</button>
      <button type="button" class="icon-btn del-row" aria-label="حذف">✕</button>
    </div>`;
  }
  const isCustom = r.item === ED_CUSTOM_VALUE;
  return `
  <div class="item-card" data-id="${r.id}">
    <div class="card-top">
      <select class="sel-item">${edBuildItemOptions(r.item)}</select>
      ${isCustom ? `<input class="sel-custom" type="text" placeholder="اكتبي اسم البند" value="${escapeHtml(r.custom||'')}" />` : ''}
      <button type="button" class="del-row" aria-label="حذف">✕</button>
    </div>
    ${isCustom ? `<div class="card-grid" style="margin-bottom:8px;"><div><label>التصنيف</label><select class="sel-tag">${edBuildTagOptions(r.tag)}</select></div></div>` : ''}
    <div class="card-grid">
      <div><label>المبلغ</label><input class="inp-amt" type="number" min="0" step="0.01" placeholder="المبلغ" value="${r.amount||''}" /></div>
      <div><label>التاريخ</label><input class="inp-date" type="date" value="${r.date||todayStr()}" /></div>
    </div>
    ${edRowHasData(r)? `<button type="button" class="btn ghost sm" style="margin-top:10px;" data-ed-done="${r.id}">✓ تم</button>`:''}
  </div>`;
}
function edAttachRowHandlers(container, m){
  container.querySelectorAll('[data-ed-edit]').forEach(b=> b.onclick=()=>{ edEditingId = b.dataset.edEdit; edRenderRows(); });
  container.querySelectorAll('[data-ed-done]').forEach(b=> b.onclick=()=>{ edEditingId = null; saveState(); edRenderRows(); });
  container.querySelectorAll('[data-id]').forEach(rowEl=>{
    const id = rowEl.getAttribute('data-id');
    const row = m.rows.find(r=>String(r.id)===id);
    if(!row) return;
    const selItem = rowEl.querySelector('.sel-item');
    if(selItem) selItem.onchange = ()=>{
      row.item = selItem.value;
      if(row.item !== ED_CUSTOM_VALUE){ row.tag = EXPENSE_TAG_OF[row.item] || 'reducible'; row.custom=''; }
      saveState(); edRenderRows(); edUpdateSummary();
    };
    const selCustom = rowEl.querySelector('.sel-custom');
    if(selCustom) selCustom.oninput = ()=>{ row.custom = selCustom.value; saveState(); edUpdateSummary(); };
    const selTag = rowEl.querySelector('.sel-tag');
    if(selTag) selTag.onchange = ()=>{ row.tag = selTag.value; saveState(); edUpdateSummary(); };
    const amtInput = rowEl.querySelector('.inp-amt');
    if(amtInput){
      amtInput.oninput = (e)=>{ row.amount = e.target.value; saveState(); edUpdateSummary(); };
      amtInput.onchange = ()=> edRenderRows();
    }
    const dateInput = rowEl.querySelector('.inp-date');
    if(dateInput) dateInput.onchange = (e)=>{ row.date = e.target.value; saveState(); edRenderRows(); };
    rowEl.querySelector('.del-row').onclick = ()=>{
      m.rows = m.rows.filter(x=>x!==row);
      if(m.rows.length===0) m.rows.push({id:uid(), item:"", custom:"", tag:"reducible", amount:"", date:todayStr()});
      saveState(); edRenderRows(); edUpdateSummary();
    };
  });
}
/* every "+ إضافة مصروف جديد" click adds its own independent transaction —
   never edits a previous one. Same-category transactions are grouped here
   just for display, each under a running total, so repeat categories (like
   "بقالة" bought several times a month) don't read as duplicate/edited rows.
   Groups default open so a just-picked category never hides its own amount
   field; she can collapse ones she's done reviewing to declutter. */
function edRenderRows(){
  const m = edGetMonth();
  const container = document.getElementById('edExpenseRows');
  if(!container) return;

  const groups = {};
  const incomplete = [];
  m.rows.forEach(r=>{
    const name = r.item===ED_CUSTOM_VALUE ? (r.custom||'').trim() : r.item;
    if(!r.item || !name){ incomplete.push(r); return; }
    (groups[name] = groups[name] || {rows:[], total:0}).rows.push(r);
    groups[name].total += parseFloat(r.amount)||0;
  });
  const groupNames = Object.keys(groups).sort((a,b)=> groups[b].total-groups[a].total);

  const groupsHtml = groupNames.map(name=>{
    const g = groups[name];
    const key = 'edGroup:'+name;
    const collapsed = state.collapsed[key];
    return `
    <div style="border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px;">
      <button type="button" class="icon-btn sm" data-toggle-collapse="${key}" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 4px;text-align:right;">
        <span style="display:flex;align-items:center;gap:7px;"><span class="chev ${collapsed?"":"open"}">▾</span>${escapeHtml(name)} <span class="muted" style="font-weight:400;">(${g.rows.length})</span></span>
        <b>${edFmt(g.total)} ريال</b>
      </button>
      ${collapsed? '' : g.rows.map(edRowHtml).join('')}
    </div>`;
  }).join('');

  container.innerHTML = groupsHtml + incomplete.map(edRowHtml).join('');
  edAttachRowHandlers(container, m);
  /* this container is rebuilt independently of the full-page render() cycle,
     so the global data-toggle-collapse delegation (bound once per full
     render in attachGlobalEvents) never reaches these buttons — wire them
     directly here instead. */
  container.querySelectorAll('[data-toggle-collapse]').forEach(el=> el.onclick=()=>{
    const key = el.dataset.toggleCollapse;
    state.collapsed[key] = !state.collapsed[key];
    saveState(); edRenderRows();
  });
}

function edUpdateSummary(){
  const m = edGetMonth();
  const el = id => document.getElementById(id);
  if(!el('edIncomeTotal')) return;
  const salary = parseFloat(state.sharedIncome)||0;
  const extra = parseFloat(m.extra)||0;
  const income = salary + extra;
  el('edIncomeTotal').textContent = edFmt(income) + ' ريال';

  const exp = edActiveExpenses(m);
  const totalExp = exp.reduce((s,e)=>s+e.amount,0);
  el('edExpenseTotal').textContent = edFmt(totalExp) + ' ريال';

  /* group-header totals live inside #edExpenseRows, which edRenderRows() only
     rebuilds on add/delete/category-change — not on every amount keystroke
     (that would blow away focus mid-typing). Patch them here instead, since
     this runs on every keystroke already. */
  const groupTotals = {};
  exp.forEach(e=> groupTotals[e.name] = (groupTotals[e.name]||0) + e.amount);
  document.querySelectorAll('#edExpenseRows [data-toggle-collapse^="edGroup:"]').forEach(headerBtn=>{
    const name = headerBtn.dataset.toggleCollapse.slice('edGroup:'.length);
    const totalEl = headerBtn.querySelector('b');
    if(totalEl && groupTotals[name]!==undefined) totalEl.textContent = edFmt(groupTotals[name]) + ' ريال';
  });

  const remaining = income - totalExp;
  const remainingEl = el('edRemainingVal');
  remainingEl.textContent = edFmt(Math.abs(remaining)) + ' ريال' + (remaining<0? ' (عجز)' : '');
  remainingEl.style.color = remaining<0 ? 'var(--rose-dark)' : '#2f9e6e';

  const byTag = {necessary:0, reducible:0, luxury:0, wealth:0, debt:0};
  exp.forEach(e=> byTag[e.tag] += e.amount);
  const pctOfIncome = {};
  Object.keys(EXPENSE_TAGS).forEach(k=> pctOfIncome[k] = income>0 ? (byTag[k]/income*100) : 0);
  const remainingPct = income>0 ? Math.max(0, 100 - Object.values(pctOfIncome).reduce((a,b)=>a+b,0)) : 0;

  const alertsBox = el('edAlertsBox');
  alertsBox.innerHTML = '';
  if(income>0 && totalExp > income){
    alertsBox.innerHTML += `<div class="alert bad">⚠️ مصاريفك تتجاوز دخلك بمقدار ${edFmt(totalExp-income)} ريال هذا الشهر.</div>`;
  } else if(income>0 && byTag.wealth === 0){
    alertsBox.innerHTML += `<div class="alert bad">💡 ما فيه أي مبلغ مخصص للادخار أو الاستثمار هذا الشهر.</div>`;
  } else if(income>0){
    alertsBox.innerHTML += `<div class="alert ok">✅ مصاريفك ضمن حدود دخلك.</div>`;
  }

  el('edDiagBar').innerHTML = Object.keys(EXPENSE_TAGS).map(k=>
    `<span style="width:${pctOfIncome[k]}%; background:${EXPENSE_TAGS[k].color}"></span>`
  ).join('') + `<span style="width:${remainingPct}%; background:var(--line)"></span>`;

  el('edDiagLegend').innerHTML = Object.keys(EXPENSE_TAGS).map(k=>
    `<span class="li"><span class="dot" style="background:${EXPENSE_TAGS[k].color}"></span>${EXPENSE_TAGS[k].emoji} ${EXPENSE_TAGS[k].label} <b>${pctOfIncome[k].toFixed(0)}%</b></span>`
  ).join('') + `<span class="li"><span class="dot" style="background:var(--line)"></span>متبقي <b>${remainingPct.toFixed(0)}%</b></span>`;

  el('edBreakdownGrid').innerHTML = Object.keys(EXPENSE_TAGS).map(k=>
    `<div class="bd-item" style="background:${EXPENSE_TAGS[k].bg}">
      <div class="p" style="color:${EXPENSE_TAGS[k].color}">${edFmt(byTag[k])} ريال</div>
      <div class="l" style="color:${EXPENSE_TAGS[k].color}">${EXPENSE_TAGS[k].emoji} ${EXPENSE_TAGS[k].label} — ${totalExp>0?(byTag[k]/totalExp*100).toFixed(0):0}% من مصاريفك</div>
    </div>`
  ).join('');

  const grouped = {};
  exp.forEach(e=>{ grouped[e.name] = (grouped[e.name]||0) + e.amount; });
  const sortedItems = Object.entries(grouped).sort((a,b)=>b[1]-a[1]).slice(0,5);
  el('edTopItemsBox').innerHTML = sortedItems.length===0
    ? `<div class="empty">أضيفي بنود المصاريف بالأعلى عشان تظهر هنا</div>`
    : sortedItems.map(([name,amt],i)=> `<div class="top-item"><span><span class="rank">${i+1}.</span>${escapeHtml(name)}</span><span class="amt">${edFmt(amt)} ريال</span></div>`).join('');

  const reducibleCandidates = exp.filter(e => e.tag==='reducible' || e.tag==='luxury')
    .reduce((acc,e)=>{ acc[e.name]=(acc[e.name]||0)+e.amount; return acc; }, {});
  const topReducible = Object.entries(reducibleCandidates).sort((a,b)=>b[1]-a[1]).slice(0,2);
  el('edTipsBox').innerHTML = topReducible.length===0
    ? `<div class="empty">ما فيه بنود "قابلة للتقليل" أو "كمالية" حاليًا لنقترح عليها توفير</div>`
    : topReducible.map(([name,amt])=>{
        const monthly = amt*0.3, yearly = monthly*12;
        return `<div class="tip">💡 لو خفضتِ <b>${escapeHtml(name)}</b> بنسبة 30%، راح توفّرين <b>${edFmt(monthly)} ريال</b> شهريًا (${edFmt(yearly)} ريال سنويًا).</div>`;
      }).join('');

  edRenderScore(income, totalExp, byTag, pctOfIncome);
  edRenderPlanVsActual(exp);
}

/* the payoff of both money tools sharing one expense vocabulary: her planned
   monthly figure and what she actually spent are finally the same item name, so
   they can sit side by side. Yearly plan rows are shown at their monthly share
   so the two columns compare like for like. */
function edRenderPlanVsActual(actualList){
  const card = document.getElementById('edPlanVsActualCard');
  const box  = document.getElementById('edPlanVsActualBox');
  if(!card || !box) return;
  const sc = state.safety;
  if(!sc || !sc.expenses){ card.style.display='none'; return; }

  const planned = {};
  scActiveList(sc.expenses).forEach(e=>{
    planned[e.name] = (planned[e.name]||0) + (e.freq==='yearly'? e.amount/12 : e.amount);
  });
  const actual = {};
  actualList.forEach(e=>{ actual[e.name] = (actual[e.name]||0) + e.amount; });

  const names = Object.keys(planned).filter(n=> actual[n]!=null);
  if(!names.length){ card.style.display='none'; return; }
  card.style.display = '';

  names.sort((a,b)=> Math.abs(actual[b]-planned[b]) - Math.abs(actual[a]-planned[a]));
  box.innerHTML = names.map(n=>{
    const p = planned[n], a = actual[n], diff = a - p;
    const over = diff > 0.5, under = diff < -0.5;
    const color = over? 'var(--rose-dark)' : (under? '#2f9e6e' : 'var(--ink)');
    const note  = over? `+${edFmt(diff)} فوق خطتك` : (under? `−${edFmt(-diff)} تحت خطتك` : 'مطابق لخطتك');
    return `
    <div class="top-item">
      <span>${escapeHtml(n)}</span>
      <span class="amt" style="color:${color};">
        ${edFmt(a)} / ${edFmt(p)} ريال
        <span style="display:block;font-size:var(--t1);font-weight:400;">${note}</span>
      </span>
    </div>`;
  }).join('');
}

function edRenderScore(income, totalExp, byTag, pctOfIncome){
  let score = 50;
  const wealthPct = pctOfIncome.wealth, luxuryPct = pctOfIncome.luxury, debtPct = pctOfIncome.debt;
  const notes = [];
  if(income>0){
    score += Math.min(30, wealthPct*1.5);
    score -= Math.min(30, luxuryPct*1.0);
    score -= Math.min(15, Math.max(0, debtPct-20)*0.5); /* only penalize once debt service passes ~20% of income */
    if(totalExp > income){ score -= 25; notes.push('مصاريفك تتجاوز دخلك — هذا أكبر مؤثر سلبي على المؤشر.'); }
    if(byTag.wealth === 0){ score -= 15; notes.push('لا يوجد مبلغ مخصص للادخار/الاستثمار هذا الشهر (غير القروض).'); }
    if(wealthPct >= 15) notes.push('نسبة جيدة من دخلك تذهب لبناء الثروة 👏');
    if(luxuryPct >= 20) notes.push('نسبة الإنفاق الكمالي مرتفعة نسبيًا مقارنة بدخلك.');
    if(debtPct > 0) notes.push(`${debtPct.toFixed(0)}% من دخلك يذهب لسداد ديون وقروض هذا الشهر.`);
  } else {
    score = 0;
    notes.push('أدخلي الدخل الشهري عشان يُحتسب المؤشر.');
  }
  score = Math.max(0, Math.min(100, Math.round(score)));
  document.getElementById('edScoreNum').textContent = score;
  document.getElementById('edScoreBarFill').style.width = score + '%';
  let label, ratingColor;
  if(income===0){ label='—'; ratingColor='#6b7a78'; }
  else if(score>=80){ label='🟢 ممتاز'; ratingColor='#2f9e6e'; }
  else if(score>=60){ label='🟡 جيد'; ratingColor='#d99a1f'; }
  else if(score>=40){ label='🟠 يحتاج تحسين'; ratingColor='#d9772f'; }
  else { label='🔴 مقلق'; ratingColor='var(--rose)'; }
  const scoreLabelEl = document.getElementById('edScoreLabel');
  scoreLabelEl.textContent = label;
  scoreLabelEl.style.color = ratingColor;
  document.getElementById('edScoreExplain').innerHTML = notes.length ? notes.map(n=>'• '+escapeHtml(n)).join('<br/>') : '';
}

function renderHabitsPage(){
  const start = startOfWeek(weekRef);
  const dates = Array.from({length:7},(_,i)=>addDays(start,i));
  const habitsThisWeek = state.habits.filter(h=> habitIsActive(h) && dates.some(d=>h.days.includes(dowOf(d))));

  const rangeLabel = `${formatDateAr(dates[0])} – ${formatDateAr(dates[6])}`;

  let rows = '';
  if(habitsThisWeek.length===0){
    rows = `<tr><td colspan="8" style="padding:20px;color:#8b9694;">ما فيه عادات مفعّلة لأيام هالأسبوع. أضيفي عادة من الإدارة تحت.</td></tr>`;
  }else{
    rows = habitsThisWeek.map((h)=>{
      let cells = dates.map(d=>{
        const dow = dowOf(d);
        if(!h.days.includes(dow)) return `<td><span class="gcheck na">–</span></td>`;
        const log = getLog(d);
        const done = !!log.habits[h.id];
        return `<td><button type="button" class="gcheck ${done?'done':''}" data-gdate="${d}" data-ghabit="${h.id}">${done?'<svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg>':''}</button></td>`;
      }).join('');
      return `<tr><td class="habit-label-cell">${escapeHtml(h.label)}</td>${cells}</tr>`;
    }).join('');
  }

  let pctCells = dates.map(d=>{
    const dow = dowOf(d);
    const active = habitsForDow(dow);
    if(!active.length) return `<td>–</td>`;
    const log = getLog(d);
    const done = active.filter(h=>log.habits[h.id]).length;
    return `<td>${done}/${active.length}</td>`;
  }).join('');

  const reflections = dates.map(d=> getLog(d).reflection);
  const rated = reflections.filter(r=> r!=null);

  let totalPossible = 0, totalDone = 0;
  dates.forEach(d=>{
    const active = habitsForDow(dowOf(d));
    const log = getLog(d);
    totalPossible += active.length;
    totalDone += active.filter(h=>log.habits[h.id]).length;
  });
  const weekPct = totalPossible? Math.round(totalDone/totalPossible*100) : null;

  return `
  <h2 style="font-size:var(--t6);color:var(--petrol-dark);margin-bottom:14px;">متابعة العادات الأسبوعية</h2>

  <div class="card">
    <div class="week-nav">
      <button type="button" class="arrow" id="prevWeek" style="width:32px;height:32px;border-radius:8px;background:var(--parchment);border:1px solid var(--line);">‹</button>
      <span class="lbl">${rangeLabel}${startOfWeek(todayStr())===start? ' (الأسبوع الحالي)':''}</span>
      <button type="button" class="arrow" id="nextWeek" style="width:32px;height:32px;border-radius:8px;background:var(--parchment);border:1px solid var(--line);">›</button>
    </div>
    <p class="muted" style="margin-top:12px;margin-bottom:2px;">إنجازك هالأسبوع</p>
    ${weekPct!=null? `
      <p style="font-size:26px;font-weight:700;color:var(--petrol-dark);margin-bottom:8px;">${weekPct}٪</p>
      <div class="habit-progress-track"><div class="habit-progress-fill" style="width:${weekPct}%;"></div></div>
    ` : `<div class="empty tight">ما فيه عادات مفعّلة هالأسبوع بعد</div>`}
  </div>

  <details class="card" data-sec="habitsWeekTable" ${openSections.habitsWeekTable?'open':''} style="margin-top:12px;">
    <summary><h3>📊 جدول الأسبوع بالتفصيل <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <div class="htable-wrap">
        <table class="htable">
          <thead>
            <tr>
              <th style="text-align:right;">العادة</th>
              ${dates.map(d=>`<th>${DOW_NAMES[dowOf(d)].replace('ال','')}<span class="d">${parseISO(d).getDate()}</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows}
            ${habitsThisWeek.length? `<tr class="pct-row"><td class="habit-label-cell">الإنجاز</td>${pctCells}</tr>`:''}
          </tbody>
        </table>
      </div>
      <p class="muted" style="margin-top:10px;">العلامة "–" تعني إن هالعادة مو ضمن روتين ذاك اليوم.</p>
    </div>
  </details>

  <details class="card" data-sec="habitsMood" ${openSections.habitsMood?'open':''} style="margin-top:12px;">
    <summary><h3>🌿 لحظات التقدير <span class="chev">▾</span></h3></summary>
    <div class="details-body">
      <p class="muted" style="margin-bottom:12px;">قد ايش راضية عن نفسك كل يوم بالأسبوع — بعيدًا عن كم أنجزتِ.</p>
      <div class="htable-wrap">
        <table class="htable">
          <thead>
            <tr>
              ${dates.map(d=>`<th>${DOW_NAMES[dowOf(d)].replace('ال','')}<span class="d">${parseISO(d).getDate()}</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            <tr>
              ${dates.map((d,i)=>`<td style="font-size:17px;">${reflections[i]? REFLECTION_FACES[reflections[i]-1] : '<span class="gcheck na">–</span>'}</td>`).join('')}

        </table>

    </div>
  </details>

  <details class="card" data-sec="habitsEdit" ${openSections.habitsEdit?'open':''} style="margin-top:12px;">

function attachTaskDraftEvents(){
  const tdCat = document.getElementById('tdCat');
  if(tdCat) tdCat.onchange = ()=>{
    syncDraft();
    const box = timeBoxForCategory(taskDraft.category);
    if(box) taskDraft.period = box.id;
    render();
  };
  document.querySelectorAll('[data-pri]').forEach(b=> b.onclick=()=>{ syncDraft(); taskDraft.priority=b.dataset.pri; render(); });
  document.querySelectorAll('[data-per]').forEach(b=> b.onclick=()=>{ syncDraft(); taskDraft.period = (taskDraft.period===b.dataset.per? null : b.dataset.per); render(); });
  document.querySelectorAll('[data-dev]').forEach(b=> b.onclick=()=>{ syncDraft(); taskDraft.device = (taskDraft.device===b.dataset.dev? null : b.dataset.dev); render(); });
  const recurDetails = document.getElementById('tdRecurDetails');
  if(recurDetails) recurDetails.ontoggle = ()=>{ taskDraftRecurOpen = recurDetails.open; };
  document.querySelectorAll('[data-recur-type]').forEach(b=> b.onclick=()=>{
    syncDraft();
    taskDraft.recurType = b.dataset.recurType || null;
    taskDraftRecurOpen = true;
    render();
  });
  document.querySelectorAll('[data-recur-day]').forEach(b=> b.onclick=()=>{
    syncDraft();
    const day = parseInt(b.dataset.recurDay,10);
    taskDraft.recur = taskDraft.recur || [];
    const i = taskDraft.recur.indexOf(day);
    if(i>-1) taskDraft.recur.splice(i,1); else taskDraft.recur.push(day);
    render();
  });
  document.querySelectorAll('[data-rte-cmd]').forEach(b=> b.onclick=()=>{
    document.getElementById('tdLongNote').focus();
    document.execCommand(b.dataset.rteCmd, false, null);
  });
  const tdAttachInput = document.getElementById('tdAttachInput');
  if(tdAttachInput) tdAttachInput.onchange = ()=>{
    syncDraft();
    const file = tdAttachInput.files && tdAttachInput.files[0];
    if(!file) return;
    if(file.size > 800*1024){
      attachError = `الملف "${file.name}" حجمه أكبر من ٨٠٠ كيلوبايت — اختاري ملف أصغر.`;
      render();
      return;
    }
    attachError = null;
    const reader = new FileReader();
    reader.onload = ()=>{
      taskDraft.attachments = taskDraft.attachments || [];
      taskDraft.attachments.push({id:uid(), name:file.name, size:file.size, dataUrl:reader.result});
      render();
    };
    reader.onerror = ()=>{ attachError = 'ما قدرت أقرأ الملف، جربي ملف ثاني.'; render(); };
    reader.readAsDataURL(file);
  };
  document.querySelectorAll('[data-tdattach-del]').forEach(b=> b.onclick=()=>{
    syncDraft();
    taskDraft.attachments.splice(parseInt(b.dataset.tdattachDel,10),1);
    render();
  });
  document.getElementById('tdSave').onclick = ()=>{
    syncDraft();
    if(!taskDraft.title.trim()){ document.getElementById('tdTitle').focus(); return; }
    let recurType = taskDraft.recurType || null;
    let recur = null, recurMonthDay = null;
    if(recurType==='weekly'){
      recur = (taskDraft.recur && taskDraft.recur.length)? taskDraft.recur.slice() : null;
      if(!recur) recurType = null;
    }else if(recurType==='monthly'){
      const day = parseInt(taskDraft.recurMonthDay,10);
      recurMonthDay = (day>=1 && day<=31)? day : null;
      if(!recurMonthDay) recurType = null;
    }
    const recurStart = recurType? (taskDraft.recurStart||null) : null;
    const recurEnd = recurType? (taskDraft.recurEnd||null) : null;
    if(taskDraft.id){
      const t = state.tasks.find(x=>x.id===taskDraft.id);
      if(t){
        t.title = taskDraft.title.trim();
        t.goalId = taskDraft.goalId||null;
        t.category = taskDraft.category||null;
        t.priority = taskDraft.priority;
        t.period = taskDraft.period||null;
        t.due = taskDraft.due||null;
        /* giving it a date again un-parks it, so it rejoins the day views */
        if(t.due || t.recurType) t.lapsedFrom = null;
        t.link = taskDraft.link||null;
        t.device = taskDraft.device||null;
        t.actionType = taskDraft.actionType||null;
        t.longNote = taskDraft.longNote||'';
        t.attachments = (taskDraft.attachments||[]).slice();
        t.recurType = recurType;
        t.recur = recur;
        t.recurMonthDay = recurMonthDay;
        t.recurStart = recurStart;
        t.recurEnd = recurEnd;
        if(!recurType && t.lastDoneDate){
          t.done = (t.lastDoneDate === todayStr());
          t.doneAt = t.done? todayStr() : null;
          t.lastDoneDate = null;
        }
      }
    }else{
      state.tasks.push({
        id:uid(), title:taskDraft.title.trim(), goalId:taskDraft.goalId||null, category:taskDraft.category||null,
        priority:taskDraft.priority, period:taskDraft.period||null, due:taskDraft.due||null, link:taskDraft.link||null,
        device:taskDraft.device||null, actionType:taskDraft.actionType||null,
        longNote:taskDraft.longNote||'', attachments:(taskDraft.attachments||[]).slice(),
        recurType, recur, recurMonthDay, recurStart, recurEnd, lastDoneDate:null, done:false, createdAt:todayStr()
      });
    }
    saveState();
    taskDraft = null;
    render();
  };
  document.getElementById('tdCancel').onclick = ()=>{ taskDraft=null; attachError=null; render(); };
}
function syncDraft(){
  taskDraft.title = document.getElementById('tdTitle').value;
  taskDraft.goalId = document.getElementById('tdGoal').value;
  taskDraft.category = document.getElementById('tdCat').value;
  taskDraft.actionType = document.getElementById('tdAction').value;
  taskDraft.due = document.getElementById('tdDue').value;
  taskDraft.link = document.getElementById('tdLink').value;
  const rs = document.getElementById('tdRecurStart');
  const re = document.getElementById('tdRecurEnd');
  if(rs) taskDraft.recurStart = rs.value;
  if(re) taskDraft.recurEnd = re.value;
  const rmd = document.getElementById('tdRecurMonthDay');
  if(rmd) taskDraft.recurMonthDay = rmd.value;
  const noteEl = document.getElementById('tdLongNote');
  if(noteEl) taskDraft.longNote = noteEl.textContent.trim()? noteEl.innerHTML : '';
}

function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(b=> b.onclick=()=>{ view=b.dataset.nav; render(); });

  /* remember which <details> panels the user opened, so clicking anything inside them
     (which triggers a render()) doesn't snap the panel shut again */
  document.querySelectorAll('details[data-sec]').forEach(d=>{
    d.ontoggle = ()=>{
      openSections[d.dataset.sec] = d.open;
      state.openSections = openSections;
      saveState();
    };
  });

  /* task search: only refresh the task-list card, never the whole page, so the search
     input itself is never rebuilt and never loses focus while typing */
  const taskSearchInput = document.getElementById('taskSearchInput');
  if(taskSearchInput){
    taskSearchInput.oninput = ()=>{
      taskSearchQuery = taskSearchInput.value;
      const card = document.getElementById('taskListCard');
      if(card){ card.innerHTML = renderTasksByGoalSection(); attachGlobalEvents(); }
    };
  }

  const sizeDown = document.getElementById('sizeDown');
  if(sizeDown) sizeDown.onclick = ()=> changeTextScale(-0.1);
  const sizeUp = document.getElementById('sizeUp');
  if(sizeUp) sizeUp.onclick = ()=> changeTextScale(0.1);
  const openSettings = document.getElementById('openSettings');
  if(openSettings) openSettings.onclick = ()=>{ settingsOpen=true; syncExportCode=''; syncMsg=null; render(); };

  /* date navigator */
  const prevDay = document.getElementById('prevDay');
  if(prevDay) prevDay.onclick = ()=>{ selectedDate = addDays(selectedDate,-1); render(); };
  const nextDay = document.getElementById('nextDay');
  if(nextDay) nextDay.onclick = ()=>{ selectedDate = addDays(selectedDate,1); render(); };
  const jumpToday = document.getElementById('jumpToday');
  if(jumpToday) jumpToday.onclick = ()=>{ selectedDate = todayStr(); render(); };
  const datePick = document.getElementById('datePick');
  const dateMid = document.getElementById('dateMidClick');
  if(datePick){
    datePick.onchange = ()=>{ if(datePick.value){ selectedDate = datePick.value; render(); } };
    if(dateMid) dateMid.onclick = ()=>{ datePick.showPicker ? datePick.showPicker() : datePick.focus(); };
  }

  document.querySelectorAll('[data-edit-template]').forEach(b=> b.onclick=()=>{
    const dow = parseInt(b.dataset.editTemplate,10);
    const tpl = state.dayTemplates[dow];
    templateDraft = {dow, name:tpl.name, motto:tpl.motto, note:tpl.note, timeLabel:tpl.timeLabel, learning:tpl.learning, learningLink:tpl.learningLink||'', learningDomain:tpl.learningDomain||'', learningMode:tpl.learningMode||''};
    render();
  });

  document.querySelectorAll('[data-habit]').forEach(b=> b.onclick=()=>{
    const habitId = b.dataset.habit;
    const log = getLog(selectedDate);
    const wasDone = !!log.habits[habitId];
    log.habits[habitId] = !wasDone;
    const active = habitsForDow(dowOf(selectedDate));
    saveState();
    if(!wasDone && active.length && active.every(h=>log.habits[h.id])){
      popStamp('يوم متكامل!','ماشاءالله عليك');
    }
    render();
  });

  document.querySelectorAll('[data-goto-habits]').forEach(b=> b.onclick=()=>{ view='habits'; render(); });

  document.querySelectorAll('[data-toggle-collapse]').forEach(el=> el.onclick=()=>{
    const key = el.dataset.toggleCollapse;
    state.collapsed[key] = !state.collapsed[key];
    saveState(); render();
  });

  document.querySelectorAll('[data-homehabit-up]').forEach(b=> b.onclick=()=>{
    moveHabitInDow(parseInt(b.dataset.homehabitDow,10), b.dataset.homehabitUp, -1);
  });
  document.querySelectorAll('[data-homehabit-down]').forEach(b=> b.onclick=()=>{
    moveHabitInDow(parseInt(b.dataset.homehabitDow,10), b.dataset.homehabitDown, 1);
  });

  document.querySelectorAll('[data-gdate]').forEach(b=> b.onclick=()=>{
    const d = b.dataset.gdate, habitId = b.dataset.ghabit;

    log.habits[habitId] = !log.habits[habitId];
    saveState(); render();
  });

document.querySelectorAll('[data-qnote]').forEach(ta=>{
    ta.onchange = ()=>{
      const log = getLog(selectedDate);
      log.commentsById[ta.dataset.qnote] = ta.value;
      saveState();
    };
  });

  document.querySelectorAll('[data-mood]').forEach(b=> b.onclick=()=>{
    const log = getLog(selectedDate);
    const m=b.dataset.mood;
    const i = log.mood.indexOf(m);
    if(i>-1) log.mood.splice(i,1); else log.mood.push(m);
    saveState(); render();
  });

  document.querySelectorAll('[data-toggle]').forEach(b=> b.onclick=()=>{
    const t = state.tasks.find(x=>x.id===b.dataset.toggle);
    if(!t) return;
    /* branch on recurType, not on the weekday array — daily and monthly tasks
       have no weekdays, so checking t.recur sent them down the one-off path and
       flagged them permanently done. taskDoneToday() only ever reads
       lastDoneDate for a recurring task, so they never hid and never came back. */
    if(t.recurType){
      /* record against the day being viewed, matching how a one-off task's doneAt
         already works — ticking an occurrence while browsing another date should
         mark that date, not today */
      const day = selectedDate || todayStr();
      const wasDone = t.lastDoneDate === day;
      t.lastDoneDate = wasDone? null : day;
      saveState();
      if(!wasDone){ popStamp('أنجزتها','ماشاءالله'); }
    }else{
      t.done = !t.done;
      t.doneAt = t.done? selectedDate: null;
      saveState();
      if(t.done){ popStamp('أنجزتها','ماشاءالله'); }

function vqParseDateTime(text){
  const s = text;
  let due = null, period = null;
  if(/بكرة|باجر|غدا(ً)?/.test(s)) due = addDays(todayStr(),1);
  else if(/بعد يومين/.test(s)) due = addDays(todayStr(),2);
  else if(/بعد\s*3\s*أيام|بعد ثلاث أيام/.test(s)) due = addDays(todayStr(),3);
  else if(/الأسبوع (الجاي|القادم)|بعد أسبوع/.test(s)) due = addDays(todayStr(),7);
  else if(/اليوم/.test(s)) due = todayStr();
  else {
    const dayIdx = DOW_NAMES.findIndex(n => s.includes(n));
    if(dayIdx>-1){
      const cur = parseISO(todayStr()).getDay();
      let delta = (dayIdx - cur + 7) % 7;
      if(delta===0) delta = 7;
      due = addDays(todayStr(), delta);
    }
  }
  if(/صباح/.test(s)) period = 'صباح';
  else if(/ظهر/.test(s)) period = 'ظهر';
  else if(/مساء|بالليل|الليل/.test(s)) period = 'مساء';
  else {
    const m = s.match(/الساعة\s*(\d{1,2})/);
    if(m){
      const h = parseInt(m[1],10);
      if(h>=1 && h<=6) period = 'مساء';
      else if(h>=7 && h<=11) period = 'صباح';
      else period = 'ظهر';
    }
  }
  return {due, period};
}
function vqParseCategory(text){
  /* primary: match her actual current category labels directly, so saying
     the category's real name in the text always works — including custom
     categories she renamed or added, not just the handful of legacy
     keywords below */
  const byLabel = state.taskCategories.find(c=> c.label && text.includes(c.label));
  if(byLabel) return byLabel.id;
  /* fallback: legacy keyword synonyms, only if that category id still
     exists (she may have renamed/deleted a default category) */
  let legacy = null;
  if(/مالي|فلوس|فاتورة|بنك|ادخار|مصروف|قرض|راتب/.test(text)) legacy = 'business';
  else if(/مشروع/.test(text)) legacy = 'project';
  else if(/عائل|أطفال|بيت/.test(text)) legacy = 'family';
  else if(/شخصي/.test(text)) legacy = 'personal';
  else if(/عمل|شغل|دوام/.test(text)) legacy = 'work';
  return (legacy && tcatOf(legacy))? legacy : null;
}
function vqParsePriority(text){
  if(/مهم جدا|ضروري|عاجل/.test(text)) return 'عالية';
  if(/لو قدرت|مو مستعجل/.test(text)) return 'منخفضة';
  return 'متوسطة';
}
function vqSplitTasks(raw){
  let parts = raw.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(parts.length<=1){
    const bySentence = raw.split(/[.؛]+/).map(s=>s.trim()).filter(Boolean);
    if(bySentence.length>1) parts = bySentence;
  }
  if(parts.length<=1){
    const byAnd = raw.split(/\s+و\s+/).map(s=>s.trim()).filter(s=>s.length>3);
    if(byAnd.length>1) parts = byAnd;
  }
  if(parts.length===0) parts = [raw.trim()];
  return parts;
}
function vqAnalyze(raw){
  return vqSplitTasks(raw).filter(Boolean).map(p=>{
    const {due, period} = vqParseDateTime(p);
    return {id:uid(), text:p, category: vqParseCategory(p), priority: vqParsePriority(p), period, due, include:true};
  });
}
function startVoiceRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    voiceError = 'التسجيل المباشر ما يدعمه متصفحك — اضغطي أيقونة المايك 🎙️ اللي بلوحة مفاتيح جوالك جوا خانة الكتابة وأملي فيها، وبعدين اضغطي "حلّليها لمهام".';
    render();
    const ta = document.getElementById('voiceDraftInput');
    if(ta) ta.focus();
    return;
  }
  voiceRecognizer = new SR();
  voiceRecognizer.lang = 'ar-SA';
  voiceRecognizer.interimResults = false;
  voiceRecognizer.maxAlternatives = 1;
  voiceRecognizer.onstart = ()=>{ voiceListening = true; voiceError = null; render(); };
  voiceRecognizer.onresult = (e)=>{
    const transcript = Array.from(e.results).map(r=>r[0].transcript).join(' ');
    voiceDraftText = (voiceDraftText? voiceDraftText+' ' : '') + transcript;
  };
  voiceRecognizer.onerror = ()=>{ voiceError = 'ما قدرت أسمع بوضوح، جربي مرة ثانية أو اكتبي.'; voiceListening = false; render(); };
  voiceRecognizer.onend = ()=>{ voiceListening = false; render(); };
  try{ voiceRecognizer.start(); }catch(e){ voiceError = 'صار خطأ بالتسجيل.'; render(); }
}

function importPlanFromText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  lines.forEach(line=>{
    if(line.includes('|')){
      /* strict pipe-delimited format, e.g. copy-pasted from a chat reply */
      const parts = line.split('|').map(p=>p.trim());
      const [textPart, catPart, priPart, perPart, duePart] = parts;
      if(!textPart) return;
      items.push({
        sourceId: uid(),
        text: textPart.replace(/^[-•\d.\)]+\s*/,''),
        category: catPart? vqParseCategory(catPart) : null,
        priority: priPart? vqParsePriority(priPart) : 'متوسطة',
        period: perPart? (/صباح/.test(perPart)?'صباح':/ظهر/.test(perPart)?'ظهر':/مساء/.test(perPart)?'مساء':null) : null,
        due: duePart? (/^\d{4}-\d{2}-\d{2}$/.test(duePart)? duePart : /اليوم|today/i.test(duePart)? todayStr() : /بكرة|غدا|غداً|tomorrow/i.test(duePart)? addDays(todayStr(),1) : /أسبوع|اسبوع|week/i.test(duePart)? addDays(todayStr(),6) : null) : null,
        note: '',
        include: true,
      });
      return;
    }
    /* free-form line or paragraph: split into individual tasks and extract
       date/period/category/priority from natural phrasing, same extraction
       used by the voice quick-add */
    vqSplitTasks(line).filter(Boolean).forEach(part=>{
      const clean = part.replace(/^[-•\d.\)]+\s*/,'');
      if(!clean) return;
      const {due, period} = vqParseDateTime(clean);
      items.push({
        sourceId: uid(),
        text: clean,
        category: vqParseCategory(clean),
        priority: vqParsePriority(clean),
        period, due, note:'', include:true,
      });
    });
  });
  return items;
}
async function runImportPaste(){
  const ta = document.getElementById('importPaste');
  const text = (ta? ta.value : importPasteText).trim();
  importError = null;
  if(!text){ importError = 'الصقي النص أول.'; render(); return; }
  const items = importPlanFromText(text);
  if(items.length===0){ importError = 'ما لقيت مهام بالنص، تأكدي من التنسيق.'; render(); return; }
  aiPlan = items;
  importPasteText = '';
  render();
}

function popStamp(line1, line2){
  const el = document.getElementById('stampPop');
  if(!el) return;
  el.innerHTML = stampSVG(line1, line2);
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 900);
}

/* ============ utils ============ */
function friendlyErr(e){
  const msg = e && e.message ? e.message : '';
  if(!msg) return 'حاولي مرة ثانية بعد شوي.';
  if(/failed to fetch|networkerror|load failed/i.test(msg)){
    return 'ما قدرت أوصل للخدمة (مشكلة اتصال أو حجب من المتصفح). تأكدي من الإنترنت وجربي تحدثين الصفحة.';
  }
  return msg;
}
function escapeHtml(s){
  /* coerce first — a number reaching this (e.g. an amount that round-tripped
     through cloud JSON as a number rather than a string) used to throw and take
     the whole render down with it */
  return String(s==null? '' : s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============ offline support ============ */
/* Registers a tiny service worker (built inline, no separate file needed) that
   caches this page so it keeps opening even with no internet connection. */
async function registerOfflineSupport(){
  if(!('serviceWorker' in navigator)) return;
  try{
    /* one-time cleanup: earlier versions registered the worker from a blob: URL,
       which iOS in particular seemed to get stuck on and never re-check for
       updates. Drop it so the real sw.js file below takes over cleanly. */
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){
      const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL || '';
      if(url.startsWith('blob:')) await reg.unregister();
    }

    const reg = await navigator.serviceWorker.register('sw.js');
    reg.update().catch(()=>{});
    /* mobile PWAs are usually resumed from the background rather than freshly
       loaded, so also re-check whenever the app comes back into view */
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible') reg.update().catch(()=>{});
    });

    let reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(reloadedForUpdate) return;
      reloadedForUpdate = true;
      location.reload();
    });
  }catch(e){ /* ignore — offline caching is a bonus, not required */ }
}
registerOfflineSupport();

/* ============ text size control (A-/A+) ============ */
function applyTextScale(){
  document.documentElement.style.zoom = textScale;
}
function loadTextScale(){
  try{
    const v = parseFloat(localStorage.getItem('plannerTextScale'));
    if(!isNaN(v) && v>0) textScale = v;
  }catch(e){}
  applyTextScale();
}
function changeTextScale(delta){
  textScale = Math.min(1.4, Math.max(0.85, +(textScale+delta).toFixed(2)));
  applyTextScale();
  try{ localStorage.setItem('plannerTextScale', textScale); }catch(e){}
}
loadTextScale();

loadState();
