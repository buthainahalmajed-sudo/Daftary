<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بطل</title>
<meta name="theme-color" content="#0F563A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بطل">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --pitch:#0F563A; --pitch-2:#14724D; --pitch-ink:#0A3626;
  --ink:#16241F; --muted:#6C7C76;
  --bg:#F3F6F4; --card:#FFFFFF; --line:#E2E9E5;
  --gold:#E8A317; --gold-soft:#FDF3DF;
  --brick:#C2603A; --brick-soft:#FBEDE7;
  --sky:#2C7BE5; --sky-soft:#E9F1FD;
  --ok:#1B8A5A; --warn:#B4531E; --rose:#C33B4E;
  --r:16px; --r-sm:11px;
  --shadow:0 1px 2px rgba(16,40,32,.05), 0 6px 18px rgba(16,40,32,.07);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"SF Arabic","Noto Kufi Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
.wrap{max-width:560px; margin:0 auto; padding:0 14px;}

/* ---------- الترويسة ---------- */
.hero{
  background:linear-gradient(160deg,var(--pitch-2),var(--pitch) 62%,var(--pitch-ink));
  color:#fff; padding:calc(14px + env(safe-area-inset-top)) 0 18px;
  position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; inset:auto -20% -60% -20%; height:150px;
  border-radius:50%; border:2px solid rgba(255,255,255,.13);
}
.hero .wrap{position:relative; z-index:1;}
.hero-top{display:flex; align-items:center; gap:10px;}
.hero-top h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.2px; flex:1; min-width:0;}
.hero-top h1 span{opacity:.72; font-weight:600; font-size:14px;}
.iconbtn{
  background:rgba(255,255,255,.14); border:0; color:#fff; width:38px; height:38px;
  border-radius:12px; font-size:17px; cursor:pointer; display:grid; place-items:center;
}
.iconbtn:active{transform:scale(.94);}

.scoreboard{display:flex; gap:8px; margin-top:14px;}
.score{
  flex:1; background:rgba(255,255,255,.12); border-radius:var(--r-sm);
  padding:9px 10px; text-align:center;
}
.score b{display:block; font-size:22px; font-weight:800; line-height:1.2;}
.score small{display:block; font-size:11.5px; opacity:.82;}

.stadium{margin-top:14px;}
.stadium-row{display:flex; align-items:baseline; gap:6px; font-size:13px; margin-bottom:6px;}
.stadium-row b{font-weight:700;} .stadium-row span{opacity:.75; margin-inline-start:auto; font-size:12px;}
.bar{height:11px; border-radius:99px; background:rgba(255,255,255,.18); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#FFD98A,var(--gold)); transition:width .5s;}

/* ---------- البطاقات ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-top:12px; box-shadow:var(--shadow);}
.card h3{margin:0 0 2px; font-size:15.5px; font-weight:800;}
.card .sub{margin:0 0 10px; font-size:12.5px; color:var(--muted);}
.sec-title{display:flex; align-items:center; gap:8px; margin:18px 2px 2px; font-size:13px; font-weight:800; color:var(--muted);}
.sec-title:after{content:""; flex:1; height:1px; background:var(--line);}

/* ---------- المهام ---------- */
.task{
  display:flex; align-items:center; gap:11px; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r); padding:11px 12px; margin-top:9px;
  box-shadow:var(--shadow); transition:border-color .18s, background .18s;
}
.task.done{background:#F3FAF6; border-color:#BFE5D1;}
.task.wait{background:var(--gold-soft); border-color:#F0DDB0;}
.tick{
  width:46px; height:46px; flex:0 0 46px; border-radius:14px; border:2px solid var(--line);
  background:#fff; font-size:22px; display:grid; place-items:center; cursor:pointer;
}
.tick:active{transform:scale(.93);}
.task.done .tick{background:var(--ok); border-color:var(--ok); color:#fff;}
.task.wait .tick{background:var(--gold); border-color:var(--gold); color:#fff;}
.t-body{flex:1; min-width:0;}
.t-body b{display:block; font-size:15px; font-weight:700;}
.t-body small{display:block; font-size:12px; color:var(--muted);}
.pts{
  flex:0 0 auto; background:var(--gold-soft); color:#8A6212; border:1px solid #F0DDB0;
  border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:800; white-space:nowrap;
}
.task.done .pts{background:#DFF3E8; color:#146245; border-color:#BFE5D1;}

.counter{display:flex; align-items:center; gap:8px; margin-top:9px;}
.cups{display:flex; gap:5px; flex-wrap:wrap; flex:1;}
.cup{width:24px; height:30px; border-radius:5px 5px 9px 9px; border:2px solid #CFE0F5; background:#fff;}
.cup.on{background:linear-gradient(180deg,#8FC3FA,#2C7BE5); border-color:#2C7BE5;}
.rnd{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:800;cursor:pointer;line-height:1;}
.rnd:active{transform:scale(.92);}

/* ---------- الأزرار ---------- */
.btn{
  display:block; width:100%; border:0; border-radius:13px; padding:13px;
  background:var(--pitch); color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-top:10px;
}
.btn:active{transform:scale(.985);}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line);}
.btn.gold{background:var(--gold); color:#3D2B06;}
.btn.rose{background:#fff; color:var(--rose); border:1px solid #F0C9CF;}
.btn:disabled{opacity:.45; cursor:default;}
.btn.sm{padding:9px 12px; font-size:13.5px; width:auto; display:inline-block; margin-top:0;}
.row{display:flex; gap:8px; flex-wrap:wrap;}
.row>.btn{margin-top:0;}

/* ---------- المكافآت ---------- */
.reward{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px dashed var(--line);}
.reward:last-child{border-bottom:0;}
.rw-ico{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--brick-soft);display:grid;place-items:center;font-size:21px;}
.rw-body{flex:1;min-width:0;} .rw-body b{display:block;font-size:14.5px;font-weight:700;}
.rw-body small{color:var(--muted); font-size:12px;}
.buy{border:1px solid var(--line); background:#fff; border-radius:11px; padding:8px 12px; font-weight:800; font-size:13px; cursor:pointer; white-space:nowrap;}
.buy.can{background:var(--gold); border-color:var(--gold); color:#3D2B06;}
.buy:disabled{opacity:.4;}

/* ---------- الأسبوع ---------- */
.week{display:flex; gap:5px; justify-content:space-between;}
.day{flex:1; text-align:center; border-radius:12px; padding:8px 2px; background:#fff; border:1px solid var(--line);}
.day.today{border-color:var(--pitch); box-shadow:0 0 0 2px rgba(15,86,58,.1);}
.day small{display:block; font-size:10.5px; color:var(--muted);}
.day b{display:block; font-size:12.5px; font-weight:800; margin-top:3px;}
.ring{width:32px;height:32px;margin:5px auto 0;border-radius:50%;display:grid;place-items:center;font-size:13px;}

/* ---------- متفرقات ---------- */
.pill{display:inline-block; background:var(--sky-soft); color:#1E5FB8; border-radius:99px; padding:3px 10px; font-size:12px; font-weight:700;}
.pill.gold{background:var(--gold-soft); color:#8A6212;}
.pill.ok{background:#DFF3E8; color:#146245;}
.pill.rose{background:#FCE9EC; color:#9B2B3C;}
.muted{color:var(--muted); font-size:12.5px;}
.field{margin-bottom:10px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%; padding:11px; border:1px solid var(--line); border-radius:11px; background:#fff;
}
.ltr{direction:ltr; text-align:left;}
.empty{text-align:center; color:var(--muted); padding:22px 10px; font-size:13.5px;}
.empty .big{font-size:34px; display:block; margin-bottom:6px;}
.lg{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px;}
.lg:last-child{border-bottom:0;}
.lg b{margin-inline-start:auto; font-weight:800; white-space:nowrap;}
.lg b.up{color:var(--ok);} .lg b.dn{color:var(--brick);}

/* ---------- شريط التنقل ---------- */
.nav{
  position:fixed; inset-inline:0; bottom:0; z-index:40; background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px); border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));
}
.nav-in{max-width:560px; margin:0 auto; display:flex;}
.nav button{
  position:relative; flex:1; background:0; border:0; padding:5px 2px; cursor:pointer; color:var(--muted);
  font-size:10.5px; font-weight:700; display:grid; gap:1px; justify-items:center;
}
.nav button i{font-style:normal; font-size:20px; line-height:1.25;}
.nav button.on{color:var(--pitch);}
.nav button .badge{
  position:absolute; transform:translate(-16px,-4px); background:var(--rose); color:#fff;
  border-radius:99px; font-size:10px; padding:0 5px; font-weight:800;
}

/* ---------- نافذة ---------- */
.sheet-bg{position:fixed; inset:0; background:rgba(12,28,22,.45); z-index:60; display:flex; align-items:flex-end;}
.sheet{background:var(--bg); width:100%; max-height:92vh; overflow:auto; border-radius:20px 20px 0 0; padding:16px 14px calc(20px + env(safe-area-inset-bottom));}
@media(min-width:560px){ .sheet-bg{align-items:center;} .sheet{max-width:560px; margin:auto; border-radius:20px;} }
.sheet h2{margin:0 0 12px; font-size:17px; display:flex; align-items:center; gap:8px;}
.sheet h2 button{margin-inline-start:auto; background:0; border:0; font-size:19px; cursor:pointer; color:var(--muted);}

/* ---------- التنبيه ---------- */
.toast{position:fixed; inset-inline:0; bottom:calc(88px + env(safe-area-inset-bottom)); z-index:70; display:flex; justify-content:center; pointer-events:none;}
.toast div{
  background:var(--pitch-ink); color:#fff; padding:10px 18px; border-radius:99px;
  font-weight:800; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:pop .3s ease-out;
}
@keyframes pop{from{transform:translateY(14px) scale(.9); opacity:0;} to{transform:none; opacity:1;}}

/* ---------- شريط الجلسة العائم ---------- */
.timerbar{
  position:fixed; inset-inline:0; bottom:calc(66px + env(safe-area-inset-bottom)); z-index:45;
  display:flex; justify-content:center; padding:0 12px; pointer-events:none;
}
.timerbar > button{
  pointer-events:auto; width:100%; max-width:536px; border:0; cursor:pointer;
  background:linear-gradient(120deg,var(--pitch-2),var(--pitch)); color:#fff;
  border-radius:14px; padding:9px 14px; display:flex; align-items:center; gap:10px;
  box-shadow:0 6px 20px rgba(10,54,38,.3); font-weight:800;
}
.timerbar.over > button{background:linear-gradient(120deg,#C4452F,#9B2B1E);}
.timerbar .tb-time{font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:.5px;}
.timerbar .tb-lbl{font-size:12px; opacity:.85; font-weight:600; margin-inline-start:auto;}

/* ---------- شاشة العدّاد ---------- */
.bigclock{
  text-align:center; padding:8px 0 4px;
  font-size:56px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; line-height:1.1;
}
.bigclock.over{color:var(--rose);}
.ringwrap{position:relative; width:190px; height:190px; margin:6px auto 10px;}
.ringwrap svg{transform:rotate(-90deg);}
.ringwrap .mid{position:absolute; inset:0; display:grid; place-items:center; text-align:center;}
.chips{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:4px;}
.chip{
  border:1px solid var(--line); background:#fff; border-radius:12px; padding:9px 14px;
  font-weight:800; font-size:14px; cursor:pointer;
}
.chip.on{background:var(--pitch); color:#fff; border-color:var(--pitch);}
.chip:disabled{opacity:.35;}

/* ---------- درجات التحكم ---------- */
.stepper{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px;}
.stepper button{
  border:1px solid var(--line); background:#fff; border-radius:11px; padding:9px 12px;
  font-weight:800; font-size:14px; cursor:pointer; min-width:56px;
}
.stepper button.plus{color:var(--ok); border-color:#BFE5D1; background:#F3FAF6;}
.stepper button.minus{color:var(--brick); border-color:#F0D7CB; background:var(--brick-soft);}

/* ---------- اختيار دور الجهاز ---------- */
.gate{min-height:100vh; display:grid; place-items:center; padding:24px 16px;}
.gate .box{max-width:420px; width:100%; text-align:center;}
.gate .pick{
  display:flex; gap:12px; align-items:center; width:100%; text-align:start; cursor:pointer;
  background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:10px;
  box-shadow:var(--shadow);
}
.gate .pick span.ic{font-size:30px;}
.gate .pick b{display:block; font-size:16px;}
.gate .pick small{color:var(--muted); font-size:12.5px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="timerbar" class="timerbar"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
/* =========================================================================
   بطل — تطبيق متابعة وانضباط لطفل
   يتزامن بين الجوالين عبر GitHub Gist، نفس طريقة الربط المستخدمة في دفتري.
   ========================================================================= */

const APP_VERSION   = 'v2';
const CLOUD_FILE    = 'batal-data.json';
const LS_STATE      = 'batalState';
const LS_CLOUD      = 'batalCloudCfg';

/* ---------------------------------------------------------------------
   أدوات صغيرة
   --------------------------------------------------------------------- */
const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = p => (p||'x') + Math.random().toString(36).slice(2,9) + now().toString(36).slice(-4);

function dstr(d){ const x = d||new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function fromStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = fromStr(s); d.setDate(d.getDate()+n); return dstr(d); }
function today(){ return dstr(); }
const DAY_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DAY_SHORT = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
function dow(s){ return fromStr(s).getDay(); }
function niceDate(s){ const d = fromStr(s); return DAY_AR[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1); }
/* صياغة عربية سليمة للمفرد والمثنى والجمع */
function arabicCount(n, one, two, few, many){
  if(n === 1) return one;
  if(n === 2) return two;
  if(n >= 3 && n <= 10) return n + ' ' + few;
  return n + ' ' + many;
}
function mins(n){
  n = Math.round(n);
  if(n <= 0) return 'صفر دقيقة';
  if(n < 60) return arabicCount(n, 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
  const h = Math.floor(n/60), m = n % 60;
  return arabicCount(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة') + (m ? ' و' + m + ' د' : '');
}
function minsShort(n){
  n = Math.round(n);
  if(n < 60) return n + 'د';
  const h = Math.floor(n/60), m = n % 60;
  return h + 'س' + (m ? ' ' + m + 'د' : '');
}

/* ---------------------------------------------------------------------
   الحالة
   --------------------------------------------------------------------- */
/* المهام: days = أرقام أيام الأسبوع (0 الأحد … 6 السبت)
   kind: 'check' مهمة تُعلَّم مرة واحدة، 'count' مهمة بعدّاد (الماء) */
function defaultTasks(){ return [
  {id:'water',   emoji:'💧', title:'شرب الماي',                  pts:1,  kind:'count', target:6, days:[0,1,2,3,4,5,6], note:'كل كوب = نقطة'},
  {id:'break',   emoji:'🍳', title:'فطور فيه بيضة',              pts:10, kind:'check', days:[0,1,2,3,4,5,6], note:'وقود البطل قبل المدرسة'},
  {id:'dinner',  emoji:'🍽️', title:'العشاء',                      pts:5,  kind:'check', days:[0,1,2,3,4,5,6], note:''},
  {id:'room',    emoji:'🎒', title:'ملابسي وشنطتي مكانهم',        pts:10, kind:'check', days:[0,1,2,3,4],     note:'أول ما أرجع من المدرسة'},
  {id:'hw',      emoji:'✏️', title:'الواجبات',                    pts:15, kind:'check', days:[0,1,2,3,4],     note:'أكبر نقاط في اليوم'},
  {id:'bag',     emoji:'📚', title:'تجهيز شنطة بكرة',             pts:10, kind:'check', days:[0,1,2,3],       note:'قبل النوم'},
  {id:'dishes',  emoji:'🧽', title:'ترتيب الأواني',               pts:5,  kind:'check', days:[0,1,2,3,4,5,6], note:''},
  {id:'sunprep', emoji:'👕', title:'تجهيز ملابس وشنطة الأحد',     pts:20, kind:'check', days:[6],             note:'ليلة السبت — يريّح الأسبوع كله'},
];}

function defaultRewards(){ return [
  {id:'r30',  emoji:'📱', title:'٣٠ دقيقة على الجهاز',     cost:25,  type:'minutes', minutes:30},
  {id:'r60',  emoji:'🎮', title:'ساعة على الجهاز',          cost:45,  type:'minutes', minutes:60},
  {id:'r120', emoji:'🕹️', title:'ساعتين في نهاية الأسبوع', cost:80,  type:'minutes', minutes:120},
  {id:'rball',emoji:'⚽', title:'ساعة كورة مع بابا/الملعب',  cost:120, type:'thing'},
  {id:'rlego',emoji:'🧱', title:'قطعة بناء صغيرة',           cost:250, type:'thing'},
  {id:'rout', emoji:'🎟️', title:'خرجة أو حضور مباراة',       cost:450, type:'thing'},
  {id:'rbig', emoji:'🏗️', title:'طقم بناء كبير أو حذاء كورة',cost:900, type:'thing'},
];}

function defaultState(){ return {
  v: 1,
  child: {name:'', emoji:'⚽'},
  tasks: defaultTasks(),
  rewards: defaultRewards(),
  ledger: [],                         /* مصدر الحقيقة الوحيد للنقاط */
  session: null,                      /* جلسة الأجهزة الجارية، مشتركة بين الجهازين */
  capBonus: {},                       /* منح تتجاوز الحد اليومي: {'YYYY-MM-DD': دقائق} */
  settings: {
    pin:'1234', approve:true, startedOn: today(),
    capSchool:60,                     /* حد الأحد–الخميس */
    capWeekend:180,                   /* حد الجمعة والسبت */
    warnMin:5                         /* صافرة تنبيه قبل النهاية */
  },
  tasksAt: now(), rewardsAt: now(), settingsAt: now(), childAt: now(), sessionAt: now(), capBonusAt: now(),
  _pendingSync: false
};}

let state = defaultState();
let mode  = 'child';                  /* child | parent */
let tab   = 'today';
let viewDay = today();

/* ---------------------------------------------------------------------
   دفتر الحركات — كل نقطة في التطبيق أصلها سطر هنا
   e = {id, at, kind, pts, min, ok, void, ...}
   kind: task | bonus | redeem | use | adjust
   --------------------------------------------------------------------- */
function entry(id){ return state.ledger.find(e => e.id === id); }
function live(){ return state.ledger.filter(e => !e.void); }
function counted(e){ return !e.void && (e.kind !== 'task' && e.kind !== 'bonus' ? true : e.ok !== false); }

function balance(){ return live().reduce((s,e) => s + (counted(e) ? (e.pts||0) : 0), 0); }
function lifetime(){ return live().reduce((s,e) => s + (counted(e) && (e.pts||0) > 0 ? e.pts : 0), 0); }
function minutesLeft(){ return live().reduce((s,e) => s + (e.min||0), 0); }
function pending(){ return state.ledger.filter(e => !e.void && (e.kind === 'task' || e.kind === 'bonus') && e.ok === false); }
function waitingThings(){ return state.ledger.filter(e => !e.void && e.kind === 'redeem' && e.status === 'wait'); }
function overruns(){ return state.ledger.filter(e => !e.void && e.kind === 'use' && (e.over||0) > 0 && e.seen === false); }

function putEntry(e){
  const i = state.ledger.findIndex(x => x.id === e.id);
  e.at = now();
  if(i >= 0) state.ledger[i] = Object.assign({}, state.ledger[i], e);
  else state.ledger.push(e);
  save();
}

/* ---------------------------------------------------------------------
   المهام واليوم
   --------------------------------------------------------------------- */
function tasksFor(day){ const d = dow(day); return state.tasks.filter(t => (t.days||[]).includes(d)); }
function taskById(id){ return state.tasks.find(t => t.id === id); }
function tKey(day, id){ return 't:' + day + ':' + id; }

function taskState(day, t){
  const e = entry(tKey(day, t.id));
  if(!e || e.void) return {n:0, done:false, ok:false, pts:0};
  const n = t.kind === 'count' ? (e.n||0) : 1;
  const full = t.kind === 'count' ? n >= (t.target||1) : true;
  return {n, done:full, ok:e.ok !== false, pts:e.pts||0, half: t.kind==='count' && n>0 && !full};
}

function maxPts(day){ return tasksFor(day).reduce((s,t) => s + (t.kind==='count' ? t.pts*(t.target||1) : t.pts), 0); }
function gotPts(day){
  return tasksFor(day).reduce((s,t) => { const e = entry(tKey(day,t.id)); return s + (e && !e.void ? (e.pts||0) : 0); }, 0);
}
function dayComplete(day){
  const list = tasksFor(day);
  if(!list.length) return false;
  return list.every(t => { const st = taskState(day, t); return st.done && st.ok; });
}

function toggleTask(day, id){
  const t = taskById(id); if(!t) return;
  if(t.kind === 'count'){ stepWater(day, id, 1); return; }
  const key = tKey(day, id);
  const e = entry(key);
  const needsOk = !!state.settings.approve;
  if(e && !e.void){
    putEntry({id:key, void:true});
  } else {
    putEntry({id:key, kind:'task', day, task:id, n:1, pts:t.pts, ok: needsOk ? false : true, void:false});
    cheer(needsOk ? 'وصلت لأمك ✅' : '+' + t.pts + ' نقطة! ⚽');
  }
  sweepBonuses();
  render(); queuePush();
}
function stepWater(day, id, dir){
  const t = taskById(id); if(!t) return;
  const key = tKey(day, id); const e = entry(key);
  const cur = e && !e.void ? (e.n||0) : 0;
  const n = Math.max(0, Math.min(cur + dir, t.target||1));
  if(n === cur) return;
  if(n === 0) putEntry({id:key, void:true});
  else putEntry({id:key, kind:'task', day, task:id, n, pts:n*t.pts, ok: state.settings.approve ? (e && !e.void ? e.ok !== false : false) : true, void:false});
  if(dir > 0 && n >= (t.target||1)) cheer('كمّلت الماي! 💧');
  sweepBonuses(); render(); queuePush();
}

/* ---------------------------------------------------------------------
   المكافآت التلقائية: يوم كامل + سلاسل الأيام
   المعرّفات ثابتة، فإعادة الحساب ما تكرر شيء ولا ترجّع شيء ألغته الأم.
   --------------------------------------------------------------------- */
const PERFECT_BONUS = 10;
const STREAK_BONUS  = {3:15, 5:25, 7:40, 14:60, 21:80, 30:120};

function streakEndingAt(day){
  let n = 0, d = day;
  for(let i = 0; i < 60; i++){
    if(!tasksFor(d).length){ d = addDays(d, -1); continue; }   /* يوم بلا مهام ما يكسر السلسلة */
    if(dayComplete(d)){ n++; d = addDays(d, -1); } else break;
  }
  return n;
}
/* مكافآت اليوم الكامل والسلسلة تُشتق من حالة اليوم، فهي تنسحب لما تسحب الأم
   تأكيدها وترجع من نفسها لما ترجع المهمة — لا تُترك ملغاة بعد ما اكتمل اليوم. */
function setBonus(id, day, pts, note, want){
  const e = entry(id);
  if(want){
    if(!e) putEntry({id, kind:'bonus', day, pts, note, ok:true, void:false});
    else if(e.void || e.pts !== pts) putEntry({id, kind:'bonus', day, pts, note, ok:true, void:false});
  } else if(e && !e.void) putEntry({id, void:true});
}
function sweepBonuses(){
  for(let i = 0; i < 21; i++){
    const day = addDays(today(), -i);
    const full = dayComplete(day);
    setBonus('b:' + day + ':perfect', day, PERFECT_BONUS, 'يوم كامل', full);
    const s = full ? streakEndingAt(day) : 0;
    /* كل درجات السلسلة تُراجَع، فالدرجة اللي ما عادت صحيحة تنسحب */
    Object.keys(STREAK_BONUS).forEach(k => {
      const n = Number(k);
      setBonus('b:' + day + ':streak' + n, day, STREAK_BONUS[n], 'سلسلة ' + n + ' أيام', s === n);
    });
    if(s > 30 && s % 7 === 0) setBonus('b:' + day + ':streak' + s, day, 120, 'سلسلة ' + s + ' يوم', true);
  }
}

/* =====================================================================
   الصافرات — تُولَّد بـ WebAudio، بلا ملفات صوت
   صافرة حكم: ضجيج عبر مرشّح ضيق + نغمة فيها رعشة، تمامًا كصوت الصفّارة.
   ===================================================================== */
const Sound = (function(){
  let ctx = null, keeper = null, keeperUrl = null;

  function unlock(){
    try{
      if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ctx = new AC(); }
      if(ctx && ctx.state === 'suspended') ctx.resume();
    }catch(e){}
    return ctx;
  }
  function ready(){ return !!(ctx && ctx.state === 'running'); }

  function blow(when, dur, base){
    const c = ctx; if(!c) return;
    const n = Math.max(1, Math.ceil(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const data = buf.getChannelData(0);
    for(let i = 0; i < n; i++) data[i] = Math.random()*2 - 1;
    const noise = c.createBufferSource(); noise.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = base; bp.Q.value = 16;
    const ng = c.createGain(); ng.gain.value = 0.4;
    noise.connect(bp); bp.connect(ng);

    const osc = c.createOscillator(); osc.type = 'sine'; osc.frequency.value = base;
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 24;   /* الرعشة */
    const lg  = c.createGain(); lg.gain.value = 60;
    lfo.connect(lg); lg.connect(osc.frequency);
    const og = c.createGain(); og.gain.value = 0.45;
    osc.connect(og);

    const out = c.createGain(); ng.connect(out); og.connect(out); out.connect(c.destination);
    out.gain.setValueAtTime(0.0001, when);
    out.gain.exponentialRampToValueAtTime(0.9, when + 0.02);
    out.gain.setValueAtTime(0.9, when + Math.max(0.04, dur - 0.07));
    out.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    noise.start(when); noise.stop(when + dur);
    osc.start(when);   osc.stop(when + dur);
    lfo.start(when);   lfo.stop(when + dur);
  }

  /* start: صافرة بداية · warn: صافرتان قصيرتان · end: صافرة النهاية الثلاثية */
  function play(kind){
    const c = unlock(); if(!c) return false;
    const t = c.currentTime + 0.05;
    if(kind === 'start'){ blow(t, 0.6, 3150); }
    else if(kind === 'warn'){ blow(t, 0.16, 3300); blow(t + 0.26, 0.16, 3300); }
    else { blow(t, 0.22, 3150); blow(t + 0.32, 0.22, 3150); blow(t + 0.64, 0.95, 2950); }
    try{ navigator.vibrate && navigator.vibrate(kind === 'end' ? [180,90,180,90,420] : kind === 'warn' ? [90,70,90] : 140); }catch(e){}
    return true;
  }

  /* نغمة شبه صامتة تدور في الخلفية عشان النظام ما يجمّد الصفحة أثناء الجلسة.
     ما تضمن الرنّة وهو داخل لعبة، لكنها ترفع الاحتمال كثيرًا. */
  function silentWav(){
    const sr = 8000, n = sr;                      /* ثانية واحدة تتكرر */
    const bytes = 44 + n*2, b = new ArrayBuffer(bytes), v = new DataView(b);
    const put = (o,s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
    put(0,'RIFF'); v.setUint32(4, bytes-8, true); put(8,'WAVEfmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    put(36,'data'); v.setUint32(40, n*2, true);
    for(let i = 0; i < n; i++) v.setInt16(44 + i*2, Math.round(Math.sin(i/sr*2*Math.PI*50) * 10), true);
    return URL.createObjectURL(new Blob([b], {type:'audio/wav'}));
  }
  function keepAlive(on){
    try{
      if(on){
        if(!keeper){
          keeperUrl = silentWav();
          keeper = new Audio(keeperUrl);
          keeper.loop = true; keeper.volume = 0.02;
          keeper.setAttribute('playsinline','');
        }
        keeper.play().catch(()=>{});
        if('mediaSession' in navigator){
          try{
            navigator.mediaSession.metadata = new MediaMetadata({title:'وقت الأجهزة', artist:'بطل'});
            navigator.mediaSession.playbackState = 'playing';
          }catch(e){}
        }
      } else if(keeper){
        keeper.pause();
        if('mediaSession' in navigator) try{ navigator.mediaSession.playbackState = 'none'; }catch(e){}
      }
    }catch(e){}
  }
  return {unlock, ready, play, keepAlive};
})();

/* شاشة الجوال تبقى صاحية أثناء الجلسة، عشان العدّاد ما ينام */
let wakeLock = null;
async function holdScreen(on){
  try{
    if(on && 'wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}

/* =====================================================================
   جلسة الأجهزة
   ===================================================================== */
const LS_RUNG = 'batalRung';                      /* أي صافرة رنّت على هذا الجهاز */
function rungOf(id){
  try{ return (JSON.parse(localStorage.getItem(LS_RUNG) || '{}')[id]) || {}; }catch(e){ return {}; }
}
function setRung(id, r){
  try{ const all = JSON.parse(localStorage.getItem(LS_RUNG) || '{}'); all[id] = r;
       const keys = Object.keys(all); if(keys.length > 20) delete all[keys[0]];
       localStorage.setItem(LS_RUNG, JSON.stringify(all)); }catch(e){}
}

function isWeekend(day){ const d = dow(day); return d === 5 || d === 6; }
function dayCap(day){
  const s = state.settings;
  return (isWeekend(day) ? (s.capWeekend||0) : (s.capSchool||0)) + Number((state.capBonus||{})[day] || 0);
}
function usedToday(){
  return live().filter(e => e.kind === 'use' && e.day === today())
               .reduce((s,e) => s + Math.abs(e.min||0), 0);
}
/* أقصى ما يقدر يشغّله الآن: رصيده، والباقي من حد اليوم */
function allowanceNow(){
  const capLeft = Math.max(0, dayCap(today()) - usedToday());
  return Math.max(0, Math.min(minutesLeft(), capLeft));
}
const OVER_CAP = 60;                              /* أقصى تجاوز يُحسب لو نسي يوقف */

function sessionEndAt(s){ return s.startAt + (s.allowMin||0) * 60000; }
function sessionLeftMs(){ const s = state.session; return s && !s.endedAt ? sessionEndAt(s) - now() : 0; }
function sessionActive(){ return !!(state.session && !state.session.endedAt); }
function elapsedMin(s){ return Math.max(0, Math.round((now() - s.startAt) / 60000)); }

function startSession(minutes, by){
  const allow = Math.max(1, Math.min(minutes, allowanceNow()));
  if(allow <= 0){ cheer('ما فيه رصيد وقت'); return; }
  state.session = {id: uid('s'), startAt: now(), allowMin: allow, by: by || 'child', endedAt: null};
  state.sessionAt = now(); saveNow();
  Sound.unlock(); Sound.play('start'); Sound.keepAlive(true); holdScreen(true);
  const r = rungOf(state.session.id); r.start = 1; setRung(state.session.id, r);
  scheduleAlarms();
  render(); queuePush();
}

function stopSession(reason){
  const s = state.session; if(!s || s.endedAt) return;
  const allow = s.allowMin || 0;
  const raw = elapsedMin(s);
  const used = Math.min(raw, allow + OVER_CAP);       /* جلسة منسيّة ما تاكل الرصيد كله */
  const over = Math.max(0, used - allow);
  s.endedAt = now(); s.usedMin = used; s.overMin = over;
  state.sessionAt = now();
  if(used > 0){
    putEntry({id:'s:' + s.id, kind:'use', day: today(), pts:0, min:-used,
              over, seen: over > 0 ? false : true,
              note: (reason === 'auto' ? 'انتهى الوقت تلقائيًا' : 'جلسة أجهزة'), void:false});
  }
  state.session = null; state.sessionAt = now(); saveNow();
  Sound.keepAlive(false); holdScreen(false);
  clearAlarms();
  render(); queuePush();
}

/* المؤقتات المحلية للصافرات، تُعاد جدولتها عند كل فتح للتطبيق */
let alarmTimers = [];
function clearAlarms(){ alarmTimers.forEach(clearTimeout); alarmTimers = []; }
function scheduleAlarms(){
  clearAlarms();
  const s = state.session; if(!s || s.endedAt) return;
  const endAt = sessionEndAt(s);
  const warnAt = endAt - Math.max(0, (state.settings.warnMin||0)) * 60000;
  const r = rungOf(s.id);
  if(!r.warn && warnAt > now()) alarmTimers.push(setTimeout(checkAlarms, warnAt - now() + 200));
  if(!r.end  && endAt  > now()) alarmTimers.push(setTimeout(checkAlarms, endAt  - now() + 200));
}
/* تُستدعى كل ثانية أثناء الجلسة، وعند الرجوع للتطبيق، وبعد كل سحب من السحاب.
   الاعتماد على وقت البداية المطلق، فحتى لو نام الجوال ترنّ لحظة ما يصحى. */
function checkAlarms(){
  const s = state.session;
  if(!s || s.endedAt) return;
  const r = rungOf(s.id);
  const endAt = sessionEndAt(s);
  const warnAt = endAt - Math.max(0, (state.settings.warnMin||0)) * 60000;
  let touched = false;

  if(!r.start){                                    /* الجهاز الثاني علم بالجلسة الآن */
    if(now() - s.startAt < 120000) Sound.play('start');
    r.start = 1; touched = true;
    Sound.keepAlive(true); holdScreen(true);
  }
  if(!r.warn && now() >= warnAt){
    if(now() < endAt) Sound.play('warn');
    r.warn = 1; touched = true;
  }
  if(!r.end && now() >= endAt){
    Sound.play('end'); r.end = 1; touched = true;
  }
  if(touched){ setRung(s.id, r); scheduleAlarms(); }

  /* جلسة منسيّة: تُقفل من نفسها بعد سقف التجاوز */
  if(now() > endAt + OVER_CAP * 60000) stopSession('auto');
}

/* ---------------------------------------------------------------------
   الملعب — مستويات البناء
   --------------------------------------------------------------------- */
const LEVELS = [
  {p:0,    name:'اخترنا الأرض',  icon:'🟫'},
  {p:250,  name:'الأساسات',      icon:'🧱'},
  {p:600,  name:'المدرجات',      icon:'🏗️'},
  {p:1000, name:'العشب',         icon:'🌱'},
  {p:1500, name:'الأضواء',       icon:'💡'},
  {p:2200, name:'المرمى',        icon:'🥅'},
  {p:3000, name:'الملعب جاهز',   icon:'🏟️'},
  {p:5000, name:'نجم الملعب',    icon:'🏆'},
];
function levelInfo(){
  const lt = lifetime();
  let i = 0; while(i + 1 < LEVELS.length && lt >= LEVELS[i+1].p) i++;
  const cur = LEVELS[i], next = LEVELS[i+1] || null;
  const from = cur.p, to = next ? next.p : cur.p;
  const pct = next ? Math.min(100, Math.round((lt - from) / (to - from) * 100)) : 100;
  return {cur, next, pct, lt, left: next ? to - lt : 0};
}

/* ---------------------------------------------------------------------
   الحفظ والتحميل
   --------------------------------------------------------------------- */
let saveTimer = null, lastSaveAt = 0;
function save(){
  state._touchedAt = now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); lastSaveAt = now(); }
    catch(e){ console.error('تعذر الحفظ', e); }
  }, 60);
}
function saveNow(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); lastSaveAt = now(); }catch(e){} }

function hydrate(raw){
  const s = Object.assign(defaultState(), raw || {});
  if(!Array.isArray(s.tasks) || !s.tasks.length) s.tasks = defaultTasks();
  if(!Array.isArray(s.rewards) || !s.rewards.length) s.rewards = defaultRewards();
  if(!Array.isArray(s.ledger)) s.ledger = [];
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  s.child = Object.assign({name:'', emoji:'⚽'}, s.child || {});
  state = s;
}
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_STATE); if(raw) hydrate(JSON.parse(raw)); }
  catch(e){ console.error('تعذرت القراءة', e); }
}
/* دفتر الحركات يتقلّم بعد ١٨٠ يوم عشان ما يكبر بلا نهاية */
function prune(){
  const cut = addDays(today(), -180);
  const before = state.ledger.length;
  state.ledger = state.ledger.filter(e => !e.day || e.day >= cut || (now() - (e.at||0)) < 1000*60*60*24*180);
  if(state.ledger.length !== before) save();
}

/* ---------------------------------------------------------------------
   الدمج بين جهازين — آخر كتابة تفوز لكل سطر على حدة
   --------------------------------------------------------------------- */
function mergeStates(theirs){
  let changed = 0;
  const mine = new Map(state.ledger.map(e => [e.id, e]));
  (theirs.ledger || []).forEach(t => {
    const m = mine.get(t.id);
    if(!m){ state.ledger.push(t); changed++; }
    else if((t.at||0) > (m.at||0)){ Object.assign(m, t); changed++; }
  });
  ['tasks','rewards'].forEach(k => {
    const stamp = k + 'At';
    if((theirs[stamp]||0) > (state[stamp]||0) && Array.isArray(theirs[k])){
      state[k] = theirs[k]; state[stamp] = theirs[stamp]; changed++;
    }
  });
  if((theirs.settingsAt||0) > (state.settingsAt||0) && theirs.settings){
    state.settings = Object.assign(state.settings, theirs.settings); state.settingsAt = theirs.settingsAt; changed++;
  }
  if((theirs.childAt||0) > (state.childAt||0) && theirs.child){
    state.child = theirs.child; state.childAt = theirs.childAt; changed++;
  }
  /* الجلسة حالة واحدة مشتركة: أحدث كتابة تحكم، فبدء أو إيقاف من أي جهاز يصل للثاني */
  if((theirs.sessionAt||0) > (state.sessionAt||0)){
    state.session = theirs.session || null; state.sessionAt = theirs.sessionAt; changed++;
  }
  if((theirs.capBonusAt||0) > (state.capBonusAt||0) && theirs.capBonus){
    state.capBonus = theirs.capBonus; state.capBonusAt = theirs.capBonusAt; changed++;
  }
  if(changed) saveNow();
  return changed;
}

/* ---------------------------------------------------------------------
   الربط بالسحاب — GitHub Gist (نفس طريقة دفتري)
   --------------------------------------------------------------------- */
let cloud = {token:'', gistId:'', linked:false, baseVersion:null};
let cloudStatus = 'idle', cloudMsg = '', cloudLastSync = null, pushInFlight = 0, pushTimer = null;

function loadCloud(){ try{ const raw = localStorage.getItem(LS_CLOUD); if(raw) cloud = Object.assign(cloud, JSON.parse(raw)); }catch(e){} }
function saveCloud(){ try{ localStorage.setItem(LS_CLOUD, JSON.stringify(cloud)); }catch(e){} }
function ghHead(extra){ return Object.assign({'Authorization':'token ' + cloud.token, 'Accept':'application/vnd.github+json'}, extra||{}); }
function setBase(v){ cloud.baseVersion = v || null; saveCloud(); }
function friendly(e){
  const m = (e && e.message) || 'صار خطأ';
  if(/401|403/.test(m)) return 'التوكن غير صحيح أو منتهي.';
  if(/404/.test(m)) return 'ما لقيت الـ Gist بهذا المعرّف.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'ما فيه اتصال بالإنترنت.';
  return m;
}

async function cloudPull(opts){
  if(!cloud.linked && !(opts && opts.probe)) return false;
  if(!cloud.token || !cloud.gistId) return false;
  cloudStatus = 'syncing'; cloudMsg = ''; paintSync();
  try{
    const res = await fetch('https://api.github.com/gists/' + cloud.gistId, {headers: ghHead(), cache:'no-store'});
    if(!res.ok) throw new Error('فشل الاتصال بالسحاب (كود ' + res.status + ')');
    const data = await res.json();
    const file = data.files && data.files[CLOUD_FILE];
    if(file){
      const parsed = JSON.parse(file.content || '{}');
      if(parsed && typeof parsed === 'object'){
        if(opts && opts.replace){ hydrate(parsed); saveNow(); }
        else { const c = mergeStates(parsed); if(c) state._pendingSync = true; }
      }
    }
    setBase((data.history && data.history[0] && data.history[0].version) || null);
    cloudStatus = 'synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud pull', e);
    cloudStatus = 'error'; cloudMsg = friendly(e);
    return false;
  }finally{ paintSync(); }
}

async function cloudPush(){
  if(!cloud.linked || !cloud.token || !cloud.gistId) return false;
  cloudStatus = 'syncing'; cloudMsg = ''; pushInFlight++; paintSync();
  try{
    /* اقرأ قبل ما ترفع: لو الجهاز الثاني رفع شيء، ندمجه أول عشان الرفع ما يمسحه */
    const head = await fetch('https://api.github.com/gists/' + cloud.gistId, {headers: ghHead(), cache:'no-store'});
    if(!head.ok) throw new Error('ما قدرت أقرأ نسخة السحاب قبل الرفع (كود ' + head.status + ')');
    const info = await head.json();
    const remote = (info.history && info.history[0] && info.history[0].version) || null;
    if(remote && remote !== cloud.baseVersion){
      const f = info.files && info.files[CLOUD_FILE];
      let theirs = null; try{ theirs = JSON.parse((f && f.content) || '{}'); }catch(e){}
      if(theirs && typeof theirs === 'object') mergeStates(theirs);
      setBase(remote);
    }
    const body = JSON.stringify({files: {[CLOUD_FILE]: {content: JSON.stringify(state)}}});
    const res = await fetch('https://api.github.com/gists/' + cloud.gistId, {method:'PATCH', headers: ghHead({'Content-Type':'application/json'}), body});
    if(!res.ok) throw new Error('فشل الرفع للسحاب (كود ' + res.status + ')');
    try{ const saved = await res.json(); setBase((saved.history && saved.history[0] && saved.history[0].version) || cloud.baseVersion); }catch(e){}
    state._pendingSync = false; saveNow();
    cloudStatus = 'synced'; cloudLastSync = new Date();
    return true;
  }catch(e){
    console.error('cloud push', e);
    state._pendingSync = true; saveNow();
    cloudStatus = 'error'; cloudMsg = friendly(e);
    setTimeout(() => { if(cloud.linked && state._pendingSync) cloudPush(); }, 30000);
    return false;
  }finally{ pushInFlight--; paintSync(); }
}

function queuePush(){
  if(!cloud.linked) return;
  state._pendingSync = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudPush, 1500);
}
function startAutoSync(){
  if(window.__autoSync) return; window.__autoSync = true;
  const tick = () => {
    if(!cloud.linked || document.visibilityState !== 'visible') return;
    if(pushInFlight > 0 || (now() - lastSaveAt) < 4000) return;
    cloudPull().then(() => {
      checkAlarms(); scheduleAlarms();
      const a = document.activeElement;
      const busy = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName);
      if(!busy && !$('#modal').innerHTML) render(); else { paintSync(); paintTimer(); }
    });
  };
  /* أثناء الجلسة نسحب كل ١٠ ثوانٍ عشان الجهاز الثاني يعرف البداية والإيقاف بسرعة،
     وبقية الوقت كل ٥٠ ثانية زي ما كان */
  let n = 0;
  setInterval(() => { n++; if(sessionActive() || n % 5 === 0) tick(); }, 10000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState !== 'visible') return;
    checkAlarms(); scheduleAlarms();
    if(sessionActive()) holdScreen(true);
    tick();
  });
}
function paintSync(){
  const el = $('#syncLine'); if(!el) return;
  el.innerHTML = syncLabel();
}
function syncLabel(){
  if(!cloud.linked) return '<span class="pill rose">غير مرتبط</span>';
  if(cloudStatus === 'syncing') return '<span class="pill">يتزامن…</span>';
  if(cloudStatus === 'error') return '<span class="pill rose">' + esc(cloudMsg || 'ما تزامن') + '</span>';
  if(state._pendingSync) return '<span class="pill gold">باقي رفع</span>';
  return '<span class="pill ok">متزامن</span>';
}

/* شريط الجلسة — عنصر مستقل عن render عشان يتحدّث كل ثانية بدون ما يعيد رسم الصفحة */
function fmtClock(ms){
  const neg = ms < 0; const t = Math.floor(Math.abs(ms)/1000);
  const m = Math.floor(t/60), s = t % 60;
  return (neg ? '−' : '') + m + ':' + String(s).padStart(2,'0');
}
function paintTimer(){
  const bar = $('#timerbar'); if(!bar) return;
  if(!role || !sessionActive()){ bar.innerHTML = ''; bar.className = 'timerbar'; return; }
  const left = sessionLeftMs();
  bar.className = 'timerbar' + (left <= 0 ? ' over' : '');
  bar.innerHTML = `<button data-gototimer="1">
    <span style="font-size:18px;">${left <= 0 ? '🔔' : '⏱️'}</span>
    <span class="tb-time">${fmtClock(left)}</span>
    <span class="tb-lbl">${left <= 0 ? 'خلص الوقت — أوقفوا اللعب' : 'وقت الأجهزة شغّال'}</span>
  </button>`;
  const big = $('#bigclock');
  if(big){ big.textContent = fmtClock(left); big.className = 'bigclock' + (left <= 0 ? ' over' : ''); }
  const arc = $('#clockArc');
  if(arc){
    const s = state.session, total = (s.allowMin||1) * 60000;
    const frac = Math.max(0, Math.min(1, left / total));
    const C = 2 * Math.PI * 84;

    arc.setAttribute('stroke-dashoffset', C * (1 - frac));
    arc.setAttribute('stroke', left <= 0 ? '#C33B4E' : '#E8A317');
  }
}

function taskCard(day, t){
  const st = taskState(day, t);
  const cls = st.done ? (st.ok ? 'done' : 'wait') : (st.half ? 'wait' : '');

  if(t.kind === 'count'){
    const cups = Array.from({length:t.target||1}, (_,i) => `<span class="cup ${i < st.n ? 'on':''}"></span>`).join('');
    return `<div class="task ${cls}">
      <div class="tick" style="cursor:default;">${tickIcon}</div>

        <b>${esc(t.title)}</b>

    <div class="t-body"><b>${esc(t.title)}</b><small>${st.done && !st.ok ? 'بانتظار تأكيد أمك' : (t.note ? esc(t.note) : '&nbsp;')}</small></div>

}

function weekView(){
  const start = addDays(today(), -dow(today()));       /* الأحد */
  let cells = '';
  for(let i = 0; i < 7; i++){
    const d = addDays(start, i);
    const max = maxPts(d), got = gotPts(d);
    const pct = max ? Math.min(100, Math.round(got/max*100)) : 0;
    const future = d > today();
    const bg = future ? '#F2F4F3' : pct >= 100 ? '#1B8A5A' : pct >= 60 ? '#E8A317' : pct > 0 ? '#F0DDB0' : '#EDF0EE';
    const fg = (!future && pct >= 60) ? '#fff' : 'var(--muted)';
    cells += `<div class="day ${d===today()?'today':''}">
      <small>${DAY_SHORT[dow(d)]}</small>
      <div class="ring" style="background:${bg};color:${fg};">${future ? '·' : pct >= 100 ? '★' : pct + ''}</div>
      <b>${future ? '' : got}</b>
    </div>`;
  }
  const weekPts = Array.from({length:7}, (_,i) => gotPts(addDays(start,i))).reduce((a,b)=>a+b,0);

  /* أفضل وأضعف مهمة خلال ١٤ يوم */
  const stats = state.tasks.map(t => {
    let due = 0, done = 0;
    for(let i = 0; i < 14; i++){ const d = addDays(today(), -i);
      if(!(t.days||[]).includes(dow(d))) continue; due++; if(taskState(d,t).done) done++; }
    return {t, due, done, pct: due ? Math.round(done/due*100) : 0};
  }).filter(x => x.due);
  stats.sort((a,b) => b.pct - a.pct);

  return `<div class="card" style="margin-top:14px;">
      <h3>أسبوعي</h3><p class="sub">مجموع الأسبوع ${weekPts} نقطة</p>
      <div class="week">${cells}</div>
    </div>
    <div class="card">
      <h3>وش أقوى شي عندي؟</h3><p class="sub">آخر ١٤ يوم</p>
      ${stats.map(s => `<div class="lg"><span>${s.t.emoji}</span><span>${esc(s.t.title)}</span>
        <b class="${s.pct>=80?'up':(s.pct<50?'dn':'')}">${s.pct}%</b></div>`).join('')}
    </div>`;
}

function reportView(){
  const days = Array.from({length:14}, (_,i) => addDays(today(), -13+i));
  const earned = live().filter(e => (e.pts||0) > 0 && counted(e)).reduce((s,e)=>s+e.pts, 0);
  const spent  = live().filter(e => (e.pts||0) < 0).reduce((s,e)=>s+Math.abs(e.pts), 0);
  const perfect = days.filter(d => dayComplete(d)).length;

  const rows = state.tasks.map(t => {
    let due = 0, done = 0;
    days.forEach(d => { if((t.days||[]).includes(dow(d)) && d <= today()){ due++; if(taskState(d,t).done) done++; } });
    return {t, due, done, pct: due ? Math.round(done/due*100) : 0};
  }).filter(x => x.due).sort((a,b) => a.pct - b.pct);

  return `<div class="card" style="margin-top:14px;">
      <h3>تقرير آخر أسبوعين</h3>
      <div class="scoreboard" style="margin-top:10px;">
        <div class="score" style="background:var(--gold-soft);color:#8A6212;"><b>${earned}</b><small>كسبها</small></div>
        <div class="score" style="background:var(--brick-soft);color:#8C3F20;"><b>${spent}</b><small>صرفها</small></div>
        <div class="score" style="background:#DFF3E8;color:#146245;"><b>${perfect}</b><small>يوم كامل</small></div>
      </div>
    </div>
    <div class="card"><h3>وين يحتاج مساعدة</h3><p class="sub">الأقل التزامًا فوق</p>
      ${rows.map(r => `<div class="lg"><span>${r.t.emoji}</span><span>${esc(r.t.title)}</span>
        <span class="muted">${r.done}/${r.due}</span>
        <b class="${r.pct>=80?'up':(r.pct<50?'dn':'')}">${r.pct}%</b></div>`).join('')}
    </div>
    <div class="card"><h3>الأيام</h3>
      ${days.slice().reverse().map(d => { const max = maxPts(d), got = gotPts(d);
        return `<div class="lg"><span>${dayComplete(d)?'🏆':'·'}</span><span>${niceDate(d)}</span>
          <b class="${got>=max&&max?'up':''}">${got}/${max}</b></div>`; }).join('')}
    </div>`;
}

/* منح أو خصم وقت مباشرة. الخانة «ترفع حد اليوم» هي اللي تخلي المنحة تتجاوز السقف —
   بدونها الوقت يدخل رصيده لكن يبقى محكومًا بحد اليوم. */
function grantMinutes(v){
  const note = (($('#gmNote')||{}).value || '').trim() || (v > 0 ? 'وقت زيادة من أمك' : 'خصم من أمك');
  const raiseCap = !!($('#gmOverCap')||{}).checked;
  putEntry({id:uid('g:'), kind:'grant', day: today(), pts:0, min:v, note, void:false});
  if(raiseCap && v > 0){
    state.capBonus = Object.assign({}, state.capBonus||{});
    state.capBonus[today()] = Number(state.capBonus[today()] || 0) + v;
    state.capBonusAt = now();
  }
  saveNow();
  cheer(v > 0 ? '+' + mins(v) + ' 🎮' : '−' + mins(Math.abs(v)));
  render(); queuePush();
}

function askPin(){
  const p = prompt('رمز شاشة الأم');
  if(p === null) return;
  if(String(p).trim() === String(state.settings.pin)){ mode = 'parent'; tab = 'inbox'; render(); }
  else cheer('الرمز غير صحيح');
}

/* =====================================================================
   الأحداث
   ===================================================================== */
document.addEventListener('click', async ev => {
  if(ev.target.id === 'sheetBg'){ closeSheet(); return; }   /* ضغطة خارج النافذة تقفلها */
  const t = ev.target.closest('button, [data-tab]');
  if(!t) return;
  const d = t.dataset;

  Sound.unlock();                       /* أي ضغطة تفكّ قفل الصوت في هذا الجهاز */

  /* اختيار دور الجهاز */
  if(d.role){ setRole(d.role); render(); return; }
  if(d.setrole){
    if(d.setrole === 'parent' && role === 'child'){    /* الترقية تمرّ بالرمز */
      const p = prompt('رمز شاشة الأم'); if(p === null) return;
      if(String(p).trim() !== String(state.settings.pin)){ cheer('الرمز غير صحيح'); return; }
    }
    setRole(d.setrole); closeSheet(); render(); return;
  }

  /* التنقل */
  if(d.tab){ tab = d.tab; render(); return; }
  if(d.gototimer){ tab = 'time'; render(); return; }

  /* الترويسة */
  if(t.id === 'btnSettings'){
    if(mode === 'parent'){ mode = 'child'; tab = 'today'; render(); }
    else if(role === 'parent'){ mode = 'parent'; tab = 'inbox'; render(); }   /* جوالها: بلا رمز */
    else askPin();
    return;
  }

  /* وقت الأجهزة */
  if(d.go){  startSession(Number(d.go), 'child');  return; }
  if(d.pgo){ startSession(Number(d.pgo), 'parent'); return; }
  if(t.id === 'stopSession'){ stopSession('manual'); cheer('وقفنا الوقت ⏹️'); return; }
  if(t.id === 'addFive'){
    const s = state.session; if(!s) return;
    s.allowMin = (s.allowMin||0) + 5; state.sessionAt = now(); saveNow();
    const r = rungOf(s.id); r.warn = 0; r.end = 0; setRung(s.id, r);
    scheduleAlarms(); cheer('+٥ دقائق'); render(); queuePush(); return;
  }
  if(t.id === 'testSound'){ Sound.play('start'); render(); return; }
  if(d.seen){ putEntry({id:d.seen, seen:true}); render(); queuePush(); return; }
  if(d.gm){ grantMinutes(Number(d.gm)); return; }
  if(t.id === 'gmGo'){
    const v = Number(($('#gmFree')||{}).value || 0);
    if(!v){ cheer('اكتبي رقم'); return; }
    grantMinutes(v); return;
  }
  if(t.id === 'saveCaps'){
    state.settings.capSchool  = Math.max(0, Number(($('#capSchool')||{}).value)  || 0);
    state.settings.capWeekend = Math.max(0, Number(($('#capWeekend')||{}).value) || 0);
    state.settings.warnMin    = Math.max(0, Number(($('#warnMin')||{}).value)    || 0);
    state.settingsAt = now(); saveNow(); scheduleAlarms(); cheer('انحفظت الحدود'); render(); queuePush(); return;
  }
  if(t.id === 'btnSync'){
    if(!cloud.linked){ openSettings(); return; }
    cheer('يتزامن…'); await cloudPush(); await cloudPull(); render(); return;
  }

  /* مهام الطفل */
  if(d.task){ toggleTask(today(), d.task); return; }
  if(d.water){ stepWater(today(), d.water, Number(d.dir)); return; }
  if(d.ptask){ toggleTask(today(), d.ptask); return; }

  /* المتجر */
  if(d.buy){
    const r = state.rewards.find(x => x.id === d.buy); if(!r) return;
    if(balance() < r.cost){ cheer('النقاط ما تكفي بعد'); return; }
    if(r.type === 'minutes'){
      putEntry({id:uid('r:'), kind:'redeem', pts:-r.cost, min:r.minutes||0, title:r.title, rewardId:r.id, status:'done', void:false});
      cheer('انضاف ' + mins(r.minutes||0) + ' 🎮');
    } else {
      putEntry({id:uid('r:'), kind:'redeem', pts:-r.cost, min:0, title:r.title, rewardId:r.id, status:'wait', void:false});
      cheer('وصل الطلب لأمك 🎁');
    }
    render(); queuePush(); return;
  }

  /* صندوق الأم */
  if(d.ok){ putEntry({id:d.ok, ok:true}); sweepBonuses(); render(); queuePush(); return; }
  if(d.no){ putEntry({id:d.no, void:true}); sweepBonuses(); render(); queuePush(); return; }
  if(t.id === 'okAll'){ pending().forEach(e => putEntry({id:e.id, ok:true})); sweepBonuses(); cheer('تأكد الكل ✅'); render(); queuePush(); return; }
  if(d.deliver){ putEntry({id:d.deliver, status:'done'}); cheer('تم التسليم 🎁'); render(); queuePush(); return; }
  if(d.cancelrw){ putEntry({id:d.cancelrw, void:true}); cheer('رجعت النقاط'); render(); queuePush(); return; }
  if(t.id === 'adjGo'){
    const pts = Number(($('#adjPts')||{}).value || 0);
    const note = (($('#adjNote')||{}).value || '').trim() || (pts >= 0 ? 'نقاط زيادة' : 'خصم');
    if(!pts){ cheer('اكتبي رقم'); return; }
    putEntry({id:uid('a:'), kind:'adjust', pts, min:0, note, day:today(), void:false});
    cheer(pts > 0 ? '+' + pts + ' 🪙' : pts + ' 🪙');
    render(); queuePush(); return;
  }

  /* إعداد المهام */
  if(t.id === 'saveTasks'){
    document.querySelectorAll('[data-tpts]').forEach(inp => {
      const task = state.tasks.find(x => x.id === inp.dataset.tpts);
      if(task) task.pts = Math.max(0, Number(inp.value) || 0);
    });
    state.tasksAt = now(); recalcTaskPoints(); saveNow(); cheer('انحفظت'); render(); queuePush(); return;
  }
  if(d.tday){
    const task = state.tasks.find(x => x.id === d.tday); if(!task) return;
    const i = Number(d.d);
    task.days = (task.days||[]).includes(i) ? task.days.filter(x => x !== i) : (task.days||[]).concat(i).sort();
    state.tasksAt = now(); saveNow(); render(); queuePush(); return;
  }
  if(t.id === 'addTask'){
    const title = (($('#ntTitle')||{}).value||'').trim(); if(!title){ cheer('اكتبي اسم المهمة'); return; }
    state.tasks.push({id:uid('t'), emoji:(($('#ntEmoji')||{}).value||'⭐').trim(), title,
      pts:Math.max(0, Number(($('#ntPts')||{}).value)||5), kind:'check', days:[0,1,2,3,4,5,6], note:''});
    state.tasksAt = now(); saveNow(); cheer('انضافت'); render(); queuePush(); return;
  }

  /* إعداد المكافآت */
  if(t.id === 'saveRewards'){
    document.querySelectorAll('[data-rcost]').forEach(inp => {
      const r = state.rewards.find(x => x.id === inp.dataset.rcost);
      if(r) r.cost = Math.max(1, Number(inp.value) || 1);
    });
    state.rewardsAt = now(); saveNow(); cheer('انحفظت'); render(); queuePush(); return;
  }
  if(d.rdel){
    state.rewards = state.rewards.filter(x => x.id !== d.rdel);
    state.rewardsAt = now(); saveNow(); render(); queuePush(); return;
  }
  if(t.id === 'addReward'){
    const title = (($('#nrTitle')||{}).value||'').trim(); if(!title){ cheer('اكتبي اسم المكافأة'); return; }
    const type = ($('#nrType')||{}).value || 'thing';
    state.rewards.push({id:uid('rw'), emoji:(($('#nrEmoji')||{}).value||'🎁').trim(), title,
      cost:Math.max(1, Number(($('#nrCost')||{}).value)||50), type,
      minutes: type === 'minutes' ? Math.max(1, Number(($('#nrMin')||{}).value)||30) : 0});
    state.rewardsAt = now(); saveNow(); cheer('انضافت'); render(); queuePush(); return;
  }

  /* الإعدادات */
  if(t.id === 'closeSheet' || t.id === 'sheetBg'){ closeSheet(); return; }
  if(t.id === 'saveChild'){
    state.child.name  = (($('#setName')||{}).value||'').trim();
    state.child.emoji = (($('#setEmoji')||{}).value||'⚽').trim();
    state.settings.approve = !!($('#setApprove')||{}).checked;
    state.childAt = now(); state.settingsAt = now(); saveNow();
    cheer('انحفظت'); closeSheet(); render(); queuePush(); return;
  }
  if(t.id === 'savePin'){
    state.settings.pin = (($('#setPin')||{}).value||'1234').trim() || '1234';
    state.settingsAt = now(); saveNow(); cheer('انحفظ الرمز'); return;
  }
  if(t.id === 'linkPull' || t.id === 'linkPush' || t.id === 'syncNow'){
    cloud.gistId = (($('#cfgGist')||{}).value||'').trim();
    cloud.token  = (($('#cfgToken')||{}).value||'').trim();
    if(!cloud.gistId || !cloud.token){ cheer('احتاج Gist ID والتوكن'); return; }
    saveCloud();
    if(t.id === 'linkPull'){
      const ok = await cloudPull({probe:true, replace:true});
      if(ok){ cloud.linked = true; saveCloud(); cheer('انربط الجهاز ✅'); }
      openSettings(); render(); return;
    }
    if(t.id === 'linkPush'){
      cloud.linked = true; saveCloud();
      const ok = await cloudPush();
      cheer(ok ? 'انرفعت البيانات ✅' : 'ما نجح الرفع');
      if(!ok){ cloud.linked = false; saveCloud(); }
      openSettings(); render(); return;
    }
    await cloudPush(); await cloudPull(); openSettings(); render(); return;
  }
  if(t.id === 'unlink'){
    if(!confirm('تفكين الربط عن هذا الجهاز؟ البيانات تبقى محفوظة هنا.')) return;
    cloud = {token:'', gistId:'', linked:false, baseVersion:null}; saveCloud();
    openSettings(); return;
  }
  if(t.id === 'expJson'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'batal-' + today() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); return;
  }
  if(t.id === 'wipe'){
    if(!confirm('تصفير كل النقاط والمهام والمكافآت؟ ما فيه رجعة.')) return;
    state = defaultState(); saveNow(); closeSheet(); render(); queuePush(); return;
  }
});

document.addEventListener('change', ev => {
  if(ev.target.id === 'nrType'){
    const w = $('#nrMinWrap'); if(w) w.style.display = ev.target.value === 'minutes' ? '' : 'none';
  }
});

/* لما تتغير قيمة نقاط مهمة، نصحح قيم أيام هذا الأسبوع الجارية عشان اللوحة تصير صادقة */
function recalcTaskPoints(){
  for(let i = 0; i < 7; i++){
    const day = addDays(today(), -i);
    tasksFor(day).forEach(t => {
      const e = entry(tKey(day, t.id));
      if(e && !e.void){
        const n = t.kind === 'count' ? (e.n||0) : 1;
        const p = n * t.pts;
        if(p !== e.pts){ e.pts = p; e.at = now(); }
      }
    });
  }
  sweepBonuses();
}

/* =====================================================================
   الإقلاع
   ===================================================================== */
(async function boot(){
  loadCloud();
  loadRole();
  loadLocal();
  if(role) mode = role === 'parent' ? 'parent' : 'child';
  tab = mode === 'parent' ? 'inbox' : 'today';
  sweepBonuses();
  render();
  if(cloud.linked){ await cloudPull(); checkAlarms(); render(); if(state._pendingSync) cloudPush(); }
  startAutoSync();
  scheduleAlarms();
  if(sessionActive()){ Sound.keepAlive(true); holdScreen(true); }

  /* نبضة الثانية: تحدّث العدّاد وتفحص الصافرات بلا إعادة رسم الصفحة */
  let lastActive = sessionActive();
  setInterval(() => {
    const on = sessionActive();
    if(on) checkAlarms();
    paintTimer();
    if(on !== lastActive){ lastActive = on; render(); }   /* بدأت أو خلصت من الجهاز الثاني */
  }, 1000);

  /* يوم جديد؟ أعِد الرسم */
  let lastDay = today();
  setInterval(() => { if(today() !== lastDay){ lastDay = today(); sweepBonuses(); render(); } }, 60000);

  if('serviceWorker' in navigator){
    try{ await navigator.serviceWorker.register('sw.js'); }catch(e){}
  }
})();
</script>
